  // Si la diferencia coincide con el saldo, no es una linea faltante sino deuda vieja
  const difEsSaldo = saldoAnt > 0 && Math.abs(Math.abs(sumaItems - baseCmp) - saldoAnt) < Math.max(1, saldoAnt * 0.02);
  // Descuento real deducido de los numeros (mas confiable que lo que lee la IA)
  const descReal = sumaItems > 0 && totalRemito > 0 && totalRemito < sumaItems
    ? Math.round((1 - totalRemito / sumaItems) * 1000) / 10
    : null;

  // Costo total del remito (solo lo que matcheo y tiene costo)
  const costoTotal = conMatch.reduce((s, x) => {
    if (!x.m || x.m.costo_total === null) return s;
    return s + Number(x.m.costo_total) * Number(x.it.cantidad || 1);
  }, 0);
  const sinCosto = conMatch.filter(x => x.m && x.m.codigo && x.m.costo_total === null).length;
  const sinMatch = conMatch.filter(x => x.m && !x.m.codigo).length;
  const margen = totalRemito - costoTotal;

  return (
    <div style={{ background: "#FFFFFF", borderRadius: 8, padding: 10 }}>
      <p style={{ fontSize: 10, color: "#A85D43", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>✓ Detectado</p>

      {visible.map((x, i) => {
        const est = x.m ? ESTILO[x.m.estado] : null;
        return (
          <div key={i} style={{ marginBottom: 6, paddingBottom: 6, borderBottom: "1px solid #F4E6DE" }}>
            <p style={{ fontSize: 11, color: "#5A3828", margin: 0 }}>
              {x.it.cantidad}x {x.it.codigo ? <b>[{x.it.codigo}] </b> : ""}{x.it.descripcion} — {fmtPeso(x.it.total)}
            </p>
            {x.m && (
              <p style={{ fontSize: 10, color: est.color, margin: "2px 0 0 0", fontWeight: 600 }}>
                {est.txt}
                {x.m.codigo ? ` ${x.m.codigo} — ${x.m.descripcion}` : ""}
                {x.m.codigo && x.m.costo_total !== null ? ` · costo ${fmtPeso(x.m.costo_total)}` : ""}
                {x.m.codigo && x.m.costo_total === null ? " · ⚠ sin costo cargado" : ""}
              </p>
            )}
            {x.m && (x.m.estado === "conjunto" || modoConjunto[i]) && (() => {
              const base = candidatosConjunto(x.it.descripcion, catalogo);
              const qConj = busqConj[i] || "";
              const extra = qConj ? buscarEnCatalogo(qConj) : [];
              const yaSel = (selConjunto[i] || [])
                .map(cod => (catalogo || []).find(a => canonCodigo(a.codigo) === canonCodigo(cod)))
                .filter(Boolean);
              const vistos = new Set();
              const opciones = [...yaSel, ...extra, ...base].filter(o => {
                const k = normCodigo(o.codigo);
                if (vistos.has(k)) return false;
                vistos.add(k); return true;
              });
              const sel = selConjunto[i] || [];
              const costoSel = yaSel.reduce((s, o) => s + Number(o.costo_total || 0), 0);
              return (
                <div style={{ margin: "4px 0 0 0" }}>
                  <input className="input" value={qConj}
                    onChange={e => setBusqConj(b => ({ ...b, [i]: e.target.value }))}
                    placeholder="Buscar más artículos por código o descripción..."
                    style={{ width: "100%", fontSize: 11, marginBottom: 6 }} />
                  {opciones.length === 0 && !qConj && (
                    <p style={{ fontSize: 10, color: "#B3261E", margin: 0 }}>
                      No encontré artículos con esas palabras — buscalos arriba
                    </p>
                  )}
                  {opciones.length > 0 && (
                    <div>
                      <p style={{ fontSize: 10, color: "#7A5848", margin: "0 0 3px 0" }}>
                        Marcá los {sel.length >= 2 ? sel.length : "2 o más"} artículos que forman el conjunto:
                      </p>
                      <div style={{ display: "flex", flexDirection: "column", gap: 3, maxHeight: 160, overflowY: "auto" }}>
                        {opciones.map((o, j) => {
                          const marcado = sel.includes(o.codigo);
                          return (
                            <button key={j} onClick={() => toggleComponente(i, o.codigo)}
                              style={{ background: marcado ? "#7C3AED" : "#FFF8F5",
                                       color: marcado ? "#fff" : "#5A3828",
                                       border: `1px solid ${marcado ? "#7C3AED" : "#D4A090"}`,
                                       borderRadius: 6, padding: "4px 8px", fontSize: 10,
                                       cursor: "pointer", fontFamily: "inherit", textAlign: "left" }}>
                              {marcado ? "☑ " : "☐ "}<b>{o.codigo}</b> — {o.descripcion}
                              {o.costo_total !== null ? ` · $${o.costo_total}` : " · sin costo"}
                            </button>
                          );
                        })}
                      </div>
                      {sel.length >= 2 && (
                        <button onClick={() => guardarConjunto(x.it.descripcion, i)}
                          style={{ marginTop: 6, background: "#7C3AED", color: "#fff", border: "none",
                                   borderRadius: 6, padding: "5px 10px", fontSize: 11, cursor: "pointer",
                                   fontFamily: "inherit", fontWeight: 600 }}>
                          Guardar conjunto de {sel.length} · costo {fmtPeso(costoSel)}
                        </button>
                      )}
                    </div>
                  )}
                </div>
              );
            })()}

            {x.m && (x.m.estado === "revisar" || x.m.estado === "sin_match" || x.m.estado === "similar" || x.m.estado === "ambiguo") && x.m.candidatos.length > 0 && (
              <div style={{ margin: "4px 0 0 0" }}>
                <p style={{ fontSize: 10, color: "#7A5848", margin: "0 0 3px 0" }}>
                  Tocá el correcto y queda recordado para siempre:
                </p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                  {x.m.candidatos.map((cd, j) => {
                    const esElegido = guardado[i] === cd.codigo;
                    return (
                      <button key={j} onClick={() => elegir(x.it.descripcion, cd.codigo, i)}
                        style={{ background: esElegido ? "#10B981" : "#FFF8F5",
                                 color: esElegido ? "#fff" : "#5A3828",
                                 border: `1px solid ${esElegido ? "#10B981" : "#D4A090"}`,
                                 borderRadius: 6, padding: "4px 8px", fontSize: 10,
                                 cursor: "pointer", fontFamily: "inherit", textAlign: "left", maxWidth: "100%" }}>
                        {esElegido ? "✓ " : ""}<b>{cd.codigo}</b> — {cd.descripcion} ({Math.round(cd.score * 100)}%)
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
            {guardado[i] && (
              <p style={{ fontSize: 10, color: "#10B981", margin: "3px 0 0 0", fontWeight: 600 }}>
                ✓ Guardado: de ahora en más "{x.it.descripcion}" va a matchear solo con {guardado[i]}
              </p>
            )}

            {/* Corrector universal: sirve tambien cuando el match salio verde pero esta mal */}
            {x.m && x.m.estado !== "conjunto" && (
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                <button onClick={() => { setCorrigiendo(corrigiendo === i ? null : i); setBusquedaArt(""); }}
                  style={{ background: "none", border: "none", color: "#A85D43", cursor: "pointer",
                           fontSize: 10, padding: "3px 0", textDecoration: "underline", fontFamily: "inherit" }}>
                  {corrigiendo === i ? "Cerrar" : (x.m.codigo ? "No es este / cambiar" : "Buscar en el catálogo")}
                </button>
                <button onClick={() => {
                    setModoConjunto(m => ({ ...m, [i]: !m[i] }));
                    setCorrigiendo(null);
                  }}
                  style={{ background: "none", border: "none", color: "#7C3AED", cursor: "pointer",
                           fontSize: 10, padding: "3px 0", textDecoration: "underline", fontFamily: "inherit" }}>
                  {modoConjunto[i] ? "Volver a un solo artículo" : "⊞ Son varios artículos"}
                </button>
              </div>
            )}

            {corrigiendo === i && (
              <div style={{ marginTop: 4, background: "#FFF0E8", borderRadius: 6, padding: 8 }}>
                <input className="input" value={busquedaArt} onChange={e => setBusquedaArt(e.target.value)}
                  placeholder="Buscar por código o descripción..." autoFocus
                  style={{ width: "100%", fontSize: 12, marginBottom: 6 }} />
                {busquedaArt && (() => {
                  const res = buscarEnCatalogo(busquedaArt);
                  if (!res.length) return <p style={{ fontSize: 10, color: "#B3261E", margin: 0 }}>Nada encontrado</p>;
                  return (
                    <div style={{ display: "flex", flexDirection: "column", gap: 3, maxHeight: 150, overflowY: "auto" }}>
                      {res.map((o, j) => (
                        <button key={j} onClick={() => { elegir(x.it.descripcion, o.codigo, i); setCorrigiendo(null); }}
                          style={{ background: "#FFF8F5", color: "#5A3828", border: "1px solid #D4A090",
                                   borderRadius: 6, padding: "4px 8px", fontSize: 10, cursor: "pointer",
                                   fontFamily: "inherit", textAlign: "left" }}>
                          <b>{o.codigo}</b> — {o.descripcion}
                          {o.costo_total !== null ? ` · $${o.costo_total}` : " · sin costo"}
                        </button>
                      ))}
                    </div>
                  );
                })()}
                <p style={{ fontSize: 9, color: "#7A5848", marginTop: 6, marginBottom: 0 }}>
                  Lo que elijas pisa el alias anterior de esta descripción.
                </p>
              </div>
            )}
          </div>
        );
      })}

      {conMatch.length > 3 && (
        <button onClick={() => setExpanded(e => !e)} style={{ background: "none", border: "none", color: "#A85D43", cursor: "pointer", fontSize: 11, padding: "4px 0", textDecoration: "underline" }}>
          {expanded ? "Ver menos ▲" : `+${conMatch.length - 3} más... Ver todos ▼`}
        </button>
      )}

      {extracted.descuento && <p style={{ fontSize: 11, color: "#F87171", marginTop: 4 }}>Descuento: -{fmtPeso(extracted.descuento)}</p>}
      <p style={{ fontSize: 13, fontWeight: 700, color: "#A85D43", marginTop: 4 }}>Total: {fmtPeso(totalRemito)}</p>

      {saldoAnt > 0 && (
        <p style={{ fontSize: 11, color: "#8A5A2B", marginTop: 4, fontWeight: 600 }}>
          Saldo anterior detectado: {fmtPeso(saldoAnt)} — no cuenta como venta ni entra en el margen
        </p>
      )}

      {descReal !== null && descReal > 0.5 && (
        <p style={{ fontSize: 11, color: "#7A5848", marginTop: 2 }}>
          Items suman {fmtPeso(sumaItems)} → descuento aplicado ≈ {descReal}%
        </p>
      )}

      {descuadre && !difEsSaldo && (
        <p style={{ fontSize: 11, color: "#B3261E", fontWeight: 600, marginTop: 4 }}>
          ⚠ Los items suman {fmtPeso(sumaItems)} y el subtotal dice {fmtPeso(baseCmp)} — falta o sobra alguna línea
        </p>
      )}

      {hayCat && items.length > 0 && (
        <div style={{ marginTop: 8, paddingTop: 8, borderTop: "1px solid #E8C4B0" }}>
          <p style={{ fontSize: 11, color: "#5A3828", margin: 0 }}>
            Costo: {fmtPeso(costoTotal)} · Margen estimado: <b style={{ color: margen > 0 ? "#10B981" : "#B3261E" }}>{fmtPeso(margen)}</b>
          </p>
          {(sinCosto > 0 || sinMatch > 0) && (
            <p style={{ fontSize: 10, color: "#B3261E", margin: "2px 0 0 0" }}>
              ⚠ Margen incompleto: {sinMatch > 0 ? `${sinMatch} sin identificar` : ""}{sinMatch > 0 && sinCosto > 0 ? " · " : ""}{sinCosto > 0 ? `${sinCosto} sin costo cargado` : ""}
            </p>
          )}
          {sinCosto === 0 && sinMatch === 0
            ? <p style={{ fontSize: 10, color: "#10B981", margin: "4px 0 0 0", fontWeight: 600 }}>
                ✓ Al guardar queda con el costo completo — suma a la ganancia
              </p>
            : <p style={{ fontSize: 10, color: "#8A5A2B", margin: "4px 0 0 0", fontWeight: 600 }}>
                Si guardás así, la venta queda SIN costo y no suma a la ganancia. Resolvé los ⚠ para que cuente.
              </p>}
        </div>
      )}

      {errorAlias && (
        <p style={{ fontSize: 10, color: "#B3261E", marginTop: 6 }}>
          No se pudo guardar el alias: {errorAlias}
        </p>
      )}

      {!hayCat && (
        <p style={{ fontSize: 10, color: "#7A5848", marginTop: 6 }}>Catálogo no cargado — sin matching de artículos</p>
      )}
    </div>
  );
}

function NuevaVenta({ vendedoras, clientes, addVenta, fmtPeso, catalogo, aliases, guardarAlias, aliasClientes }) {
  const fileRef = useRef();
  const fileRefMulti = useRef();

  const [queue, setQueue] = useState([]);
  const [activeIdx, setActiveIdx] = useState(null);
  const [savedCount, setSavedCount] = useState(0);
  const [manualOpen, setManualOpen] = useState(false);
  const [manualSaved, setManualSaved] = useState(false);
  const [guardandoIdx, setGuardandoIdx] = useState(null);
  const [saveError, setSaveError] = useState(null);
  const [manualError, setManualError] = useState(null);
  const [fotoAmpliada, setFotoAmpliada] = useState(null);
  const [zoom, setZoom] = useState(1);

  // ── Mes del lote que se está cargando ──
  const MESES_N = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const hoyStr = () => hoyLocal();
  const mesActualKey = hoyStr().substring(0, 7);
  const [mesLote, setMesLote] = useState(mesActualKey);

  // Si el lote es del mes actual usa el día de hoy; si es de un mes anterior usa el día 15
  const fechaLote = (mk = mesLote) => mk === mesActualKey ? hoyStr() : `${mk}-15`;

  // La fecha se le estampa a cada foto cuando entra a la cola. Si se cambia el mes
  // DESPUES de cargarlas, hay que re-estampar las que todavia no se guardaron: si no,
  // el cartel dice una fecha y se guarda otra.
  const cambiarMesLote = (mk) => {
    setMesLote(mk);
    const nuevaFecha = fechaLote(mk);
    setQueue(q => q.map(it => ({ ...it, form: { ...it.form, fecha: nuevaFecha } })));
    setManualForm(f => ({ ...f, fecha: nuevaFecha }));
  };

  // Últimos 4 meses como opciones
  const opcionesMes = (() => {
    const out = [];
    const d = new Date();
    d.setDate(1);
    for (let i = 0; i < 4; i++) {
      const y = d.getFullYear(), m = d.getMonth();
      out.push({ key: `${y}-${String(m + 1).padStart(2, "0")}`, label: `${MESES_N[m]} ${y}` });
      d.setMonth(d.getMonth() - 1);
    }
    return out;
  })();

  // Arranca con la fecha del lote elegido, igual que las fotos (antes usaba siempre hoy
  // y la carga manual ignoraba el selector de mes).
  const [manualForm, setManualForm] = useState({ cliente: "", vendedoraId: "", total: "", fecha: fechaLote(), nota: "" });

  const defaultForm = () => ({
    cliente: "", vendedoraId: "", total: "",
    fecha: fechaLote(), nota: ""
  });

  const buildForm = (extracted, prevForm) => {
    const leido = (extracted?.cliente || "").trim();
    // Si ese nombre mal leido ya fue unificado, se usa el nombre real
    const real = aliasClientes?.[leido.toLowerCase()] || null;
    const clienteFinal = real || leido;
    const clienteLower = clienteFinal.toLowerCase().trim();
    const vendedoraIdAuto = buscarCliente(clienteLower, clientes) || "";
    // El saldo anterior YA NO se resta solo. La condicion que habia ("el total leido es
    // mayor que la suma de los renglones") erraba en las dos direcciones: con descuento
    // no restaba cuando debia (y la deuda vieja se guardaba como venta), y con un renglon
    // mal leido restaba cuando no debia (y la venta quedaba corta). Ahora se muestra el
    // saldo y lo decide la persona, que tiene la foto delante.
    const totalFinal = extracted?.totalConDescuento ?? extracted?.total ?? "";
    const saldo = Number(extracted?.saldoAnterior || 0);

    // ── Total del remito ──
    // Los renglones suman el BRUTO (antes del descuento), asi que la comparacion
    // honesta es contra extracted.total. Si solo hay total con descuento, la
    // diferencia puede ser el descuento y no un error de lectura.
    const renglones = extracted?.items || [];
    const sumaItems = renglones.reduce((s, it) => s + Number(it.total || 0), 0);
    const leidoNum = Number(totalFinal);
    const hayLeido = totalFinal !== null && totalFinal !== undefined && totalFinal !== ""
                     && Number.isFinite(leidoNum) && leidoNum > 0;
    const bruto = Number(extracted?.total ?? 0);
    const descuento = bruto > 0 && hayLeido && leidoNum < bruto ? bruto - leidoNum : 0;

    let total, autoSumado = false, discrepancia = null;

    if (!hayLeido && sumaItems > 0) {
      // No se pudo leer el total: lo completamos sumando los renglones.
      total = sumaItems;
      autoSumado = true;
    } else {
      total = hayLeido ? leidoNum : (prevForm?.total || "");

      // Hay total leido Y renglones: si no cierran, lo decide la persona.
      const base = bruto > 0 ? bruto : leidoNum;
      const dif = Math.abs(sumaItems - base);
      // El saldo anterior explica la diferencia sin que haya nada mal leido.
      const difEsElSaldo = saldo > 0 && Math.abs(dif - saldo) < Math.max(1, saldo * 0.02);
      if (hayLeido && sumaItems > 0 && base > 0 && dif > Math.max(1, base * 0.02) && !difEsElSaldo) {
        discrepancia = {
          leido: leidoNum,
          suma: sumaItems,
          // Si el remito tenia descuento, se le aplica el mismo al total sumado,
          // para que las dos opciones sean comparables.
          sugerido: Math.round(sumaItems - descuento),
          descuento,
        };
      }
    }

    return {
      cliente: clienteFinal || prevForm?.cliente || "",
      _clienteLeido: real ? leido : null,
      _saldoAnterior: saldo > 0 ? saldo : null,
      _totalAutoSumado: autoSumado ? sumaItems : null,
      _discrepancia: discrepancia,
      vendedoraId: vendedoraIdAuto ? String(vendedoraIdAuto) : (prevForm?.vendedoraId || ""),
      total,
      fecha: fechaLote(),
      nota: prevForm?.nota || "",
    };
  };

  // Leer archivos como dataUrl (base64) — funciona en todos los entornos
  const addFiles = async (files) => {
    const arr = Array.from(files);
    const newItems = await Promise.all(arr.map(async (file) => {
      const dataUrl = await new Promise((res) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.readAsDataURL(file);
      });
      return {
        id: Date.now() + Math.random(),
        dataUrl,
        mediaType: file.type || "image/jpeg",
        status: "pending",
        extracted: null,
        form: defaultForm(),
      };
    }));
    setQueue(q => {
      const updated = [...q, ...newItems];
      // Si no hay activo, activar el primero
      if (activeIdx === null && updated.length > 0) setActiveIdx(0);
      return updated;
    });
  };

  // Procesar pendientes de a 3 en paralelo
  useEffect(() => {
    const CONCURRENCY = 3;
    const processing = queue.filter(i => i.status === "processing").length;
    const pending = queue.filter(i => i.status === "pending");
    const slots = CONCURRENCY - processing;
    if (slots <= 0 || pending.length === 0) return;

    const toProcess = pending.slice(0, slots);
    setQueue(q => q.map(item =>
      toProcess.find(t => t.id === item.id) ? { ...item, status: "processing" } : item
    ));

    toProcess.forEach(async (item) => {
      try {
        const base64 = item.dataUrl.split(",")[1];
        const extracted = await extraerDatosFotoBase64(base64, item.mediaType);
        setQueue(q => q.map(it => it.id === item.id ? {
          ...it, status: "done", extracted,
          form: buildForm(extracted, it.form),
        } : it));
      } catch (e) {
        console.error(e);
        setQueue(q => q.map(it => it.id === item.id ? { ...it, status: "error", errorMsg: e.message || "Error desconocido" } : it));
      }
    });
  }, [queue]);

  const updateForm = (idx, field, value) => {
    setQueue(q => q.map((it, i) => i === idx ? { ...it, form: { ...it.form, [field]: value } } : it));
  };

  // La foto sale de la cola SOLO si Supabase confirmo que guardo. Antes se sacaba
  // siempre y se sumaba al contador, asi que un error de red borraba la venta sin aviso.
  const saveItem = async (idx) => {
    const item = queue[idx];
    if (!item || !item.form.vendedoraId || !item.form.total) return;
    if (guardandoIdx !== null) return;
    setGuardandoIdx(idx);
    setSaveError(null);

    const cost = costearVenta(item.extracted, catalogo, aliases);
    // Los campos con _ son de pantalla, no columnas de la tabla: si se mandan,
    // Supabase rechaza el insert entero. Se filtran por prefijo y no uno por uno,
    // para que agregar un campo de pantalla nuevo no rompa el guardado.
    const formLimpio = Object.fromEntries(
      Object.entries(item.form).filter(([k]) => !k.startsWith("_")));
    const r = await addVenta({
      ...formLimpio,
      vendedoraId: Number(item.form.vendedoraId),
      total: Number(item.form.total),
      costo_total: cost.costoTotal,
      _itemsCosto: cost.filas,
    });

    setGuardandoIdx(null);
    if (!r.ok) {
      setSaveError("NO se guardó: " + r.error + " — la foto sigue acá, probá de nuevo.");
      return;
    }
    if (r.avisos.length) setSaveError("⚠ " + r.avisos.join(" · "));
    setQueue(q => {
      const next = q.filter(it => it.id !== item.id);
      setActiveIdx(next.length > 0 ? 0 : null);
      return next;
    });
    setSavedCount(c => c + 1);
  };

  const removeItem = (idx) => {
    setQueue(q => {
      const next = q.filter((_, i) => i !== idx);
      setActiveIdx(next.length > 0 ? 0 : null);
      return next;
    });
  };

  const retryItem = (idx) => {
    setQueue(q => q.map((it, i) => i === idx ? { ...it, status: "pending", errorMsg: null } : it));
  };

  // Al cambiar de foto se limpia el aviso de guardado, que era de la foto anterior
  const irAFoto = (idx) => { setActiveIdx(idx); setSaveError(null); };

  const activeItem = activeIdx !== null && queue[activeIdx] ? queue[activeIdx] : null;
  const pendingCount = queue.filter(i => i.status === "pending" || i.status === "processing").length;
  const doneCount = queue.filter(i => i.status === "done").length;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>

      {/* Visor de foto — panel lateral, no tapa la pantalla */}
      {fotoAmpliada && (
        <div style={{ position: "fixed", top: 0, right: 0, bottom: 0,
                      width: "min(38vw, 400px)", minWidth: 220,
                      background: "rgba(20,10,6,0.96)", zIndex: 9999,
                      display: "flex", flexDirection: "column",
                      boxShadow: "-4px 0 20px rgba(0,0,0,0.4)" }}>
          <div style={{ display: "flex", gap: 5, padding: 8, alignItems: "center",
                        borderBottom: "1px solid rgba(255,255,255,0.15)", flexWrap: "wrap" }}>
            <button onClick={() => setZoom(z => Math.max(0.4, z - 0.2))}
              style={{ background: "#FFF8F5", border: "none", borderRadius: 5, padding: "5px 10px",
                       fontSize: 14, cursor: "pointer", fontFamily: "inherit", fontWeight: 700 }}>−</button>
            <span style={{ color: "#fff", fontSize: 11, minWidth: 40, textAlign: "center" }}>
              {Math.round(zoom * 100)}%
            </span>
            <button onClick={() => setZoom(z => Math.min(4, z + 0.2))}
              style={{ background: "#FFF8F5", border: "none", borderRadius: 5, padding: "5px 10px",
                       fontSize: 14, cursor: "pointer", fontFamily: "inherit", fontWeight: 700 }}>+</button>
            <button onClick={() => setZoom(1)}
              style={{ background: "#FFF8F5", border: "none", borderRadius: 5, padding: "5px 8px",
                       fontSize: 10, cursor: "pointer", fontFamily: "inherit" }}>Ajustar</button>
            <button onClick={() => setFotoAmpliada(null)}
              style={{ background: "#A85D43", color: "#fff", border: "none", borderRadius: 5,
                       padding: "5px 9px", fontSize: 10, cursor: "pointer", fontFamily: "inherit",
                       fontWeight: 600, marginLeft: "auto" }}>✕</button>
          </div>
          <div style={{ flex: 1, overflow: "auto", padding: 6 }}>
            <img src={fotoAmpliada} alt="" onClick={() => setZoom(z => z >= 2 ? 1 : z + 0.4)}
              style={{ width: `${zoom * 100}%`, height: "auto", cursor: "zoom-in",
                       borderRadius: 4, display: "block" }} />
          </div>
        </div>
      )}

      {/* Zona de carga */}
      <div className="card" style={{ textAlign: "center" }}>
        <p style={{ fontSize: 11, color: "#6B4A3E", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 14 }}>Cargar comprobantes</p>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center" }}>
          <input ref={fileRefMulti} type="file" accept="image/*" multiple style={{ display: "none" }}
            onChange={e => { addFiles(e.target.files); e.target.value = ""; }} />
          <button className="btn btn-primary" onClick={() => fileRefMulti.current?.click()}
            style={{ padding: "14px 24px", fontSize: 14, display: "flex", alignItems: "center", gap: 8 }}>
            🖼️ Elegir fotos (múltiples)
          </button>
          <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }}
            onChange={e => { addFiles(e.target.files); e.target.value = ""; }} />
          <button onClick={() => fileRef.current?.click()}
            style={{ background: "#FFF8F5", border: "1px solid #2A2A3E", borderRadius: 8, color: "#2C1A14", padding: "14px 24px", fontSize: 14, cursor: "pointer", fontFamily: "'DM Sans',sans-serif", display: "flex", alignItems: "center", gap: 8 }}>
            📷 Sacar foto ahora
          </button>
          <button onClick={() => setManualOpen(true)}
            style={{ background: "#FFF8F5", border: "1px solid #D4A090", borderRadius: 8, color: "#2C1A14", padding: "14px 24px", fontSize: 14, cursor: "pointer", fontFamily: "'DM Sans',sans-serif", display: "flex", alignItems: "center", gap: 8 }}>
            ✏️ Carga manual
          </button>
        </div>
        <p style={{ fontSize: 12, color: "#7A5848", marginTop: 10 }}>Seleccioná todas las fotos del día de una vez — desde el carrete o reenviadas de WhatsApp</p>

        {/* Mes del lote */}
        <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid #E8C4B0" }}>
          <label style={{ fontSize: 12, color: "#5A3828", marginBottom: 6, display: "block" }}>Mes de estas ventas</label>
          <select className="input" value={mesLote} onChange={e => cambiarMesLote(e.target.value)} style={{ maxWidth: 220, margin: "0 auto" }}>
            {opcionesMes.map(o => <option key={o.key} value={o.key}>{o.label}</option>)}
          </select>
          {mesLote !== mesActualKey && (
            <p style={{ fontSize: 12, color: "#A85D43", fontWeight: 600, marginTop: 8 }}>
              ⚠ Cargando ventas de {opcionesMes.find(o => o.key === mesLote)?.label} — se guardarán con fecha {fechaLote()}
              {queue.length > 0 ? ` (ya aplicado a las ${queue.length} fotos en cola)` : ""}
            </p>
          )}
        </div>
        {savedCount > 0 && <p style={{ marginTop: 10, fontSize: 13, color: "#10B981", fontWeight: 600 }}>✓ {savedCount} {savedCount === 1 ? "venta guardada" : "ventas guardadas"}</p>}
      </div>

      {/* Cola */}
      {queue.length > 0 && (
        <div>
          {/* Miniaturas */}
          <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 8, marginBottom: 16 }}>
            {queue.map((item, idx) => (
              <div key={item.id} onClick={() => irAFoto(idx)}
                style={{ position: "relative", flexShrink: 0, width: 64, height: 64, borderRadius: 8, overflow: "hidden", cursor: "pointer",
                  border: `2px solid ${activeIdx === idx ? "#A85D43" : item.status === "done" ? "#10B981" : item.status === "error" ? "#F87171" : "#D4A090"}`,
                  transition: "border 0.2s" }}>
                <img src={item.dataUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  {item.status === "processing" && <><span className="loading-dot"/><span className="loading-dot"/><span className="loading-dot"/></>}
                  {item.status === "done" && <span style={{ fontSize: 20, color: "#10B981" }}>✓</span>}
                  {item.status === "error" && <span style={{ fontSize: 20, color: "#F87171" }}>✕</span>}
                  {item.status === "pending" && <span style={{ fontSize: 10, color: "#5A3828" }}>espera</span>}
                </div>
                <button onClick={e => { e.stopPropagation(); removeItem(idx); }}
                  style={{ position: "absolute", top: 2, right: 2, background: "rgba(0,0,0,0.75)", border: "none", borderRadius: "50%", width: 18, height: 18, color: "#fff", cursor: "pointer", fontSize: 11, lineHeight: "18px", textAlign: "center", padding: 0 }}>×</button>
              </div>
            ))}
          </div>

          {pendingCount > 0 && (
            <p style={{ fontSize: 12, color: "#5A3828", marginBottom: 12 }}>
              <span className="loading-dot"/><span className="loading-dot"/><span className="loading-dot"/>
              {" "}Procesando {pendingCount} foto{pendingCount > 1 ? "s" : ""}...
            </p>
          )}

          {/* Form item activo */}
          {activeItem && (
            <div className="card" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <p style={{ fontSize: 11, color: "#6B4A3E", letterSpacing: "0.1em", textTransform: "uppercase" }}>
                  Foto {activeIdx + 1} de {queue.length}
                </p>
                <div style={{ display: "flex", gap: 6 }}>
                  {activeIdx > 0 && <button onClick={() => irAFoto(activeIdx - 1)} style={{ background: "#FFF8F5", border: "1px solid #2A2A3E", borderRadius: 6, color: "#5A3828", padding: "4px 10px", cursor: "pointer", fontSize: 12 }}>← Ant</button>}
                  {activeIdx < queue.length - 1 && <button onClick={() => irAFoto(activeIdx + 1)} style={{ background: "#FFF8F5", border: "1px solid #2A2A3E", borderRadius: 6, color: "#5A3828", padding: "4px 10px", cursor: "pointer", fontSize: 12 }}>Sig →</button>}
                </div>
              </div>

              {/* Preview + datos */}
              <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
                <div style={{ flexShrink: 0, textAlign: "center" }}>
                  <img src={activeItem.dataUrl} alt="" onClick={() => { setFotoAmpliada(activeItem.dataUrl); setZoom(1); }}
                    style={{ width: 90, height: 90, objectFit: "cover", borderRadius: 8, border: "1px solid #2A2A3E", cursor: "zoom-in", display: "block" }} />
                  <button onClick={() => { setFotoAmpliada(activeItem.dataUrl); setZoom(1); }}
                    style={{ background: "none", border: "none", color: "#A85D43", cursor: "pointer", fontSize: 10,
                             padding: "3px 0", textDecoration: "underline", fontFamily: "inherit" }}>
                    🔍 Ver grande
                  </button>
                </div>
                <div style={{ flex: 1 }}>
                  {activeItem.status === "processing" && (
                    <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 0" }}>
                      <span className="loading-dot"/><span className="loading-dot"/><span className="loading-dot"/>
                      <span style={{ fontSize: 13, color: "#5A3828" }}>Leyendo comprobante...</span>
                    </div>
                  )}
                  {activeItem.status === "error" && (
                    <div style={{ padding: "10px 0" }}>
                      <p style={{ fontSize: 13, color: "#F87171", marginBottom: 6 }}>Error: {activeItem.errorMsg || "No se pudo procesar"}</p>
                      <button onClick={() => retryItem(activeIdx)} style={{ background: "#F59E0B22", border: "1px solid #F59E0B", borderRadius: 6, color: "#A85D43", padding: "6px 14px", cursor: "pointer", fontSize: 12, fontFamily: "'DM Sans',sans-serif" }}>
                        🔄 Reintentar
                      </button>
                    </div>
                  )}
                  {activeItem.extracted && (
                    // El `key` es imprescindible: sin el, React reusa el mismo panel al pasar
                    // de una foto a otra y se arrastran las correcciones a medias de la anterior
                    // (llegaba a guardar un alias con los codigos del remito anterior).
                    <ItemsDetectados key={activeItem.id} extracted={activeItem.extracted} fmtPeso={fmtPeso} catalogo={catalogo} aliases={aliases} guardarAlias={guardarAlias} totalForm={activeItem.form.total} />
                  )}
                </div>
              </div>

              {/* Campos */}
              <div>
                <label style={{ fontSize: 12, color: "#5A3828", marginBottom: 6, display: "block" }}>Cliente</label>
                <input className="input" value={activeItem.form.cliente}
                  onChange={e => {
                    const val = e.target.value;
                    updateForm(activeIdx, "cliente", val);
                    const auto = buscarCliente(val, clientes);
                    if (auto) updateForm(activeIdx, "vendedoraId", String(auto));
                  }} placeholder="Nombre del cliente" />
                {activeItem.form._clienteLeido && (
                  <p style={{ fontSize: 11, color: "#A85D43", marginTop: 4, fontWeight: 600 }}>
                    ✓ Corregido — la foto decía "{activeItem.form._clienteLeido}"
                  </p>
                )}
                {activeItem.form.cliente && buscarCliente(activeItem.form.cliente, clientes) && (
                  <p style={{ fontSize: 11, color: "#10B981", marginTop: 4 }}>
                    ✓ Cliente conocido → {vendedoras.find(v => v.id === buscarCliente(activeItem.form.cliente, clientes))?.nombre}
                  </p>
                )}
              </div>

              <div>
                <label style={{ fontSize: 12, color: "#5A3828", marginBottom: 6, display: "block" }}>Vendedora</label>
                <select className="input" value={activeItem.form.vendedoraId}
                  onChange={e => updateForm(activeIdx, "vendedoraId", e.target.value)}>
                  <option value="">Seleccionar...</option>
                  {vendedoras.map(v => <option key={v.id} value={v.id}>{v.nombre} ({v.comision}%)</option>)}
                </select>
              </div>

              <div className="grid2">
                <div>
                  <label style={{ fontSize: 12, color: "#5A3828", marginBottom: 6, display: "block" }}>Total venta</label>
                  <input className="input" type="number" value={activeItem.form.total}
                    onChange={e => updateForm(activeIdx, "total", e.target.value)} placeholder="0" />
                </div>
                <div>
                  <label style={{ fontSize: 12, color: "#5A3828", marginBottom: 6, display: "block" }}>Fecha</label>
                  <input className="input" type="date" value={activeItem.form.fecha}
                    onChange={e => updateForm(activeIdx, "fecha", e.target.value)} />
                </div>
              </div>

              {/* El remito no traía total legible: se completó sumando los renglones */}
              {activeItem.form._totalAutoSumado > 0 && (
                <div style={{ background: "#FFF4E6", border: "1px solid #E8C4B0", borderRadius: 8, padding: "10px 12px" }}>
                  <p style={{ fontSize: 12, color: "#8A5A2B", fontWeight: 600, margin: 0 }}>
                    ℹ️ El remito no traía un total legible — lo puse sumando los {(activeItem.extracted?.items || []).length} renglones
                  </p>
                  <p style={{ fontSize: 11, color: "#7A5848", margin: "4px 0 0 0" }}>
                    Quedó en {fmtPeso(activeItem.form._totalAutoSumado)}. Si en la foto dice otra cosa, corregilo arriba a mano.
                  </p>
                </div>
              )}

              {/* El total leído y la suma de los renglones no cierran: elige la persona */}
              {activeItem.form._discrepancia && (() => {
                const d = activeItem.form._discrepancia;
                const elegir = (valor) => {
                  updateForm(activeIdx, "total", String(valor));
                  updateForm(activeIdx, "_discrepancia", null);
                };
                const elegido = Number(activeItem.form.total);
                const btn = (activo) => ({
                  background: activo ? "#A85D43" : "#FFF8F5", color: activo ? "#fff" : "#5A3828",
                  border: `1px solid ${activo ? "#A85D43" : "#D4A090"}`, borderRadius: 7,
                  padding: "8px 12px", fontSize: 12, cursor: "pointer", fontFamily: "inherit",
                  textAlign: "left", flex: 1, minWidth: 150,
                });
                return (
                  <div style={{ background: "#FFE8E4", border: "1px solid #E8A090", borderRadius: 8, padding: "10px 12px" }}>
                    <p style={{ fontSize: 12, color: "#B3261E", fontWeight: 700, margin: 0 }}>
                      ⚠ El total del remito y la suma de los renglones no coinciden
                    </p>
                    <p style={{ fontSize: 11, color: "#7A2E28", margin: "4px 0 8px 0" }}>
                      Se llevan {fmtPeso(Math.abs(d.leido - d.sugerido))} de diferencia. Mirá la foto y decime cuál es el bueno
                      {d.descuento > 0 ? ` (el remito tiene un descuento de ${fmtPeso(d.descuento)}, ya aplicado a las dos opciones)` : ""}.
                    </p>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      <button onClick={() => elegir(d.leido)} style={btn(elegido === d.leido)}>
                        <b>{fmtPeso(d.leido)}</b><br />
                        <span style={{ fontSize: 10 }}>el total escrito en el remito</span>
                      </button>
                      <button onClick={() => elegir(d.sugerido)} style={btn(elegido === d.sugerido)}>
                        <b>{fmtPeso(d.sugerido)}</b><br />
                        <span style={{ fontSize: 10 }}>la suma de los {(activeItem.extracted?.items || []).length} renglones</span>
                      </button>
                    </div>
                    <p style={{ fontSize: 10, color: "#7A2E28", margin: "6px 0 0 0" }}>
                      Si ninguno es correcto, escribilo a mano en Total venta. Por ahora se va a guardar {fmtPeso(elegido)}.
                    </p>
                  </div>
                );
              })()}

              {/* El saldo anterior no se resta solo: se muestra y lo decide la persona */}
              {activeItem.form._saldoAnterior > 0 && (
                <div style={{ background: "#FFF4E6", border: "1px solid #E8C4B0", borderRadius: 8, padding: "10px 12px" }}>
                  <p style={{ fontSize: 12, color: "#8A5A2B", fontWeight: 600, margin: 0 }}>
                    ⚠ El remito trae un saldo/deuda anterior de {fmtPeso(activeItem.form._saldoAnterior)}
                  </p>
                  <p style={{ fontSize: 11, color: "#7A5848", margin: "4px 0 8px 0" }}>
                    Esa plata no es venta de este remito. Mirá la foto: si el total de arriba
                    ({fmtPeso(Number(activeItem.form.total || 0))}) <b>ya lo incluye</b>, restalo. Si el total
                    es solo la mercadería, dejalo como está.
                  </p>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    <button onClick={() => {
                        const nuevo = Number(activeItem.form.total || 0) - Number(activeItem.form._saldoAnterior);
                        updateForm(activeIdx, "total", String(nuevo));
                        updateForm(activeIdx, "_saldoAnterior", null);
                      }}
                      style={{ background: "#A85D43", color: "#fff", border: "none", borderRadius: 6,
                               padding: "5px 11px", fontSize: 11, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>
                      Restar {fmtPeso(activeItem.form._saldoAnterior)} → queda {fmtPeso(Number(activeItem.form.total || 0) - Number(activeItem.form._saldoAnterior))}
                    </button>
                    <button onClick={() => updateForm(activeIdx, "_saldoAnterior", null)}
                      style={{ background: "#FFF8F5", color: "#5A3828", border: "1px solid #D4A090", borderRadius: 6,
                               padding: "5px 11px", fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>
                      El total ya está bien
                    </button>
                  </div>
                </div>
              )}

              <div>
                <label style={{ fontSize: 12, color: "#5A3828", marginBottom: 6, display: "block" }}>Nota (opcional)</label>
                <input className="input" value={activeItem.form.nota}
                  onChange={e => updateForm(activeIdx, "nota", e.target.value)} placeholder="..." />
              </div>

              {saveError && (
                <p style={{ fontSize: 12, color: saveError.startsWith("⚠") ? "#8A5A2B" : "#B3261E",
                            fontWeight: 600, margin: 0, background: "#FFE8E4", borderRadius: 8, padding: "8px 10px" }}>
                  {saveError}
                </p>
              )}

              <div style={{ display: "flex", gap: 10 }}>
                {(() => {
                  const guardando = guardandoIdx !== null;
                  const bloqueado = !activeItem.form.vendedoraId || !activeItem.form.total
                                    || activeItem.status === "processing" || guardando;
                  return (
                    <button className="btn btn-primary" onClick={() => saveItem(activeIdx)}
                      disabled={bloqueado}
                      style={{ flex: 1, padding: 14, fontSize: 15, opacity: bloqueado ? 0.5 : 1 }}>
                      {guardando ? "Guardando..." : `Guardar venta ${doneCount > 1 ? `(quedan ${doneCount})` : ""}`}
                    </button>
                  );
                })()}
                <button onClick={() => removeItem(activeIdx)} disabled={guardandoIdx !== null}
                  style={{ background: "#FFF8F5", border: "1px solid #2A2A3E", borderRadius: 8, color: "#F87171", padding: "14px 16px", cursor: "pointer", fontSize: 20 }}>🗑</button>
              </div>
            </div>
          )}
        </div>
      )}

      {queue.length === 0 && savedCount === 0 && (
        <div className="card" style={{ textAlign: "center", padding: 40, color: "#7A5848" }}>
          <p style={{ fontSize: 36, marginBottom: 10 }}>📋</p>
          <p style={{ fontSize: 14 }}>Subí fotos o usá carga manual</p>
          <p style={{ fontSize: 12, marginTop: 6 }}>La IA leerá los datos automáticamente</p>
        </div>
      )}

      {manualOpen && (
        <div className="card" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <p style={{ fontSize: 13, fontWeight: 700, color: "#2C1A14" }}>✏️ Carga manual</p>
            <button onClick={() => setManualOpen(false)} style={{ background: "none", border: "none", fontSize: 18, cursor: "pointer", color: "#8B6558" }}>×</button>
          </div>
          <div>
            <label style={{ fontSize: 12, color: "#6B4A3E", marginBottom: 6, display: "block" }}>Cliente</label>
            <input className="input" value={manualForm.cliente} onChange={e => setManualForm(f => ({ ...f, cliente: e.target.value }))} placeholder="Nombre del cliente" />
          </div>
          <div>
            <label style={{ fontSize: 12, color: "#6B4A3E", marginBottom: 6, display: "block" }}>Vendedora</label>
            <select className="input" value={manualForm.vendedoraId} onChange={e => setManualForm(f => ({ ...f, vendedoraId: e.target.value }))}>
              <option value="">Seleccionar...</option>
              {vendedoras.map(v => <option key={v.id} value={v.id}>{v.nombre} ({v.comision}%)</option>)}
            </select>
          </div>
          <div className="grid2">
            <div>
              <label style={{ fontSize: 12, color: "#6B4A3E", marginBottom: 6, display: "block" }}>Total venta</label>
              <input className="input" type="number" value={manualForm.total} onChange={e => setManualForm(f => ({ ...f, total: e.target.value }))} placeholder="0" />
            </div>
            <div>
              <label style={{ fontSize: 12, color: "#6B4A3E", marginBottom: 6, display: "block" }}>Fecha</label>
              <input className="input" type="date" value={manualForm.fecha} onChange={e => setManualForm(f => ({ ...f, fecha: e.target.value }))} />
            </div>
          </div>
          <div>
            <label style={{ fontSize: 12, color: "#6B4A3E", marginBottom: 6, display: "block" }}>Nota (opcional)</label>
            <input className="input" value={manualForm.nota} onChange={e => setManualForm(f => ({ ...f, nota: e.target.value }))} placeholder="..." />
          </div>
          <button className="btn btn-primary" onClick={async () => {
            if (!manualForm.vendedoraId || !manualForm.total) return;
            setManualError(null);
            const r = await addVenta({ ...manualForm, vendedoraId: Number(manualForm.vendedoraId), total: Number(manualForm.total) });
            if (!r.ok) { setManualError("NO se guardó: " + r.error + " — los datos siguen acá, probá de nuevo."); return; }
            if (r.avisos.length) setManualError("⚠ " + r.avisos.join(" · "));
            setManualSaved(true);
            setManualForm({ cliente: "", vendedoraId: "", total: "", fecha: fechaLote(), nota: "" });
            setTimeout(() => { setManualSaved(false); setManualOpen(false); }, 2000);
          }} disabled={!manualForm.vendedoraId || !manualForm.total} style={{ padding: 14, fontSize: 15, opacity: (!manualForm.vendedoraId || !manualForm.total) ? 0.5 : 1 }}>
            Guardar venta
          </button>
          {manualError && (
            <p style={{ fontSize: 12, color: manualError.startsWith("⚠") ? "#8A5A2B" : "#B3261E", fontWeight: 600,
                        margin: 0, background: "#FFE8E4", borderRadius: 8, padding: "8px 10px" }}>{manualError}</p>
          )}
          {manualSaved && <p style={{ textAlign: "center", color: "#10B981", fontWeight: 600 }}>✓ Guardada</p>}
        </div>
      )}
    </div>
  );
}

// ─── COMISIONES ───────────────────────────────────────────────────────────────
function Comisiones({ ventas, vendedoras, pagos, addPago, marcarVentasPagadas, currentMes, fmtPeso, MESES, getMonthKey }) {
  const [checklist, setChecklist] = useState(null); // vendedoraId o null
  const [seleccionadas, setSeleccionadas] = useState([]);
  const [guardando, setGuardando] = useState(false);
  const [errorPago, setErrorPago] = useState(null);

  const nombreMes = (mk) => {
    if (!mk) return "sin fecha";
    const [y, m] = mk.split("-");
    return `${MESES[parseInt(m, 10) - 1]} ${y}`;
  };

  const toggleVenta = (id) => {
    setSeleccionadas(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  };

  // La comision pertenece al mes de las VENTAS. Antes el pago se anotaba siempre con
  // el mes de hoy, asi que pagar en septiembre las ventas de agosto dejaba agosto
  // eternamente impago y septiembre sobrepagado.
  const desglosePorMes = (vendedora) => {
    const ventasSel = ventas.filter(vt => seleccionadas.includes(vt.id));
    const porMes = {};
    let sinFecha = 0;
    ventasSel.forEach(vt => {
      const mk = getMonthKey(vt.fecha);
      if (!mk) { sinFecha++; return; }
      if (!porMes[mk]) porMes[mk] = { mes: mk, totalVentas: 0, ops: 0 };
      porMes[mk].totalVentas += Number(vt.total || 0);
      porMes[mk].ops += 1;
    });
    const filas = Object.values(porMes)
      .map(f => ({ ...f, comision: f.totalVentas * vendedora.comision / 100 }))
      .sort((a, b) => a.mes.localeCompare(b.mes));
    return { filas, sinFecha };
  };

  const handlePagarSeleccionadas = async (vendedora) => {
    if (seleccionadas.length === 0) return;
    setGuardando(true);
    setErrorPago(null);

    const { filas, sinFecha } = desglosePorMes(vendedora);
    if (sinFecha > 0) {
      setErrorPago(`${sinFecha} venta(s) seleccionada(s) no tienen fecha, así que no se sabe a qué mes imputarlas. Sacalas de la selección.`);
      setGuardando(false);
      return;
    }
    if (!filas.length) { setGuardando(false); return; }

    // Un registro de pago por cada mes. Los pagos se hacen ANTES de marcar las ventas:
    // si algo falla, quedan ventas sin marcar (visible y corregible) en vez de ventas
    // marcadas como pagadas sin que exista el pago.
    const fallidos = [];
    for (const f of filas) {
      const r = await addPago(vendedora.id, f.comision, f.mes);
      if (!r.ok) fallidos.push(`${f.mes}: ${r.error}`);
    }
    if (fallidos.length) {
      setErrorPago("No se registró el pago de " + fallidos.join(" · ") + ". Las ventas NO se marcaron como pagadas.");
      setGuardando(false);
      return;
    }

    const rm = await marcarVentasPagadas(seleccionadas);
    setGuardando(false);
    if (!rm.ok) {
      setErrorPago("El pago quedó registrado, pero no se pudieron marcar las ventas como pagadas: " + rm.error + ". Volvé a intentarlo o van a aparecer como pendientes de nuevo.");
      return;
    }
    setChecklist(null);
    setSeleccionadas([]);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      {vendedoras.map(v => {
        const ventasPendientes = ventas.filter(vt => (vt.vendedora_id || vt.vendedoraId) === v.id && !vt.pagado);
        const ventasPagadas = ventas.filter(vt => (vt.vendedora_id || vt.vendedoraId) === v.id && vt.pagado);
        const totalPendiente = ventasPendientes.reduce((s, vt) => s + Number(vt.total || 0), 0);
        const comisionPendiente = totalPendiente * v.comision / 100;
        const hayPendientes = ventasPendientes.length > 0;

        const montoSeleccionado = ventas
          .filter(vt => seleccionadas.includes(vt.id))
          .reduce((s, vt) => s + Number(vt.total || 0), 0) * v.comision / 100;

        return (
          <div key={v.id} className="card" style={{ borderLeft: `3px solid ${v.color}` }}>
            {/* Header vendedora */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ width: 32, height: 32, borderRadius: "50%", background: v.color + "22", border: `2px solid ${v.color}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: v.color }}>{v.nombre[0]}</span>
                </div>
                <div>
                  <p style={{ fontWeight: 700, fontSize: 15 }}>{v.nombre}</p>
                  <p style={{ fontSize: 11, color: "#6B4A3E" }}>{v.comision}% de comisión</p>
                </div>
              </div>
              <div style={{ textAlign: "right" }}>
                <p style={{ fontSize: 20, fontWeight: 700, color: hayPendientes ? "#F87171" : "#10B981" }}>
                  {hayPendientes ? fmtPeso(comisionPendiente) : "✓"}
                </p>
                <p style={{ fontSize: 11, color: "#6B4A3E" }}>{hayPendientes ? "falta pagar" : "al día"}</p>
              </div>
            </div>

            {/* Resumen */}
            <div style={{ background: "#FFFFFF", borderRadius: 8, padding: 12, marginBottom: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}>
                <span style={{ color: "#5A3828" }}>Ventas pendientes</span>
                <span style={{ color: "#F87171" }}>{ventasPendientes.length} ops · {fmtPeso(totalPendiente)}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                <span style={{ color: "#5A3828" }}>Ventas pagas</span>
                <span style={{ color: "#10B981" }}>{ventasPagadas.length} ops</span>
              </div>
            </div>

            {/* Checklist de pendientes */}
            {checklist === v.id && (
              <div style={{ marginBottom: 14 }}>
                <p style={{ fontSize: 11, color: "#7A5848", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" }}>Seleccioná las ventas a pagar</p>
                {ventasPendientes.length === 0 && <p style={{ fontSize: 12, color: "#10B981" }}>No hay ventas pendientes</p>}
                {ventasPendientes.map(vt => {
                  const sel = seleccionadas.includes(vt.id);
                  return (
                    <div key={vt.id} onClick={() => toggleVenta(vt.id)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", marginBottom: 4, borderRadius: 8, background: sel ? v.color + "18" : "#FFF8F5", border: `1px solid ${sel ? v.color : "#E8C4B0"}`, cursor: "pointer" }}>
                      <div style={{ width: 18, height: 18, borderRadius: 4, border: `2px solid ${sel ? v.color : "#C4A090"}`, background: sel ? v.color : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                        {sel && <span style={{ color: "#fff", fontSize: 11, fontWeight: 700 }}>✓</span>}
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <p style={{ fontSize: 13, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{vt.cliente || "Sin nombre"}</p>
                        <p style={{ fontSize: 11, color: "#7A5848" }}>{vt.fecha}</p>
                      </div>
                      <div style={{ textAlign: "right", flexShrink: 0 }}>
                        <p style={{ fontSize: 13, fontWeight: 600 }}>{fmtPeso(vt.total)}</p>
                        <p style={{ fontSize: 11, color: v.color }}>com: {fmtPeso(Number(vt.total) * v.comision / 100)}</p>
                      </div>
                    </div>
                  );
                })}

                {seleccionadas.length > 0 && (() => {
                  const { filas, sinFecha } = desglosePorMes(v);
                  return (
                    <div style={{ background: "#FFF0E8", borderRadius: 8, padding: 10, marginTop: 10, marginBottom: 8 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, fontWeight: 700 }}>
                        <span>Comisión a registrar</span>
                        <span style={{ color: v.color }}>{fmtPeso(montoSeleccionado)}</span>
                      </div>
                      <p style={{ fontSize: 11, color: "#7A5848", marginTop: 2 }}>{seleccionadas.length} ventas seleccionadas</p>

                      {/* Se ve el desglose ANTES de confirmar: cada mes se registra por separado */}
                      <div style={{ marginTop: 8, paddingTop: 8, borderTop: "1px solid #E8C4B0" }}>
                        <p style={{ fontSize: 10, color: "#7A5848", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>
                          {filas.length > 1 ? `Se van a registrar ${filas.length} pagos, uno por mes` : "Se imputa al mes de las ventas"}
                        </p>
                        {filas.map(f => (
                          <div key={f.mes} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "2px 0" }}>
                            <span style={{ color: "#5A3828" }}>{nombreMes(f.mes)} <span style={{ color: "#9A7570" }}>· {f.ops} vta{f.ops !== 1 ? "s" : ""}</span></span>
                            <span style={{ color: v.color, fontWeight: 600 }}>{fmtPeso(f.comision)}</span>
                          </div>
                        ))}
                        {sinFecha > 0 && (
                          <p style={{ fontSize: 11, color: "#B3261E", fontWeight: 600, marginTop: 4 }}>
                            ⚠ {sinFecha} venta(s) sin fecha — no se sabe a qué mes van. Sacalas de la selección.
                          </p>
                        )}
                      </div>
                    </div>
                  );
                })()}

                {errorPago && (
                  <p style={{ fontSize: 12, color: "#B3261E", fontWeight: 600, margin: "0 0 8px 0",
                              background: "#FFE8E4", borderRadius: 8, padding: "8px 10px" }}>{errorPago}</p>
                )}

                <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                  <button className="btn btn-primary btn-sm" onClick={() => handlePagarSeleccionadas(v)} disabled={seleccionadas.length === 0 || guardando} style={{ flex: 1, opacity: seleccionadas.length === 0 ? 0.5 : 1 }}>
                    {guardando ? "Guardando..." : `Registrar pago (${seleccionadas.length})`}
                  </button>
                  <button onClick={() => { setChecklist(null); setSeleccionadas([]); setErrorPago(null); }} style={{ background: "#FFF8F5", border: "1px solid #C4A090", borderRadius: 8, color: "#5A3828", padding: "6px 14px", cursor: "pointer", fontSize: 12 }}>✕</button>
                </div>
              </div>
            )}

            {/* Botón abrir checklist */}
            {checklist !== v.id && (
              <button
                className="btn btn-primary btn-sm"
                onClick={() => { setChecklist(v.id); setSeleccionadas([]); setErrorPago(null); }}
                style={{ width: "100%", opacity: hayPendientes ? 1 : 0.5 }}
              >
                {hayPendientes ? `Registrar pago (${ventasPendientes.length} pendientes)` : "Sin comisiones pendientes"}
              </button>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── HISTORIAL ────────────────────────────────────────────────────────────────
function Historial({ ventas, vendedoras, fmtPeso, MESES, getMonthKey }) {
  const [filtroVendedora, setFiltroVendedora] = useState("all");
  const [filtroAnio, setFiltroAnio] = useState("all");
  const [filtroMes, setFiltroMes] = useState("all");
  const [busqueda, setBusqueda] = useState("");

  const allMonthKeys = [...new Set(ventas.map(v => getMonthKey(v.fecha)))].filter(Boolean).sort().reverse();
  const anios = [...new Set(allMonthKeys.map(m => m.split("-")[0]))].sort().reverse();
  const mesesDelAnio = filtroAnio === "all"
    ? [...new Set(allMonthKeys.map(m => m.split("-")[1]))]
    : [...new Set(allMonthKeys.filter(m => m.startsWith(filtroAnio)).map(m => m.split("-")[1]))];

  const filtradas = ventas.filter(v => {
    if (filtroVendedora !== "all" && String(v.vendedora_id || v.vendedoraId) !== filtroVendedora) return false;
    const mk = getMonthKey(v.fecha);
    if (filtroAnio !== "all" && !mk.startsWith(filtroAnio)) return false;
    if (filtroMes !== "all" && mk.split("-")[1] !== filtroMes) return false;
    if (busqueda.trim() && !(v.cliente || "").toLowerCase().includes(busqueda.trim().toLowerCase())) return false;
    return true;
  });

  // Mapa cliente -> vendedoras que lo atendieron alguna vez (sobre TODAS las ventas)
  const vendedorasPorCliente = (() => {
    const m = {};
    ventas.forEach(vt => {
      const k = (vt.cliente || "").toLowerCase().trim();
      const vid = vt.vendedora_id || vt.vendedoraId;
      if (!k || !vid) return;
      if (!m[k]) m[k] = [];
      if (!m[k].includes(vid)) m[k].push(vid);
    });
    return m;
  })();

  // Análisis del cliente buscado
  const clienteBuscado = busqueda.trim();
  const ventasCliente = clienteBuscado
    ? ventas.filter(v => (v.cliente || "").toLowerCase().includes(clienteBuscado.toLowerCase()))
    : [];
  const vendedorasCliente = clienteBuscado
    ? [...new Map(ventasCliente.map(v => {
        const vend = vendedoras.find(vv => vv.id === (v.vendedora_id || v.vendedoraId));
        return [vend?.id, vend];
      })).values()].filter(Boolean)
    : [];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div>
        <label style={{ fontSize: 12, color: "#5A3828", marginBottom: 6, display: "block" }}>Buscar cliente</label>
        <input
          className="input"
          type="text"
          value={busqueda}
          onChange={e => setBusqueda(e.target.value)}
          placeholder="Nombre del cliente..."
        />
        {clienteBuscado && ventasCliente.length > 0 && (
          <div style={{ marginTop: 8, background: "#FFF0E8", borderRadius: 8, padding: "10px 12px" }}>
            <p style={{ fontSize: 12, fontWeight: 600, color: "#5A3828", marginBottom: 4 }}>
              {ventasCliente.length} venta{ventasCliente.length !== 1 ? "s" : ""} encontrada{ventasCliente.length !== 1 ? "s" : ""}
            </p>
            {vendedorasCliente.length > 1 && (
              <p style={{ fontSize: 11, color: "#F87171", fontWeight: 600, marginBottom: 4 }}>
                ⚠ Atendido por más de un vendedor</p>
            )}
            <p style={{ fontSize: 12, color: "#6B4A3E" }}>
              Vendedor{vendedorasCliente.length !== 1 ? "as" : "a"}: {vendedorasCliente.map(vv => vv.nombre).join(", ")}
            </p>
          </div>
        )}
        {clienteBuscado && ventasCliente.length === 0 && (
          <p style={{ fontSize: 12, color: "#7A5848", marginTop: 6 }}>Sin resultados para "{clienteBuscado}"</p>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
        <div>
          <label style={{ fontSize: 12, color: "#5A3828", marginBottom: 6, display: "block" }}>Vendedora</label>
          <select className="input" value={filtroVendedora} onChange={e => setFiltroVendedora(e.target.value)}>
            <option value="all">Todas</option>
            {vendedoras.map(v => <option key={v.id} value={v.id}>{v.nombre}</option>)}
          </select>
        </div>
        <div>
          <label style={{ fontSize: 12, color: "#5A3828", marginBottom: 6, display: "block" }}>Año</label>
          <select className="input" value={filtroAnio} onChange={e => { setFiltroAnio(e.target.value); setFiltroMes("all"); }}>
            <option value="all">Todos</option>
            {anios.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
        </div>
        <div>
          <label style={{ fontSize: 12, color: "#5A3828", marginBottom: 6, display: "block" }}>Mes</label>
          <select className="input" value={filtroMes} onChange={e => setFiltroMes(e.target.value)}>
            <option value="all">Todos</option>
            {mesesDelAnio.map(m => <option key={m} value={m}>{MESES[parseInt(m) - 1]}</option>)}
          </select>
        </div>
      </div>

      <div className="card" style={{ padding: 0, overflow: "hidden" }}>
        <div style={{ padding: "12px 16px", borderBottom: "1px solid #1E1E2E", display: "flex", justifyContent: "space-between" }}>
          <span style={{ fontSize: 11, color: "#6B4A3E", textTransform: "uppercase", letterSpacing: "0.1em" }}>{filtradas.length} ventas</span>
          <span style={{ fontSize: 13, fontWeight: 700, color: "#A85D43" }}>{fmtPeso(filtradas.reduce((s, v) => s + Number(v.total || 0), 0))}</span>
        </div>
        {filtradas.length === 0 && <p style={{ padding: 24, textAlign: "center", color: "#7A5848", fontSize: 13 }}>Sin ventas en este período</p>}
        {filtradas.map(v => {
          const vend = vendedoras.find(vv => vv.id === (v.vendedora_id || v.vendedoraId));
          const claveCli = (v.cliente || "").toLowerCase().trim();
          const idsVends = vendedorasPorCliente[claveCli] || [];
          const multiVend = idsVends.length > 1;
          const nombresVends = multiVend
            ? idsVends.map(id => vendedoras.find(vv => vv.id === id)?.nombre).filter(Boolean).join(" · ")
            : "";
          return (
            <div key={v.id} style={{ display: "flex", alignItems: "center", padding: "12px 16px", borderBottom: "1px solid #1A1A25", gap: 12 }}>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: vend?.color || "#444", flexShrink: 0 }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <p style={{ fontSize: 14, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{v.cliente || "Sin nombre"}</p>
                <p style={{ fontSize: 11, color: "#6B4A3E", marginTop: 2 }}>{v.fecha} · {vend?.nombre}</p>
                {multiVend && (
                  <p style={{ fontSize: 10, color: "#A85D43", fontWeight: 600, marginTop: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    ⚠ {idsVends.length} vendedoras: {nombresVends}
                  </p>
                )}
                {v.nota && <p style={{ fontSize: 11, color: "#7A5848", marginTop: 1 }}>{v.nota}</p>}
              </div>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4, flexShrink: 0 }}>
                <span style={{ fontSize: 15, fontWeight: 700 }}>{fmtPeso(v.total)}</span>
                {v.pagado
                  ? <span style={{ fontSize: 10, color: "#10B981", fontWeight: 600 }}>✓ pagada</span>
                  : <span style={{ fontSize: 10, color: "#F87171", fontWeight: 600 }}>● a pagar</span>
                }
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── COMPARAR ────────────────────────────────────────────────────────────────
function Comparar({ ventas, vendedoras, fmtPeso, MESES, getMonthKey }) {
  const [modo, setModo] = React.useState("mes");
  const [filtroVendedora, setFiltroVendedora] = React.useState("all");

  // Get all available years and months
  const allMonths = [...new Set(ventas.map(v => getMonthKey(v.fecha)))].filter(Boolean).sort();
  const allYears = [...new Set(allMonths.map(m => m.split("-")[0]))].sort();

  // Con pocos meses de historia, los indices se iban fuera del array y los selectores
  // quedaban en blanco. mesEn() recorta el indice a lo que realmente existe.
  const mesEn = (i) => allMonths.length ? allMonths[Math.max(0, Math.min(i, allMonths.length - 1))] : "";
  const mitad = Math.floor(allMonths.length / 2);

  // Mes vs Mes state
  const [mes1, setMes1] = React.useState(mesEn(allMonths.length - 1));
  const [mes2, setMes2] = React.useState(mesEn(allMonths.length - 2));

  // Año vs Año state
  const [anio1, setAnio1] = React.useState(allYears[allYears.length - 1] || "");
  const [anio2, setAnio2] = React.useState(allYears[allYears.length - 2] || allYears[allYears.length - 1] || "");

  // Rango vs Rango state
  const [rangoA1, setRangoA1] = React.useState(mesEn(0));
  const [rangoA2, setRangoA2] = React.useState(mesEn(mitad - 1));
  const [rangoB1, setRangoB1] = React.useState(mesEn(mitad));
  const [rangoB2, setRangoB2] = React.useState(mesEn(allMonths.length - 1));

  const getTotal = (ventasFiltradas) => ventasFiltradas.reduce((s, v) => s + Number(v.total || 0), 0);

  const filtrarVentas = (v) => filtroVendedora === "all" || String(v.vendedora_id || v.vendedoraId) === filtroVendedora;

  const ventasMes = (mesKey) => ventas.filter(v => getMonthKey(v.fecha) === mesKey && filtrarVentas(v));
  const ventasAnio = (anio) => ventas.filter(v => v.fecha?.startsWith(anio) && filtrarVentas(v));
  const ventasRango = (desde, hasta) => ventas.filter(v => {
    const m = getMonthKey(v.fecha);
    return m >= desde && m <= hasta && filtrarVentas(v);
  });

  const formatMes = (key) => {
    if (!key) return "-";
    const [y, m] = key.split("-");
    return `${MESES[parseInt(m) - 1]} ${y}`;
  };

  const pct = (a, b) => {
    if (!b) return null;
    const diff = ((a - b) / b) * 100;
    return diff;
  };

  const PctBadge = ({ a, b }) => {
    const d = pct(a, b);
    if (d === null) return null;
    const color = d >= 0 ? "#10B981" : "#F87171";
    const sign = d >= 0 ? "+" : "";
    return <span style={{ fontSize: 12, color, fontWeight: 700, marginLeft: 8 }}>{sign}{d.toFixed(1)}%</span>;
  };

  const CompareBlock = ({ labelA, labelB, ventasA, ventasB }) => {
    const totalA = getTotal(ventasA);
    const totalB = getTotal(ventasB);
    const vendsA = vendedoras.map(v => ({
      ...v,
      totalA: getTotal(ventasA.filter(vt => (vt.vendedora_id || vt.vendedoraId) === v.id)),
      totalB: getTotal(ventasB.filter(vt => (vt.vendedora_id || vt.vendedoraId) === v.id)),
      comisionA: getTotal(ventasA.filter(vt => (vt.vendedora_id || vt.vendedoraId) === v.id)) * v.comision / 100,
      comisionB: getTotal(ventasB.filter(vt => (vt.vendedora_id || vt.vendedoraId) === v.id)) * v.comision / 100,
    }));

    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {/* Totales */}
        <div className="card" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <div style={{ textAlign: "center" }}>
            <p style={{ fontSize: 11, color: "#6B4A3E", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>{labelA}</p>
            <p style={{ fontSize: 28, fontWeight: 700, color: "#2C1A14" }}>{fmtPeso(totalA)}</p>
            <p style={{ fontSize: 12, color: "#8B6558" }}>{ventasA.length} ventas</p>
          </div>
          <div style={{ textAlign: "center" }}>
            <p style={{ fontSize: 11, color: "#6B4A3E", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>{labelB}</p>
            <p style={{ fontSize: 28, fontWeight: 700, color: "#2C1A14" }}>{fmtPeso(totalB)}</p>
            <p style={{ fontSize: 12, color: "#8B6558" }}>{ventasB.length} ventas</p>
          </div>
        </div>

        {/* Diferencia */}
        <div className="card" style={{ textAlign: "center" }}>
          <p style={{ fontSize: 11, color: "#6B4A3E", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 8 }}>Diferencia</p>
          <p style={{ fontSize: 22, fontWeight: 700, color: totalA >= totalB ? "#10B981" : "#F87171" }}>
            {totalA >= totalB ? "+" : ""}{fmtPeso(totalA - totalB)}
            <PctBadge a={totalA} b={totalB} />
          </p>
        </div>

        {/* Por vendedora */}
        {filtroVendedora === "all" && (
          <div className="card">
            <p style={{ fontSize: 11, color: "#6B4A3E", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12 }}>Por vendedora</p>
            {vendsA.map(v => (
              <div key={v.id} style={{ padding: "10px 0", borderBottom: "1px solid #E8C4B0" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
                  <div style={{ width: 8, height: 8, borderRadius: "50%", background: v.color, flexShrink: 0 }} />
                  <span style={{ flex: 1, fontSize: 13, fontWeight: 600 }}>{v.nombre}</span>
                  <span style={{ fontSize: 13, color: "#2C1A14", minWidth: 90, textAlign: "right" }}>{fmtPeso(v.totalA)}</span>
                  <span style={{ fontSize: 12, color: "#9A7570", minWidth: 20 }}>vs</span>
                  <span style={{ fontSize: 13, color: "#2C1A14", minWidth: 90, textAlign: "right" }}>{fmtPeso(v.totalB)}</span>
                  <PctBadge a={v.totalA} b={v.totalB} />
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, paddingLeft: 18 }}>
                  <span style={{ flex: 1, fontSize: 11, color: "#9A7570" }}>Comisión ({v.comision}%)</span>
                  <span style={{ fontSize: 12, color: "#A85D43", minWidth: 90, textAlign: "right" }}>{fmtPeso(v.comisionA)}</span>
                  <span style={{ fontSize: 12, color: "#9A7570", minWidth: 20 }}> </span>
                  <span style={{ fontSize: 12, color: "#A85D43", minWidth: 90, textAlign: "right" }}>{fmtPeso(v.comisionB)}</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      {/* Modo selector */}
      <div className="card" style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        {[["mes","Mes vs Mes"],["anio","Año vs Año"],["rango","Rango vs Rango"]].map(([k,l]) => (
          <button key={k} onClick={() => setModo(k)} style={{
            padding: "8px 16px", borderRadius: 8, border: "none", cursor: "pointer",
            fontFamily: "'DM Sans',sans-serif", fontSize: 13, fontWeight: 600,
            background: modo === k ? "#A85D43" : "#FFF8F5",
            color: modo === k ? "#FFF" : "#6B4A3E",
            border: `1px solid ${modo === k ? "#A85D43" : "#D4A090"}`
          }}>{l}</button>
        ))}
      </div>

      {/* Filtro vendedora */}
      <div>
        <label style={{ fontSize: 12, color: "#6B4A3E", marginBottom: 6, display: "block" }}>Vendedora</label>
        <select className="input" value={filtroVendedora} onChange={e => setFiltroVendedora(e.target.value)} style={{ maxWidth: 240 }}>
          <option value="all">Todas</option>
          {vendedoras.map(v => <option key={v.id} value={String(v.id)}>{v.nombre}</option>)}
        </select>
      </div>

      {/* Mes vs Mes */}
      {allMonths.length > 0 && modo === "mes" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div className="grid2">
            <div>
              <label style={{ fontSize: 12, color: "#6B4A3E", marginBottom: 6, display: "block" }}>Período A</label>
              <div style={{ display: "flex", gap: 8 }}>
                <select className="input" value={mes1.split("-")[0]} onChange={e => {
                  const y = e.target.value;
                  const m = mes1.split("-")[1];
                  const newKey = `${y}-${m}`;
                  setMes1(allMonths.includes(newKey) ? newKey : allMonths.find(k => k.startsWith(y)) || mes1);
                }}>
                  {allYears.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
                <select className="input" value={mes1.split("-")[1]} onChange={e => {
                  const m = e.target.value;
                  const y = mes1.split("-")[0];
                  const newKey = `${y}-${m}`;
                  setMes1(allMonths.includes(newKey) ? newKey : mes1);
                }}>
                  {MESES.map((nombre, i) => {
                    const m = String(i+1).padStart(2,"0");
                    const y = mes1.split("-")[0];
                    const exists = allMonths.includes(`${y}-${m}`);
                    return exists ? <option key={m} value={m}>{nombre}</option> : null;
                  })}
                </select>
              </div>
            </div>
            <div>
              <label style={{ fontSize: 12, color: "#6B4A3E", marginBottom: 6, display: "block" }}>Período B</label>
              <div style={{ display: "flex", gap: 8 }}>
                <select className="input" value={mes2.split("-")[0]} onChange={e => {
                  const y = e.target.value;
                  const m = mes2.split("-")[1];
                  const newKey = `${y}-${m}`;
                  setMes2(allMonths.includes(newKey) ? newKey : allMonths.find(k => k.startsWith(y)) || mes2);
                }}>
                  {allYears.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
                <select className="input" value={mes2.split("-")[1]} onChange={e => {
                  const m = e.target.value;
                  const y = mes2.split("-")[0];
                  const newKey = `${y}-${m}`;
                  setMes2(allMonths.includes(newKey) ? newKey : mes2);
                }}>
                  {MESES.map((nombre, i) => {
                    const m = String(i+1).padStart(2,"0");
                    const y = mes2.split("-")[0];
                    const exists = allMonths.includes(`${y}-${m}`);
                    return exists ? <option key={m} value={m}>{nombre}</option> : null;
                  })}
                </select>
              </div>
            </div>
          </div>
          <CompareBlock labelA={formatMes(mes1)} labelB={formatMes(mes2)} ventasA={ventasMes(mes1)} ventasB={ventasMes(mes2)} />
        </div>
      )}

      {/* Año vs Año */}
      {allMonths.length > 0 && modo === "anio" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div className="grid2">
            <div>
              <label style={{ fontSize: 12, color: "#6B4A3E", marginBottom: 6, display: "block" }}>Año A</label>
              <select className="input" value={anio1} onChange={e => setAnio1(e.target.value)}>
                {allYears.map(y => <option key={y} value={y}>{y}</option>)}
              </select>
            </div>
            <div>
              <label style={{ fontSize: 12, color: "#6B4A3E", marginBottom: 6, display: "block" }}>Año B</label>
              <select className="input" value={anio2} onChange={e => setAnio2(e.target.value)}>
                {allYears.map(y => <option key={y} value={y}>{y}</option>)}
              </select>
            </div>
          </div>
          <CompareBlock labelA={anio1} labelB={anio2} ventasA={ventasAnio(anio1)} ventasB={ventasAnio(anio2)} />
        </div>
      )}

      {/* Rango vs Rango */}
      {allMonths.length > 0 && modo === "rango" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div className="card" style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <p style={{ fontSize: 12, fontWeight: 600, color: "#2C1A14" }}>Período A</p>
            <div className="grid2">
              <div>
                <label style={{ fontSize: 11, color: "#6B4A3E", marginBottom: 4, display: "block" }}>Desde</label>
                <div style={{ display: "flex", gap: 8 }}>
                  <select className="input" value={rangoA1.split("-")[0]} onChange={e => { const y=e.target.value; const nk=`${y}-${rangoA1.split("-")[1]}`; setRangoA1(allMonths.includes(nk)?nk:allMonths.find(k=>k.startsWith(y))||rangoA1); }}>
                    {allYears.map(y => <option key={y} value={y}>{y}</option>)}
                  </select>
                  <select className="input" value={rangoA1.split("-")[1]} onChange={e => { const m=e.target.value; const y=rangoA1.split("-")[0]; const nk=`${y}-${m}`; setRangoA1(allMonths.includes(nk)?nk:rangoA1); }}>
