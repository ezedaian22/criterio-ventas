        <p style={{ fontSize: 11, color: "#A85D43", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 12 }}>API Key de Gemini (gratis)</p>
        <p style={{ fontSize: 12, color: "#5A3828", marginBottom: 10 }}>Gratis en <strong style={{color:"#2C1A14"}}>aistudio.google.com/apikey</strong> → "Create API key" → copiá y pegá acá</p>
        <p style={{ fontSize: 12, color: "#5A3828", marginBottom: 6 }}>Key principal</p>
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <input className="input" type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="AIzaSy... o AQ.Ab8..." style={{ flex: 1 }} />
        </div>
        <p style={{ fontSize: 12, color: "#5A3828", marginBottom: 6 }}>Keys adicionales (una por línea, AIzaSy... o AQ.Ab8...)</p>
        <textarea className="input" value={extraApiKeys} onChange={e => setExtraApiKeys(e.target.value)} placeholder={"AIzaSy...\nAQ.Ab8..."} rows={5} style={{ width: "100%", resize: "vertical", marginBottom: 10 }} />
        <button className="btn btn-primary btn-sm" onClick={saveApiKey} disabled={savingKey}>{savingKey ? "Guardando..." : "Guardar"}</button>
        {apiKeySaved && <p style={{ fontSize: 12, color: "#10B981", marginTop: 6 }}>✓ Guardadas en este dispositivo</p>}
        {errorKey && <p style={{ fontSize: 12, color: "#B3261E", marginTop: 6, fontWeight: 600 }}>{errorKey}</p>}
        {!apiKey && !extraApiKeys && <p style={{ fontSize: 12, color: "#F87171", marginTop: 6 }}>⚠ Sin API key — la lectura de fotos no funcionará</p>}
        <p style={{ fontSize: 11, color: "#7A5848", marginTop: 8 }}>
          Las keys quedan guardadas <b>solo en este dispositivo</b>, no en la nube: subirlas
          significaría dejarlas legibles para cualquiera. En una compu o celular nuevo hay que
          pegarlas de nuevo una vez.
        </p>
      </div>

      {/* ── Test de conexion al catalogo de Costos ── */}
      <div className="card">
        <p style={{ fontSize: 11, color: "#6B4A3E", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 10 }}>Catálogo de Costos</p>
        <p style={{ fontSize: 12, color: "#5A3828", marginBottom: 12 }}>
          Probá la conexión al proyecto de Costos para ver si Ventas puede leer el catálogo de artículos.
        </p>
        <button className="btn btn-primary btn-sm" onClick={probarCatalogo} disabled={testingCat}>
          {testingCat ? "Probando..." : "Probar conexión"}
        </button>

        {testCat && !testCat.ok && (
          <div style={{ marginTop: 12, background: "#FFE8E4", borderRadius: 8, padding: 12 }}>
            <p style={{ fontSize: 13, fontWeight: 700, color: "#B3261E", marginBottom: 4 }}>✕ No se pudo leer el catálogo</p>
            <p style={{ fontSize: 11, color: "#7A2E28", wordBreak: "break-word" }}>{testCat.error}</p>
          </div>
        )}

        {testCat && testCat.ok && (
          <div style={{ marginTop: 12 }}>
            <p style={{ fontSize: 13, fontWeight: 700, color: "#10B981", marginBottom: 8 }}>
              ✓ Conectado — {testCat.rows.length} artículos
            </p>
            {testCat.rows.length > 0 && (
              <div>
                <p style={{ fontSize: 11, color: "#7A5848", marginBottom: 6 }}>
                  Columnas: {Object.keys(testCat.rows[0]).join(", ")}
                </p>
                <div style={{ background: "#FFFFFF", borderRadius: 8, padding: 10, maxHeight: 260, overflowY: "auto" }}>
                  {testCat.rows.slice(0, 15).map((r, i) => (
                    <pre key={i} style={{ fontSize: 10, color: "#5A3828", margin: 0, padding: "4px 0", borderBottom: "1px solid #F0E0D8", whiteSpace: "pre-wrap", wordBreak: "break-word", fontFamily: "monospace" }}>
                      {JSON.stringify(r)}
                    </pre>
                  ))}
                </div>
                <p style={{ fontSize: 11, color: "#7A5848", marginTop: 6 }}>Mostrando los primeros 15 de {testCat.rows.length}</p>
              </div>
            )}
          </div>
        )}

        {/* Explorador del schema costos */}
        <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1px solid #E8C4B0" }}>
          <p style={{ fontSize: 12, color: "#5A3828", marginBottom: 10 }}>
            Catálogo completo (código + descripción + costo):
          </p>
          <button className="btn btn-primary btn-sm" onClick={armarCat} disabled={armandoCat} style={{ marginBottom: 14 }}>
            {armandoCat ? "Armando..." : "Armar catálogo completo"}
          </button>

          {catFull && !catFull.ok && (
            <p style={{ fontSize: 11, color: "#B3261E", marginBottom: 12, wordBreak: "break-word" }}>{catFull.error}</p>
          )}

          {catFull && catFull.ok && (
            <div style={{ marginBottom: 16, background: "#FFF0E8", borderRadius: 8, padding: 12 }}>
              <p style={{ fontSize: 13, fontWeight: 700, color: "#5A3828", marginBottom: 6 }}>
                {catFull.rows.length} artículos únicos
              </p>
              <p style={{ fontSize: 11, color: "#6B4A3E", marginBottom: 2 }}>
                Filas crudas: {catFull.filasArticulos} en articulos · {catFull.filasCosto} en costo_articulo
              </p>
              <p style={{ fontSize: 11, color: catFull.conDesc === catFull.rows.length ? "#10B981" : "#A85D43", marginBottom: 2 }}>
                Con descripción: {catFull.conDesc} de {catFull.rows.length}
              </p>
              <p style={{ fontSize: 11, color: catFull.conCosto === catFull.rows.length ? "#10B981" : "#A85D43", marginBottom: 8 }}>
                Con costo: {catFull.conCosto} de {catFull.rows.length}
              </p>
              <div style={{ background: "#FFFFFF", borderRadius: 6, padding: 8, maxHeight: 240, overflowY: "auto" }}>
                {catFull.rows.slice(0, 25).map((r, i) => (
                  <div key={i} style={{ fontSize: 11, color: "#5A3828", padding: "3px 0", borderBottom: "1px solid #F0E0D8" }}>
                    <b>{r.codigo}</b> — {r.descripcion || <i style={{ color: "#B3261E" }}>sin descripción</i>}
                    {r.costo_total !== null ? ` · $${r.costo_total}` : <span style={{ color: "#B3261E" }}> · sin costo</span>}
                  </div>
                ))}
              </div>
              <p style={{ fontSize: 10, color: "#7A5848", marginTop: 6 }}>Primeros 25</p>

            </div>
          )}

          {/* Banco de pruebas del matching — siempre visible */}
          <div style={{ marginBottom: 18, paddingBottom: 14, borderBottom: "1px solid #E8C4B0" }}>
            <p style={{ fontSize: 12, fontWeight: 700, color: "#5A3828", marginBottom: 4 }}>Probar el matching</p>
            {(() => {
              const cat = (catFull && catFull.ok && catFull.rows.length) ? catFull.rows : (catalogo || []);
              const origen = (catFull && catFull.ok && catFull.rows.length) ? "recién armado" : "cargado al iniciar la app";
              if (!cat.length) {
                return (
                  <p style={{ fontSize: 11, color: "#B3261E", marginTop: 4 }}>
                    ⚠ El catálogo NO está cargado. Apretá "Armar catálogo completo" arriba. Si así funciona,
                    el problema es que la app no lo carga sola al arrancar.
                  </p>
                );
              }
              return (
                <div>
                  <p style={{ fontSize: 11, color: "#10B981", marginBottom: 8 }}>
                    ✓ {cat.length} artículos disponibles ({origen})
                  </p>
                  <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                    <input className="input" value={pruebaCod} onChange={e => setPruebaCod(e.target.value)}
                      placeholder="Código (opcional)" style={{ width: 130 }} />
                    <input className="input" value={pruebaDesc} onChange={e => setPruebaDesc(e.target.value)}
                      placeholder="Ej: poncho c/ cord." style={{ flex: 1 }} />
                  </div>
                  {(pruebaCod || pruebaDesc) && (() => {
                    const m = matchearArticulo(pruebaCod, pruebaDesc, cat, aliases || {});
                    const colores = { ok: "#10B981", alias: "#10B981", solo_codigo: "#10B981",
                                      similar: "#A85D43", revisar: "#F59E0B",
                                      ambiguo: "#F59E0B", conjunto: "#7C3AED", sin_match: "#B3261E" };
                    const textos = { ok: "✓ Match seguro", alias: "✓ Por alias aprendido",
                                     solo_codigo: "✓ Por código (sin descripción)",
                                     similar: "≈ Similar a", revisar: "⚠ Chequear este art",
                                     ambiguo: "⚠ Dos artículos posibles — hay que elegir",
                                     conjunto: "⊞ Conjunto — hay que elegir los componentes",
                                     sin_match: "✕ Sin match" };
                    return (
                      <div style={{ background: "#FFFFFF", borderRadius: 8, padding: 10 }}>
                        <p style={{ fontSize: 12, fontWeight: 700, color: colores[m.estado], marginBottom: 6 }}>
                          {textos[m.estado]} {m.score ? `(${Math.round(m.score * 100)}%)` : ""}
                        </p>
                        {m.codigo && (
                          <p style={{ fontSize: 12, color: "#2C1A14", marginBottom: 6 }}>
                            <b>{m.codigo}</b> — {m.descripcion}
                            {m.costo_total !== null
                              ? <span style={{ color: "#10B981" }}> · costo ${m.costo_total}</span>
                              : <span style={{ color: "#B3261E" }}> · ⚠ sin costo cargado</span>}
                          </p>
                        )}
                        {m.estado === "conjunto" && (
                          <div style={{ marginBottom: 6 }}>
                            <p style={{ fontSize: 10, color: "#7A5848", marginBottom: 3 }}>Artículos que coinciden con las palabras:</p>
                            {candidatosConjunto(pruebaDesc, cat).map((o, k) => (
                              <p key={k} style={{ fontSize: 11, color: "#5A3828", margin: 0 }}>
                                <b>{o.codigo}</b> — {o.descripcion}
                                {o.costo_total !== null ? ` · $${o.costo_total}` : " · sin costo"}
                              </p>
                            ))}
                          </div>
                        )}
                        <p style={{ fontSize: 10, color: "#7A5848", marginBottom: 3 }}>Más parecidos:</p>
                        {m.candidatos.map((cd, i) => (
                          <p key={i} style={{ fontSize: 11, color: "#5A3828", margin: 0 }}>
                            {Math.round(cd.score * 100)}% · <b>{cd.codigo}</b> — {cd.descripcion}
                          </p>
                        ))}
                      </div>
                    );
                  })()}
                </div>
              );
            })()}
          </div>

          <p style={{ fontSize: 12, color: "#5A3828", marginBottom: 10 }}>
            Explorar tablas del proyecto de Costos:
          </p>
          <button className="btn btn-primary btn-sm" onClick={buscarTablas} disabled={cargandoTablas}>
            {cargandoTablas ? "Buscando... (tarda unos segundos)" : "Ver tablas de Costos"}
          </button>

          {tablas && !tablas.ok && (
            <p style={{ fontSize: 11, color: "#B3261E", marginTop: 10, wordBreak: "break-word" }}>{tablas.error}</p>
          )}

          {tablas && tablas.ok && (
            <div style={{ marginTop: 12 }}>
              <p style={{ fontSize: 11, color: "#7A5848", marginBottom: 8 }}>
                {tablas.tablas.length} tablas encontradas — tocá una para ver qué tiene adentro:
              </p>
              {tablas.tablas.length === 0 && (
                <p style={{ fontSize: 11, color: "#B3261E" }}>
                  No se encontró ninguna tabla. Decime cómo se llama y la busco directo.
                </p>
              )}
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {tablas.tablas.map(t => {
                  const etiqueta = `${t.schema}.${t.nombre}`;
                  return (
                    <button key={etiqueta} onClick={() => verTabla(t.nombre, t.schema)}
                      style={{ background: tablaSel === etiqueta ? "#A85D43" : "#FFF8F5",
                               color: tablaSel === etiqueta ? "#fff" : "#5A3828",
                               border: "1px solid #D4A090", borderRadius: 6, padding: "5px 10px", fontSize: 11,
                               cursor: "pointer", fontFamily: "inherit" }}>
                      {etiqueta}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {muestra && muestra.cargando && (
            <p style={{ fontSize: 12, color: "#7A5848", marginTop: 10 }}>Cargando {tablaSel}...</p>
          )}

          {muestra && !muestra.cargando && !muestra.ok && (
            <p style={{ fontSize: 11, color: "#B3261E", marginTop: 10, wordBreak: "break-word" }}>{muestra.error}</p>
          )}

          {muestra && !muestra.cargando && muestra.ok && (
            <div style={{ marginTop: 12 }}>
              <p style={{ fontSize: 12, fontWeight: 700, color: "#5A3828", marginBottom: 6 }}>{tablaSel}</p>
              {muestra.rows.length === 0
                ? <p style={{ fontSize: 11, color: "#7A5848" }}>(vacía)</p>
                : (
                  <div>
                    <p style={{ fontSize: 11, color: "#7A5848", marginBottom: 6 }}>
                      Columnas: {Object.keys(muestra.rows[0]).join(", ")}
                    </p>
                    <div style={{ background: "#FFFFFF", borderRadius: 8, padding: 10, maxHeight: 220, overflowY: "auto" }}>
                      {muestra.rows.map((r, i) => (
                        <pre key={i} style={{ fontSize: 10, color: "#5A3828", margin: 0, padding: "4px 0",
                                              borderBottom: "1px solid #F0E0D8", whiteSpace: "pre-wrap",
                                              wordBreak: "break-word", fontFamily: "monospace" }}>
                          {JSON.stringify(r)}
                        </pre>
                      ))}
                    </div>
                  </div>
                )}
            </div>
          )}
        </div>
      </div>

      <div className="card">
        <p style={{ fontSize: 11, color: "#6B4A3E", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 16 }}>Vendedoras</p>
        {vendedoras.map(v => (
          <div key={v.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: "1px solid #1E1E2E" }}>
            <div style={{ width: 12, height: 12, borderRadius: "50%", background: v.color, flexShrink: 0 }} />
            <span style={{ flex: 1, fontSize: 14 }}>{v.nombre}</span>
            {editId === v.id ? (
              <>
                <input className="input" type="number" value={editComision} onChange={e => setEditComision(e.target.value)} style={{ width: 70 }} />
                <span style={{ fontSize: 12, color: "#5A3828" }}>%</span>
                <button className="btn btn-primary btn-sm" disabled={guardandoComision}
                  onClick={() => guardarComision(v.id)}>{guardandoComision ? "..." : "✓"}</button>
              </>
            ) : (
              <>
                <span style={{ fontSize: 13, color: "#A85D43" }}>{v.comision}%</span>
                <button onClick={() => { setEditId(v.id); setEditComision(String(v.comision)); }} style={{ background: "none", border: "1px solid #2A2A3E", borderRadius: 6, color: "#5A3828", padding: "4px 10px", cursor: "pointer", fontSize: 12 }}>Editar</button>
              </>
            )}
          </div>
        ))}
        {errorComision && (
          <p style={{ fontSize: 12, color: "#B3261E", fontWeight: 600, marginTop: 10, background: "#FFE8E4", borderRadius: 8, padding: "8px 10px" }}>
            {errorComision}
          </p>
        )}
        <p style={{ fontSize: 11, color: "#8A5A2B", marginTop: 10 }}>
          ⚠ El % se aplica a <b>todo el historial</b>, no solo de acá en adelante: si lo cambiás,
          las comisiones de los meses anteriores se recalculan con el valor nuevo.
        </p>

        <div style={{ display: "flex", gap: 8, marginTop: 16, flexWrap: "wrap" }}>
          <input className="input" value={nueva.nombre} onChange={e => setNueva(n => ({ ...n, nombre: e.target.value }))} placeholder="Nombre" style={{ flex: 1, minWidth: 100 }} />
          <input className="input" type="number" value={nueva.comision} onChange={e => setNueva(n => ({ ...n, comision: e.target.value }))} placeholder="%" style={{ width: 70 }} />
          <input type="color" value={nueva.color} onChange={e => setNueva(n => ({ ...n, color: e.target.value }))} style={{ width: 40, height: 40, border: "none", borderRadius: 8, cursor: "pointer", background: "none" }} />
          <button className="btn btn-primary btn-sm" onClick={addVendedora}>+ Agregar</button>
        </div>
      </div>

      <div className="card">
        <p style={{ fontSize: 11, color: "#6B4A3E", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 16 }}>Clientes vinculados ({clientesArr.length})</p>
        {clientesArr.length === 0 && <p style={{ fontSize: 13, color: "#7A5848" }}>Se van registrando automáticamente al cargar ventas</p>}
        <div style={{ maxHeight: 220, overflowY: "auto", display: "flex", flexDirection: "column", gap: 4 }}>
          {clientesArr.map(({ nombre, vendedoraId }) => {
            const v = vendedoras.find(vv => vv.id === vendedoraId);
            return (
              <div key={nombre} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, padding: "4px 0", borderBottom: "1px solid #1A1A25" }}>
                <span style={{ textTransform: "capitalize" }}>{nombre}</span>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ color: v?.color || "#5A3828", fontSize: 12 }}>{v?.nombre || "?"}</span>
                  <button onClick={async () => {
                      if (!window.confirm(`¿Desvincular a "${nombre}" de su vendedora?\n\nSe borra el vínculo cliente↔vendedora. Las ventas ya cargadas no se tocan.`)) return;
                      const { error } = await sb.from("clientes").delete().eq("nombre", nombre);
                      if (error) { window.alert("No se pudo borrar: " + error.message); return; }
                      setClientes(c => { const nc = { ...c }; delete nc[nombre]; return nc; });
                    }} style={{ background: "none", border: "none", color: "#F87171", cursor: "pointer", fontSize: 16, lineHeight: 1 }}>×</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Este boton NUNCA borro nada de la base: solo vaciaba la pantalla. Decia
          "Borrar todos los datos" y al recargar volvia todo, lo cual es un susto
          innecesario. Ahora dice lo que realmente hace. */}
      <div className="card">
        <p style={{ fontSize: 11, color: "#6B4A3E", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 12 }}>Pantalla</p>
        <button onClick={() => { setVentas([]); setPagos([]); setClientes({}); }}
          style={{ background: "#FFF8F5", border: "1px solid #D4A090", borderRadius: 8, color: "#5A3828", padding: "8px 16px", cursor: "pointer", fontSize: 13, fontFamily: "'DM Sans',sans-serif" }}>
          Vaciar la pantalla
        </button>
        <p style={{ fontSize: 11, color: "#7A5848", marginTop: 8 }}>
          Limpia lo que se ve, sin tocar la base. Recargá la página y vuelve todo.
        </p>
      </div>
    </div>
  );
}


function LoginScreen({ onLogin }) {
  const rememberedUser = localStorage.getItem("cv_remembered_user") || "";
  const [user, setUser] = React.useState(rememberedUser);
  const [pass, setPass] = React.useState("");
  const [remember, setRemember] = React.useState(!!rememberedUser);
  const [error, setError] = React.useState(false);

  const handleLogin = () => {
    const u = user.toLowerCase().trim(), p = pass.toLowerCase().trim();
    const rol = (u === "criterio" && p === "comida") ? "gerencia"
              : ((u === "deposito" || u === "depósito") && p === "criterio") ? "deposito"
              : null;
    if (rol) {
      if (remember) { localStorage.setItem("cv_remembered_user", user); }
      else { localStorage.removeItem("cv_remembered_user"); }
      onLogin(rol);
    } else {
      setError(true);
      setTimeout(() => setError(false), 2000);
    }
  };

  return (
    <div style={{ minHeight: "100vh", background: "#C87B5F", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'DM Sans', sans-serif" }}>
      <div style={{ background: "#FFF", borderRadius: 16, padding: 40, width: 320, boxShadow: "0 4px 24px rgba(196,120,90,0.15)", textAlign: "center" }}>
        <div style={{ fontFamily: "Georgia, serif", fontSize: 36, fontWeight: 900, color: "#2C1A14", letterSpacing: "-0.02em", marginBottom: 4 }}>CRITERIO</div>
        <p style={{ color: "#8B6558", fontSize: 13, marginBottom: 32, letterSpacing: "0.1em", textTransform: "uppercase" }}>Ventas</p>
        {rememberedUser ? (
          <p style={{ fontSize: 14, color: "#2C1A14", marginBottom: 12, fontWeight: 600 }}>Hola, {rememberedUser} 👋</p>
        ) : (
          <input value={user} onChange={e => setUser(e.target.value)} placeholder="Usuario" style={{ width: "100%", padding: "10px 14px", border: "1px solid #D4A090", borderRadius: 8, fontSize: 14, marginBottom: 12, boxSizing: "border-box", fontFamily: "inherit", outline: "none", background: "#FFF8F5" }} />
        )}
        <input type="password" value={pass} onChange={e => setPass(e.target.value)} onKeyDown={e => e.key === "Enter" && handleLogin()} placeholder="Contraseña" autoFocus={!!rememberedUser} style={{ width: "100%", padding: "10px 14px", border: "1px solid #D4A090", borderRadius: 8, fontSize: 14, marginBottom: 12, boxSizing: "border-box", fontFamily: "inherit", outline: "none", background: "#FFF8F5" }} />
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16 }}>
          <input type="checkbox" id="rem" checked={remember} onChange={e => setRemember(e.target.checked)} style={{ width: 16, height: 16, cursor: "pointer", accentColor: "#A85D43" }} />
          <label htmlFor="rem" style={{ fontSize: 13, color: "#6B4A3E", cursor: "pointer" }}>Recordar usuario</label>
        </div>
        {error && <p style={{ color: "#E05A3A", fontSize: 13, marginBottom: 12 }}>Contraseña incorrecta</p>}
        <button onClick={handleLogin} style={{ width: "100%", padding: "12px", background: "#A85D43", color: "#FFFFFF", border: "none", borderRadius: 8, fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>Ingresar</button>
        {rememberedUser && (
          <button onClick={() => { localStorage.removeItem("cv_remembered_user"); window.location.reload(); }} style={{ width: "100%", padding: "8px", background: "none", color: "#8B6558", border: "none", fontSize: 12, cursor: "pointer", fontFamily: "inherit", marginTop: 8 }}>No soy {rememberedUser}</button>
        )}
      </div>
    </div>
  );
}

function Root() {
  const [rol, setRol] = React.useState(() => sessionStorage.getItem("cv_rol") || null);
  const handleLogin = (r) => { sessionStorage.setItem("cv_rol", r); setRol(r); };
  const handleLogout = () => { sessionStorage.removeItem("cv_rol"); sessionStorage.removeItem("cv_logged"); setRol(null); };
  if (!rol) return React.createElement(LoginScreen, { onLogin: handleLogin });
  return React.createElement(App, { onLogout: handleLogout, rol });
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Root));

  </script>
</body>
