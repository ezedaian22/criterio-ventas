// Lista tablas via OpenAPI de PostgREST, en ambos schemas
async function listarTablasCostos() {
  const encontradas = [];
  const errores = [];

  for (const schema of ["costos", "public"]) {
    try {
      const headers = { apikey: costosKey, Authorization: `Bearer ${costosKey}` };
      if (schema !== "public") headers["Accept-Profile"] = schema;
      const resp = await fetch(`${costosUrl}/rest/v1/`, { headers });
      const spec = await resp.json();
      const desdeDef = Object.keys(spec.definitions || {});
      const desdePaths = Object.keys(spec.paths || {}).map(k => k.replace(/^\//, ""));
      const nombres = [...new Set([...desdeDef, ...desdePaths])]
        .filter(n => n && n !== "rpc" && !n.startsWith("rpc/"));
      nombres.forEach(n => encontradas.push({ schema, nombre: n, via: "openapi" }));
    } catch (e) {
      errores.push(`${schema}: ${String(e)}`);
    }
  }

  // Fuerza bruta: probar nombres conocidos en ambos schemas
  for (const schema of ["costos", "public"]) {
    const cli = schema === "costos" ? sbCostos : sbCostosPub;
    for (const nombre of CANDIDATAS) {
      const yaEsta = encontradas.some(e => e.schema === schema && e.nombre === nombre);
      if (yaEsta) continue;
      const { error } = await cli.from(nombre).select("*").limit(1);
      if (!error) encontradas.push({ schema, nombre, via: "prueba" });
    }
  }

  return { ok: true, error: errores.join(" | ") || null, tablas: encontradas };
}

// ── MOTOR DE MATCHING DE ARTICULOS ──
const STOP_DESC = new Set(["de","con","sin","y","o","el","la","los","las","un","una","para","en","a","del","al","por"]);

// Solo notacion con barra, que es estandar. NO se expanden abreviaturas de palabras:
// truncar palabras lo resuelve el match por prefijo en similitudDesc, sin tener que
// adivinar que significa cada abreviatura del rubro (ej: "cord" = corderito, no cordon).
const ABREVS = [
  [/\bc\s*\/\s*/g, "con "],
  [/\bs\s*\/\s*/g, "sin "],
  [/\bm\s*\/\s*l\b/g, "manga larga"],
  [/\bm\s*\/\s*c\b/g, "manga corta"],
];

function normTexto(s) {
  let t = String(s || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  // las abreviaturas se expanden ANTES de sacar la puntuacion (c/ y s/ dependen de la barra)
  ABREVS.forEach(([re, rep]) => { t = t.replace(re, rep); });
  return t
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function tokensDesc(s) {
  return normTexto(s).split(" ").filter(t => t.length > 1 && !STOP_DESC.has(t));
}

// Coeficiente de Dice sobre palabras, con tolerancia a plurales/typos por prefijo
function similitudDesc(a, b) {
  const ta = tokensDesc(a), tb = tokensDesc(b);
  if (!ta.length || !tb.length) return 0;
  const usados = new Array(tb.length).fill(false);
  let comunes = 0;
  ta.forEach(t => {
    let idx = tb.findIndex((u, i) => !usados[i] && u === t);
    if (idx === -1) {
      idx = tb.findIndex((u, i) => {
        if (usados[i]) return false;
        const n = Math.min(4, Math.min(t.length, u.length));
        return n >= 3 && t.slice(0, n) === u.slice(0, n);
      });
      if (idx !== -1) { usados[idx] = true; comunes += 0.75; return; }
    } else { usados[idx] = true; comunes += 1; }
  });
  return (2 * comunes) / (ta.length + tb.length);
}

const normCodigo = c => String(c || "").trim().toUpperCase().replace(/\s+/g, "");

// La misma prenda esta escrita con la letra de los dos lados segun la tabla:
// en `articulos` figura como L728 y en `costo_articulo` como 728L. Son el mismo
// articulo. Para compararlos se lleva la letra SIEMPRE al final.
// OJO: la letra NO se saca nunca. 728 (estampada) y 728L (lisa) son prendas
// distintas con costos distintos, y tienen que seguir siendo distintas.
// Verificado sobre las dos tablas: con esta regla no se junta ningun par de
// codigos que hoy sean articulos diferentes.
const canonCodigo = c => {
  const n = normCodigo(c);
  const m = n.match(/^([A-Z]+)(\d+)$/);
  return m ? m[2] + m[1] : n;
};

// Palabras que indican que un renglon del remito son VARIOS articulos del catalogo
const PALABRAS_CONJUNTO = ["conjunto", "juego", "set", "combo"];
const esConjunto = desc => {
  const t = tokensDesc(desc);
  return t.some(w => PALABRAS_CONJUNTO.includes(w));
};

// Para un conjunto, los candidatos salen de las palabras distintivas
// (sacando la que indica conjunto): "conjunto darlon" -> todos los darlon
function candidatosConjunto(desc, catalogo, limite = 12) {
  const distintivas = tokensDesc(desc).filter(w => !PALABRAS_CONJUNTO.includes(w));
  if (!distintivas.length) return [];
  return catalogo
    .map(a => {
      const ta = tokensDesc(a.descripcion);
      let hits = 0;
      distintivas.forEach(d => {
        if (ta.some(u => u === d || (d.length >= 3 && u.length >= 3 &&
            u.slice(0, 4) === d.slice(0, 4)))) hits++;
      });
      return { a, hits };
    })
    .filter(x => x.hits > 0)
    .sort((x, y) => y.hits - x.hits || String(x.a.codigo).localeCompare(String(y.a.codigo)))
    .slice(0, limite)
    .map(x => x.a);
}

// Devuelve el mejor match + estado + candidatos alternativos
function matchearArticulo(codigoLeido, descLeida, catalogo, aliases = {}) {
  const base = { codigo: null, descripcion: null, costo_total: null, estado: "sin_match", score: 0, candidatos: [] };
  if (!catalogo || !catalogo.length) return base;

  const ranking = catalogo
    .map(a => ({ a, s: similitudDesc(descLeida, a.descripcion) }))
    .sort((x, y) => y.s - x.s);
  const top3 = ranking.slice(0, 3).map(r => ({ ...r.a, score: Math.round(r.s * 100) / 100 }));
  const mejor = ranking[0] ? ranking[0].a : null;
  const mejorScore = ranking[0] ? ranking[0].s : 0;

  // 1. Alias aprendido de una correccion previa (puede tener varios codigos separados por coma)
  const clave = normTexto(descLeida);
  if (clave && aliases[clave]) {
    const codigos = String(aliases[clave]).split(",").map(s => s.trim()).filter(Boolean);
    const arts = codigos
      .map(cod => catalogo.find(a => canonCodigo(a.codigo) === canonCodigo(cod)))
      .filter(Boolean);
    if (arts.length === 1) {
      return { ...base, ...arts[0], estado: "alias", score: 1, candidatos: top3 };
    }
    if (arts.length > 1) {
      const costoSuma = arts.every(a => a.costo_total !== null)
        ? arts.reduce((s, a) => s + Number(a.costo_total), 0)
        : null;
      return {
        ...base,
        codigo: arts.map(a => a.codigo).join(" + "),
        descripcion: arts.map(a => a.descripcion).join(" + "),
        costo_total: costoSuma,
        componentes: arts,
        estado: "alias", score: 1, candidatos: top3,
      };
    }
  }

  // Renglon que es un conjunto: no se resuelve solo, hay que elegir los componentes
  if (esConjunto(descLeida)) {
    return { ...base, estado: "conjunto", score: 0, candidatos: top3 };
  }

  // 2. Codigo exacto
  const porCodigo = codigoLeido
    ? catalogo.find(a => canonCodigo(a.codigo) === canonCodigo(codigoLeido)) || null
    : null;

  if (porCodigo) {
    const hayDesc = tokensDesc(descLeida).length > 0;
    if (!hayDesc) return { ...base, ...porCodigo, estado: "solo_codigo", score: 1, candidatos: top3 };
    const sCod = similitudDesc(descLeida, porCodigo.descripcion);
    if (sCod >= 0.45) return { ...base, ...porCodigo, estado: "ok", score: sCod, candidatos: top3 };
    return { ...base, ...porCodigo, estado: "revisar", score: sCod, candidatos: top3 };
  }

  // 3. Solo descripcion
  // Empate tecnico: si el 2do candidato esta a menos de 0.08 del 1ro, la descripcion
  // NO alcanza para decidir. No se elige ninguno: hay que mirarlo si o si.
  const segundo = ranking[1] ? ranking[1].s : 0;
  const empatados = mejorScore > 0 && (mejorScore - segundo) < 0.08;

  if (mejorScore >= 0.45 && empatados) {
    return { ...base, estado: "ambiguo", score: mejorScore, candidatos: top3 };
  }
  if (mejorScore >= 0.45) return { ...base, ...mejor, estado: "similar", score: mejorScore, candidatos: top3 };
  return { ...base, estado: "sin_match", score: mejorScore, candidatos: top3 };
}

// Numero o null, conservando el 0. Number(x) || null pisa el 0 con null.
const numONull = (x) => {
  if (x === null || x === undefined || x === "") return null;
  const n = Number(x);
  return Number.isFinite(n) ? n : null;
};

// Arma el costo de una venta y las filas a guardar en venta_items.
// costoTotal queda en null si algun renglon no se pudo costear, para no inflar la ganancia.
function costearVenta(extracted, catalogo, aliases) {
  const items = (extracted && extracted.items) || [];
  if (!items.length || !catalogo || !catalogo.length) {
    return { costoTotal: null, completo: false, filas: [], sinCostear: items.length };
  }
  let acum = 0, sinCostear = 0;
  const filas = items.map(it => {
    const m = matchearArticulo(it.codigo, it.descripcion, catalogo, aliases || {});
    const cant = Number(it.cantidad || 1);
    const costoUnit = m.costo_total !== null && m.costo_total !== undefined ? Number(m.costo_total) : null;
    if (costoUnit === null) sinCostear++;
    else acum += costoUnit * cant;
    return {
      articulo_codigo: m.codigo || null,
      descripcion_leida: it.descripcion || null,
      cantidad: cant,
      // `Number(x) || null` convertia un 0 legitimo en null (una bonificacion, por
      // ejemplo). Solo tiene que ser null lo que realmente no vino o no es numero.
      precio_unitario: numONull(it.precio),
      total_item: numONull(it.total),
      costo_unitario: costoUnit,
      estado_match: m.estado,
    };
  });
  const completo = sinCostear === 0;
  return { costoTotal: completo ? acum : null, completo, filas, sinCostear };
}

// Catalogo completo: articulos (codigo + descripcion) cruzado con costo_articulo (costo_total)
async function armarCatalogoCompleto() {
  // Paginado. Antes decia .limit(5000), que no sirve de nada: el servidor devuelve
  // 1000 y listo. Hoy el catalogo tiene ~526 articulos asi que no se notaba, pero el
  // dia que pase de 1000 los articulos de mas dejarian de matchear sin ningun sintoma.
  const { rows: arts, error: e1 } = await traerTodo(sbCostos, "articulos");
  if (e1) return { ok: false, error: "articulos: " + e1, rows: [] };

  const { rows: cst, error: e2 } = await traerTodo(sbCostos, "costo_articulo");
  if (e2) return { ok: false, error: "costo_articulo: " + e2, rows: [] };

  const norm = s => String(s || "").trim().toUpperCase().replace(/\s+/g, "");
  // El costo se busca por codigo canonico (letra al final), porque `articulos` usa
  // L728 y `costo_articulo` usa 728L para la misma prenda. Sin esto, los 42
  // articulos de lino figuraban "sin costo cargado" teniendolo.
  const mapaCosto = {};
  (cst || []).forEach(r => { mapaCosto[canonCodigo(r.codigo)] = r.costo_total; });

  // Detecta el campo de descripcion sin asumir el nombre exacto
  const campoDesc = (a) => a.descripcion ?? a.description ?? a.nombre ?? a.detalle ?? "";

  // Dedup por codigo: gana la fila con descripcion mas larga (ficha mas completa)
  const porCodigo = {};
  (arts || []).forEach(a => {
    const cod = norm(a.codigo);
    if (!cod) return;
    const desc = String(campoDesc(a) || "").trim();
    const prev = porCodigo[cod];
    if (!prev || desc.length > String(prev.descripcion || "").length) {
      porCodigo[cod] = {
        codigo: String(a.codigo).trim(),
        descripcion: desc,
        categoria: a.categoria ?? null,
        temporada_id: a.temporada_id ?? null,
      };
    }
  });

  const rows = Object.values(porCodigo).map(a => ({
    ...a,
    costo_total: mapaCosto[canonCodigo(a.codigo)] ?? null,
  }));

  return {
    ok: true, error: null, rows,
    filasArticulos: (arts || []).length,
    filasCosto: (cst || []).length,
    conDesc: rows.filter(r => r.descripcion).length,
    conCosto: rows.filter(r => r.costo_total !== null).length,
  };
}

// Fuzzy matching para nombres de clientes
const escapeRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function similaridad(a, b) {
  a = a.toLowerCase().trim();
  b = b.toLowerCase().trim();
  if (a === b) return 1;
  const longer = a.length > b.length ? a : b;
  const shorter = a.length > b.length ? b : a;
  // "uno contiene al otro" vale 0.9, pero SOLO si lo contenido es una palabra entera
  // y de 5 letras para arriba. Sin esto "ana" daba 0.9 contra "analia" y "paula"
  // contra "paul", y el cliente nuevo heredaba la vendedora de otro sin que se note.
  // El minimo de 5 saca los nombres cortos, que son los que dan falsos positivos:
  // con 4 alcanzaba para que "rosa" enganchara con "marcela de santa rosa".
  if (shorter.length >= 5 &&
      new RegExp(`(^|\\s)${escapeRe(shorter)}(\\s|$)`).test(longer)) return 0.9;
  let matches = 0;
  for (let i = 0; i < shorter.length; i++) {
    if (longer.includes(shorter[i])) matches++;
  }
  return matches / longer.length;
}

// Parecido pensado para nombres: combina el char-a-char con match por palabras
// (asi "tamara san luis" engancha con "tani san wuis" aunque cambien letras)
function parecidoNombre(a, b) {
  const na = normTexto(a), nb = normTexto(b);
  if (!na || !nb) return 0;
  if (na === nb) return 1;
  const ta = na.split(" ").filter(Boolean), tb = nb.split(" ").filter(Boolean);
  const usados = new Array(tb.length).fill(false);
  let hits = 0;
  ta.forEach(p => {
    let idx = tb.findIndex((q, i) => !usados[i] && q === p);
    if (idx === -1) {
      idx = tb.findIndex((q, i) => {
        if (usados[i]) return false;
        const n = Math.min(3, Math.min(p.length, q.length));
        return n >= 3 && p.slice(0, n) === q.slice(0, n);
      });
      if (idx !== -1) { usados[idx] = true; hits += 0.8; return; }
      idx = tb.findIndex((q, i) => !usados[i] && similaridad(p, q) >= 0.6);
      if (idx !== -1) { usados[idx] = true; hits += 0.6; return; }
    } else { usados[idx] = true; hits += 1; }
  });
  const porPalabra = (2 * hits) / (ta.length + tb.length);
  return Math.max(porPalabra, similaridad(na, nb));
}

function buscarCliente(nombre, clientesObj) {
  if (!nombre) return null;
  const key = nombre.toLowerCase().trim();
  if (clientesObj[key] !== undefined) return clientesObj[key];

  // Todos los que pasan el umbral, no solo el mejor: si dos clientes distintos se
  // parecen y son de vendedoras distintas, el nombre NO alcanza para decidir y no
  // se elige ninguno. Es preferible que la persona la elija a mano antes que
  // asignarle la venta a la vendedora equivocada sin que se note.
  const candidatos = [];
  for (const k of Object.keys(clientesObj)) {
    const score = parecidoNombre(key, k);
    if (score >= 0.85) candidatos.push({ vendedora: clientesObj[k], score });
  }
  if (!candidatos.length) return null;
  // Un candidato sin vendedora (null) cuenta como "no se sabe", asi que tambien
  // frena la asignacion automatica. Es a proposito: preferimos una eleccion manual
  // de mas antes que adivinar.
  const vendedorasDistintas = new Set(candidatos.map(c => c.vendedora));
  if (vendedorasDistintas.size > 1) return null;
  const elegida = candidatos[0].vendedora;
  return elegida === null || elegida === undefined ? null : elegida;
}


// ── Traer una tabla ENTERA ──
// Supabase devuelve como maximo 1000 filas por consulta y no avisa cuando corta.
// Poner .limit(5000) no sirve: el tope lo pone el servidor. Todo lo que pueda pasar
// de 1000 algun dia tiene que pedirse de a paginas o se empieza a cortar en silencio.
const PAGINA = 1000;
async function traerTodo(cliente, tabla, columnas = "*", orden = null) {
  let todo = [], desde = 0;
  while (true) {
    let q = cliente.from(tabla).select(columnas);
    if (orden) orden.forEach(o => { q = q.order(o.col, { ascending: o.asc !== false }); });
    const { data, error } = await q.range(desde, desde + PAGINA - 1);
    if (error) return { rows: todo, error: error.message || JSON.stringify(error) };
    if (!data || data.length === 0) break;
    todo = todo.concat(data);
    if (data.length < PAGINA) break;
    desde += PAGINA;
  }
  return { rows: todo, error: null };
}

// DB helpers
async function dbGetAll(table) {
  // El desempate por id es imprescindible: 1045 de las ventas comparten el mismo
  // created_at (una importacion vieja). Ordenando solo por created_at, el orden entre
  // filas empatadas no esta garantizado y al pedir la pagina 2 puede repetirse o
  // saltearse una fila.
  const { rows, error } = await traerTodo(sb, table, "*", [
    { col: "created_at", asc: false },
    { col: "id", asc: false },
  ]);
  if (error) console.error(table, error);
  const data = rows;
  console.log(table, "total cargados:", data.length);
  // Normalize fecha to string to avoid timezone issues
  if (data && (table === "ventas" || table === "pagos")) {
    data.forEach(row => {
      if (row.fecha) {
        // If Date object, convert to YYYY-MM-DD string
        if (row.fecha instanceof Date) {
          row.fecha = hoyLocal(row.fecha);
        } else {
          row.fecha = String(row.fecha).substring(0, 10);
        }
      }
    });
  }
  return data || [];
}
// Devuelve { row, error }. El error NO se puede tragar: quien llama tiene que
// mostrarlo, porque si no la venta se pierde y la pantalla dice que se guardo.
async function dbInsert(table, row) {
  const { data, error } = await sb.from(table).insert([row]).select();
  if (error) {
    console.error("insert", table, error);
    return { row: null, error: error.message || JSON.stringify(error) };
  }
  const guardada = data?.[0] || null;
  if (!guardada) return { row: null, error: "Supabase no devolvio la fila guardada" };
  return { row: guardada, error: null };
}
async function dbDelete(table, id) {
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error) { console.error("delete", table, error); return { ok: false, error: error.message || JSON.stringify(error) }; }
  return { ok: true, error: null };
}
async function dbUpdate(table, id, updates) {
  const { error } = await sb.from(table).update(updates).eq("id", id);
  if (error) { console.error("update", table, error); return { ok: false, error: error.message || JSON.stringify(error) }; }
  return { ok: true, error: null };
}

const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function fmtPeso(n) {
  return "$" + Number(n || 0).toLocaleString("es-AR", { minimumFractionDigits: 0 });
}

function getMonthKey(date) {
  if (!date) return "";
  // Handle Date objects from Supabase
  if (date instanceof Date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
  }
  // Handle ISO string "2023-03-15" or "2023-03-15T..."
  const str = String(date);
  if (str.match(/^\d{4}-\d{2}/)) {
    return str.substring(0, 7); // "2023-03"
  }
  // Fallback: slice string directly to avoid timezone issues
  return String(date).substring(0, 7);
}

// Fecha de HOY en horario local. NO usar toISOString(): devuelve UTC, y despues de
// las 21hs de Argentina ya es el dia siguiente, con lo cual las ventas cargadas de
// noche a fin de mes caian en el mes equivocado.
function hoyLocal(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Leyenda fija arriba de todo con la fecha del último backup local (ver
// Documents/criterio-ventas-backups). El script de backup inserta una fila en
// backups_log cada vez que corre; acá solo se lee la última.
// Si la tabla todavía no existe, no se muestra nada: no es un error del usuario,
// es que falta correr el SQL que la crea.
function UltimoBackup() {
  const [ultimo, setUltimo] = useState(null); // null = todavía no se sabe / no hay tabla

  useEffect(() => {
    sb.from("backups_log")
      .select("created_at, ok")
      .order("created_at", { ascending: false })
      .limit(1)
      .then(({ data, error }) => {
        if (!error && data && data[0]) setUltimo(data[0]);
      });
  }, []);

  if (!ultimo) return null;

  const fecha = new Date(ultimo.created_at);
  const fechaTexto = fecha.toLocaleDateString("es-AR") + " " +
    fecha.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  // Lunes a viernes corre a las 13:55: un salto de más de 4 días (cubre un fin de
  // semana largo) sin ningún backup nuevo es la señal de que algo dejó de correr,
  // no solo que hoy es sábado.
  const diasSinCorrer = (Date.now() - fecha.getTime()) / 86400000;
  const estado = !ultimo.ok ? "error" : diasSinCorrer > 4 ? "atrasado" : "ok";

  const estilos = {
    ok:        { bg: "#E6F7EF", color: "#0B7A55", texto: `🗄️ Último backup: ${fechaTexto}` },
    atrasado:  { bg: "#FFF4E6", color: "#8A5A2B", texto: `⚠️ Último backup: ${fechaTexto} (hace más de 4 días)` },
    error:     { bg: "#FFE8E4", color: "#B3261E", texto: `❌ El último backup (${fechaTexto}) falló — revisar backup.log` },
  }[estado];

  return (
    <div style={{ background: estilos.bg, color: estilos.color, fontSize: 12, fontWeight: 600,
                  textAlign: "center", padding: "4px 8px" }}>
      {estilos.texto}
    </div>
  );
}

function App({ onLogout, rol }) {

  const [aliasClientes, setAliasClientes] = useState({});
  // Lo que no se pudo cargar al arrancar. Antes esto era un console.log y la app
  // seguia andando a medias sin que se notara (sin catalogo no hay costos, por ejemplo).
  const [avisoCarga, setAvisoCarga] = useState([]);

  // Load all data from Supabase on mount
  useEffect(() => {
    const loadData = async () => {
      // Las API keys de Gemini viven SOLO en este dispositivo (localStorage), a proposito.
      // Guardarlas en Supabase implicaba una tabla legible por cualquiera que tenga la
      // key publica, que esta en el repo: seria publicar las keys.

      // Catalogo de Costos + alias aprendidos (para el matching de articulos)
      const problemas = [];
      try {
        const cat = await armarCatalogoCompleto();
        if (cat.ok) setCatalogo(cat.rows);
        else problemas.push("catálogo de artículos: " + cat.error);

        const it = await traerTodo(sb, "venta_items");
        if (it.error) problemas.push("detalle por artículo: " + it.error);
        setVentaItems(it.rows);

        // Los alias crecen con cada correccion: sin paginar, pasadas las 1000 las
        // correcciones viejas dejaban de aplicarse y habia que rehacerlas.
        const alCli = await traerTodo(sb, "cliente_alias");
        if (alCli.error) problemas.push("alias de clientes: " + alCli.error);
        const mapaCli = {};
        alCli.rows.forEach(r => { if (r.texto && r.es_mismo !== false) mapaCli[r.texto] = r.nombre_real; });
        setAliasClientes(mapaCli);

        const al = await traerTodo(sb, "articulo_alias");
        if (al.error) problemas.push("alias de artículos: " + al.error);
        const mapa = {};
        al.rows.forEach(r => { if (r.texto) mapa[r.texto] = r.articulo_codigo; });
        setAliases(mapa);
      } catch (e) {
        problemas.push("catálogo/alias: " + (e.message || String(e)));
      }
      if (problemas.length) setAvisoCarga(problemas);

      setLoading(true);
      try {
        const [v, vend, c, p] = await Promise.all([
          dbGetAll("ventas"),
          dbGetAll("vendedoras"),
          dbGetAll("clientes"),
          dbGetAll("pagos"),
        ]);
        if (v) setVentas(v);
        if (vend && vend.length > 0) setVendedoras(vend);
        if (c) {

          setClientes(clientesObj);

  // Devuelve { ok, error, avisos }. Quien la llama TIENE que mirar el ok antes de

  const addVenta = async (venta) => {
    const { vendedoraId, _itemsCosto, ...rest } = venta;
    const row = { ...rest, vendedora_id: vendedoraId, fecha: venta.fecha || hoyLocal() };
    const { row: saved, error } = await dbInsert("ventas", row);
    if (error || !saved) return { ok: false, error: error || "No se pudo guardar", avisos: [] };
    setVentas(v => [saved, ...v]);

    // De aca en adelante la venta YA esta guardada. Si algo de esto falla, no se
    // pierde la venta, pero hay que avisarlo igual para que no quede incompleta en silencio.
    const avisos = [];

    // Detalle por articulo, para poder auditar el costo despues.
    if (_itemsCosto && _itemsCosto.length) {

  const addPago = async (vendedoraId, monto, mes) => {

  const guardarAlias = async (textoLeido, codigo) => {

// ─── ARTICULOS: que se vende mas y que menos ─────────────────────────────────
function Articulos({ ventaItems, ventas, catalogo, fmtPeso, MESES, getMonthKey }) {
  const [orden, setOrden] = useState("unidades");
  const [periodo, setPeriodo] = useState("todo");
  const [verFondo, setVerFondo] = useState(false);
  const [soloConHistoria, setSoloConHistoria] = useState(true);

  const fmtCorto = (n) => {
    const v = Number(n || 0);
    if (!v) return "—";
    if (Math.abs(v) >= 1000000) return (v / 1000000).toFixed(1).replace(".", ",") + "M";
    if (Math.abs(v) >= 1000) return Math.round(v / 1000) + "k";
    return String(Math.round(v));
  };

  // venta_id -> mes, para poder filtrar por periodo
  const mesDeVenta = (() => {
    const m = {};
    ventas.forEach(v => { m[v.id] = getMonthKey(v.fecha); });
    return m;
  })();

  // Mismo criterio que la pestaña Resumen: solo cuentan las ventas que quedaron con el
  // costo COMPLETO. Antes esta pantalla contaba renglon por renglon, asi que una venta
  // con un renglon sin costear sumaba igual aca y no sumaba alla, y las dos pantallas
  // daban ganancias distintas para el mismo periodo sin que nada lo explicara.
  const ventaCompleta = (() => {
    const s = new Set();
    ventas.forEach(v => { if (v.costo_total !== null && v.costo_total !== undefined) s.add(v.id); });
    return s;
  })();

  const hoy = new Date();
  const mesActual = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}`;
  const haceMeses = (n) => {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - n);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  };

  const enPeriodo = (mk) => {
    if (!mk) return periodo === "todo";
    if (periodo === "todo") return true;
    if (periodo === "mes") return mk === mesActual;
    if (periodo === "3") return mk >= haceMeses(2);
    if (periodo === "12") return mk >= haceMeses(11);
    return true;
  };

  // Agregado por codigo de articulo
  const agregado = (() => {
    const m = {};
    let sinCodigo = 0, itemsUsados = 0, itemsDeVentaIncompleta = 0;
    const ventasIncompletas = new Set();
    ventaItems.forEach(it => {
      const mk = mesDeVenta[it.venta_id];
      if (!enPeriodo(mk)) return;
      if (!ventaCompleta.has(it.venta_id)) {
        itemsDeVentaIncompleta++;
        ventasIncompletas.add(it.venta_id);
        return;
      }
      const cod = it.articulo_codigo;
      if (!cod) { sinCodigo++; return; }
      itemsUsados++;
      const cant = Number(it.cantidad || 0);
      const fact = Number(it.total_item || 0);
      const cu = it.costo_unitario === null || it.costo_unitario === undefined ? null : Number(it.costo_unitario);
      if (!m[cod]) m[cod] = { codigo: cod, unidades: 0, facturacion: 0, costo: 0, ops: 0, sinCosto: false };
      m[cod].unidades += cant;
      m[cod].facturacion += fact;
      m[cod].ops += 1;
      if (cu === null) m[cod].sinCosto = true;
      else m[cod].costo += cu * cant;
    });
    const arr = Object.values(m).map(a => {
      const art = (catalogo || []).find(x => String(x.codigo).trim().toUpperCase() === String(a.codigo).trim().toUpperCase());
      const gan = a.sinCosto ? null : a.facturacion - a.costo;
      return { ...a, descripcion: art ? art.descripcion : "(fuera del catálogo)",
               ganancia: gan,
               margenPct: gan !== null && a.facturacion > 0 ? (gan / a.facturacion) * 100 : null,
               ganUnidad: gan !== null && a.unidades > 0 ? gan / a.unidades : null };
    });
    return { arr, sinCodigo, itemsUsados, itemsDeVentaIncompleta, ventasIncompletas: ventasIncompletas.size };
  })();

  const ordenados = [...agregado.arr].sort((a, b) => {
    if (orden === "unidades") return b.unidades - a.unidades;
    if (orden === "facturacion") return b.facturacion - a.facturacion;
    if (orden === "margen") return (b.margenPct ?? -Infinity) - (a.margenPct ?? -Infinity);
    if (orden === "porUnidad") return (b.ganUnidad ?? -Infinity) - (a.ganUnidad ?? -Infinity);
    return (b.ganancia ?? -Infinity) - (a.ganancia ?? -Infinity);
  });
  // Ordenando por margen o por $/prenda, un articulo con una sola venta puede quedar
  // primero por casualidad. Con 3+ ventas el dato es mas confiable.
  const porcentual = orden === "margen" || orden === "porUnidad";
  const base = (porcentual && soloConHistoria)
    ? ordenados.filter(a => a.ops >= 3)
    : ordenados;
  const mostrados = verFondo ? [...base].reverse() : base;

  const totUnid = agregado.arr.reduce((s, a) => s + a.unidades, 0);
  const totFact = agregado.arr.reduce((s, a) => s + a.facturacion, 0);
  const totGan = agregado.arr.reduce((s, a) => s + (a.ganancia || 0), 0);

  const btn = (activo) => ({
    background: activo ? "#A85D43" : "#FFF8F5", color: activo ? "#fff" : "#5A3828",
    border: "1px solid #D4A090", borderRadius: 7, padding: "5px 11px", fontSize: 11,
    cursor: "pointer", fontFamily: "inherit",
  });

  const th = { fontSize: 10, color: "#7A5848", textTransform: "uppercase", letterSpacing: "0.05em",
               padding: "8px 6px", textAlign: "right", fontWeight: 600, whiteSpace: "nowrap" };
  const td = { fontSize: 13, padding: "8px 6px", textAlign: "right", whiteSpace: "nowrap" };

  if (!ventaItems.length) {
    return (
      <div className="card">
        <p style={{ fontSize: 13, fontWeight: 700, color: "#8A5A2B", margin: 0 }}>
          Todavía no hay datos de artículos
        </p>
        <p style={{ fontSize: 12, color: "#7A5848", margin: "6px 0 0 0" }}>
          El detalle por artículo se empieza a guardar recién con las ventas que cargues de ahora en más.
          Las ventas viejas nunca guardaron qué artículos eran, así que no hay ranking hacia atrás.
        </p>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

      <div className="card" style={{ display: "flex", flexWrap: "wrap", gap: 14, alignItems: "center", padding: "12px 16px" }}>
        <div>
          <span style={{ fontSize: 10, color: "#7A5848", textTransform: "uppercase" }}>Unidades </span>
          <span style={{ fontSize: 17, fontWeight: 700 }}>{totUnid}</span>
        </div>
        <div>
          <span style={{ fontSize: 10, color: "#7A5848", textTransform: "uppercase" }}>Facturación </span>
          <span style={{ fontSize: 17, fontWeight: 700 }}>{fmtPeso(totFact)}</span>
        </div>
        <div>
          <span style={{ fontSize: 10, color: "#7A5848", textTransform: "uppercase" }}>Ganancia </span>
          <span style={{ fontSize: 17, fontWeight: 700, color: "#10B981" }}>{fmtPeso(totGan)}</span>
          {/* Ahora facturacion y ganancia salen de las mismas ventas, asi que el margen
              es comparable. Antes la facturacion incluia ventas cuya ganancia no se contaba. */}
          {totFact > 0 && (
            <span style={{ fontSize: 12, color: "#7A5848", marginLeft: 4 }}>
              ({Math.round((totGan / totFact) * 100)}%)
            </span>
          )}
        </div>

        <div style={{ display: "flex", gap: 5, marginLeft: "auto", flexWrap: "wrap" }}>
          <button onClick={() => setPeriodo("mes")} style={btn(periodo === "mes")}>Este mes</button>
          <button onClick={() => setPeriodo("3")} style={btn(periodo === "3")}>3 meses</button>
          <button onClick={() => setPeriodo("12")} style={btn(periodo === "12")}>12 meses</button>
          <button onClick={() => setPeriodo("todo")} style={btn(periodo === "todo")}>Todo</button>
        </div>
      </div>

      <div className="card" style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center", padding: "10px 16px" }}>
        <span style={{ fontSize: 11, color: "#7A5848" }}>Ordenar por:</span>
        <button onClick={() => setOrden("unidades")} style={btn(orden === "unidades")}>Unidades</button>
        <button onClick={() => setOrden("facturacion")} style={btn(orden === "facturacion")}>Facturación</button>
        <button onClick={() => setOrden("ganancia")} style={btn(orden === "ganancia")}>Ganancia $</button>
        <button onClick={() => setOrden("margen")} style={btn(orden === "margen")}>Margen %</button>
        <button onClick={() => setOrden("porUnidad")} style={btn(orden === "porUnidad")}>$ por prenda</button>
        {porcentual && (
          <button onClick={() => setSoloConHistoria(v => !v)} style={btn(soloConHistoria)}>
            {soloConHistoria ? "✓ 3+ ventas" : "incluir los de 1-2 ventas"}
          </button>
        )}
        <button onClick={() => setVerFondo(v => !v)}
          style={{ ...btn(verFondo), marginLeft: "auto" }}>
          {verFondo ? "↑ Los que más" : "↓ Los que menos"}
        </button>
      </div>

      <div className="card" style={{ padding: 0, overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 560 }}>
          <thead>
            <tr style={{ borderBottom: "2px solid #E8C4B0" }}>
              <th style={{ ...th, textAlign: "left" }}>Artículo</th>
              <th style={{ ...th, color: orden === "unidades" ? "#A85D43" : "#7A5848" }}>Unid.</th>
              <th style={{ ...th, color: orden === "facturacion" ? "#A85D43" : "#7A5848" }}>Facturación</th>
              <th style={th}>Costo</th>
              <th style={{ ...th, color: orden === "ganancia" ? "#A85D43" : "#7A5848" }}>Ganancia $</th>
              <th style={{ ...th, color: orden === "margen" ? "#A85D43" : "#7A5848" }}>Margen %</th>
              <th style={{ ...th, color: orden === "porUnidad" ? "#A85D43" : "#7A5848" }}>$/prenda</th>
            </tr>
          </thead>
          <tbody>
            {mostrados.slice(0, 40).map((a, i) => {
              const pctMargen = a.ganancia !== null && a.facturacion > 0
                ? Math.round((a.ganancia / a.facturacion) * 100) : null;
              return (
                <tr key={a.codigo} style={{ borderBottom: "1px solid #F0E0D8" }}>
                  <td style={{ ...td, textAlign: "left", maxWidth: 260, whiteSpace: "normal" }}>
                    <span style={{ fontSize: 10, color: "#9A7570" }}>{i + 1}. </span>
                    <b>{a.codigo}</b>
                    <span style={{ fontSize: 12, color: "#5A3828" }}> — {a.descripcion}</span>
                    <span style={{ fontSize: 10, color: "#B8A49C" }}> · {a.ops} vta{a.ops !== 1 ? "s" : ""}</span>
                  </td>
                  <td style={{ ...td, fontWeight: 700 }}>{a.unidades}</td>
                  <td style={td}>{fmtCorto(a.facturacion)}</td>
                  <td style={{ ...td, color: "#9A7570" }}>{a.sinCosto ? "s/d" : fmtCorto(a.costo)}</td>
                  <td style={{ ...td, color: a.ganancia === null ? "#C9B3A8" : a.ganancia >= 0 ? "#10B981" : "#F87171", fontWeight: 600 }}>
                    {a.ganancia === null ? "s/d" : fmtCorto(a.ganancia)}
                  </td>
                  <td style={{ ...td, fontSize: 12, fontWeight: orden === "margen" ? 700 : 500,
                               color: pctMargen === null ? "#C9B3A8"
                                    : pctMargen >= 40 ? "#10B981" : pctMargen >= 20 ? "#8A5A2B" : "#F87171" }}>
                    {pctMargen === null ? "—" : `${pctMargen}%`}
                  </td>
                  <td style={{ ...td, fontSize: 12, color: "#5A3828",
                               fontWeight: orden === "porUnidad" ? 700 : 500 }}>
                    {a.ganUnidad === null ? "—" : fmtCorto(a.ganUnidad)}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <p style={{ fontSize: 10, color: "#7A5848", textAlign: "center", margin: 0 }}>
        {agregado.itemsUsados} renglones contados · {agregado.arr.length} artículos distintos
        {mostrados.length > 40 && ` · la tabla muestra los primeros 40`}
        {agregado.sinCodigo > 0 && ` · ⚠ ${agregado.sinCodigo} renglones sin artículo identificado quedaron afuera`}
      </p>
      {agregado.ventasIncompletas > 0 && (
        <p style={{ fontSize: 10, color: "#8A5A2B", textAlign: "center", margin: 0 }}>
          {agregado.ventasIncompletas === 1
            ? `1 venta quedó afuera (${agregado.itemsDeVentaIncompleta} renglones) porque no se le pudo costear algún renglón.`
            : `${agregado.ventasIncompletas} ventas quedaron afuera (${agregado.itemsDeVentaIncompleta} renglones) porque no se les pudo costear algún renglón.`}
          {" "}Es el mismo criterio que usa Resumen, para que los dos números coincidan.
        </p>
      )}
    </div>
  );
}

// ─── CLIENTES ────────────────────────────────────────────────────────────────
// A proposito NO se interpreta el texto pegado: se guarda tal cual y se muestra
// tal cual. El nombre real lo tipea la persona.

function Clientes({ vendedoras, esDeposito }) {
  const [lista, setLista] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [busca, setBusca] = useState("");
  const [nuevo, setNuevo] = useState(false);
  const [nombreReal, setNombreReal] = useState("");
  const [pegado, setPegado] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [msg, setMsg] = useState(null);
  const [editId, setEditId] = useState(null);
  const [parecidos, setParecidos] = useState(null);
  const [buscandoPar, setBuscandoPar] = useState(false);
  const [vinculados, setVinculados] = useState({});
  const [filtroPar, setFiltroPar] = useState("");

  const cargar = async () => {
    setCargando(true);
    // Paginado: la lista crece con cada cliente nuevo y pasadas las 1000 filas se
    // cortaba sola, mostrando "1000 clientes" sin ninguna senal de que faltaban.
    const { rows, error } = await traerTodo(sb, "clientes", "*", [{ col: "nombre" }]);
    if (error) setMsg({ tipo: "error", txt: "No se pudo cargar la lista de clientes: " + error });
    else setLista(rows);
    setCargando(false);
  };
  useEffect(() => { cargar(); }, []);

  const limpiarForm = () => {
    setNuevo(false); setNombreReal(""); setPegado(""); setEditId(null); setParecidos(null);
  };

  const guardar = async () => {
    const real = nombreReal.trim();
    if (!real) { setMsg({ tipo: "error", txt: "Falta el nombre del cliente" }); return; }
    setGuardando(true);
    const fila = {
      nombre: real.toLowerCase(),
      nombre_real: real,
      texto_original: pegado || null,
    };
    const { error } = await sb.from("clientes").upsert([fila], { onConflict: "nombre" });
    setGuardando(false);
    if (error) { setMsg({ tipo: "error", txt: error.message }); return; }
    setMsg({ tipo: "ok", txt: `${real} guardado` });
    setTimeout(() => setMsg(null), 2500);
    limpiarForm();
    cargar();
  };

  // parecidoNombre ahora vive arriba, a nivel modulo, para que Nueva Venta use el mismo criterio

  // Trae TODOS los nombres escritos en ventas (Supabase corta en 1000 por consulta)
  const traerNombresVentas = async () => {
    const { rows } = await traerTodo(sb, "ventas", "cliente");
    return rows;
  };

  const buscarParecidos = async (real) => {
    const objetivo = String(real || "").toLowerCase().trim();
    if (!objetivo) return;
    setBuscandoPar(true);
    setParecidos(null);
    const vts = await traerNombresVentas();
    const { rows: als } = await traerTodo(sb, "cliente_alias", "texto");
    const yaResueltos = new Set(als.map(a => a.texto));

    const cuenta = {};
    vts.forEach(v => {
      const n = String(v.cliente || "").trim();
      if (!n) return;
      const k = n.toLowerCase();
      if (k === objetivo || yaResueltos.has(k)) return;
      cuenta[n] = (cuenta[n] || 0) + 1;
    });
    // Tambien los que estan como cliente pero todavia no tienen ventas
    lista.forEach(cl => {
      const n = String(cl.nombre_real || cl.nombre || "").trim();
      if (!n) return;
      const k = n.toLowerCase();
      if (k === objetivo || yaResueltos.has(k) || cuenta[n] !== undefined) return;
      cuenta[n] = 0;
    });

    const todas = Object.keys(cuenta)
      .map(n => ({ nombre: n, ventas: cuenta[n], s: parecidoNombre(objetivo, n) }))
      .sort((a, b) => b.s - a.s);

    setParecidos({ lista: todas.filter(x => x.s >= 0.4).slice(0, 20), todas, total: vts.length });
    setBuscandoPar(false);
  };

  // "Es el mismo": guarda el alias, reescribe las ventas con el nombre real y borra el duplicado
  // Antes esto mostraba "✓ unificado" pasara lo que pasara. Si fallaba la reescritura
  // de las ventas, el alias quedaba puesto y las ventas con el nombre viejo, sin aviso.
  const vincular = async (variante, real, esMismo) => {
    const clave = variante.toLowerCase().trim();
    const realKey = real.toLowerCase().trim();
    const { error: eAlias } = await sb.from("cliente_alias").upsert(
      [{ texto: clave, nombre_real: realKey, es_mismo: esMismo }], { onConflict: "texto" });
    if (eAlias) { setMsg({ tipo: "error", txt: "No se pudo guardar: " + eAlias.message }); return; }
    if (esMismo) {
      const { error: eVtas } = await sb.from("ventas").update({ cliente: real }).eq("cliente", variante);
      if (eVtas) {
        setMsg({ tipo: "error", txt: `Se guardó el alias pero NO se renombraron las ventas de "${variante}": ${eVtas.message}` });
        return;
      }
      const { error: eDel } = await sb.from("clientes").delete().eq("nombre", clave);
      if (eDel) setMsg({ tipo: "error", txt: `Ventas renombradas, pero quedó el cliente duplicado "${variante}": ${eDel.message}` });
    }
    setVinculados(v => ({ ...v, [variante]: esMismo ? "mismo" : "distinto" }));
  };

  const editar = (cl) => {
    setNuevo(true);
    setEditId(cl.id);
    setNombreReal(cl.nombre_real || cl.nombre || "");
    setPegado(cl.texto_original || "");
  };

  const q = busca.toLowerCase().trim();
  const filtrados = !q ? lista : lista.filter(cl =>
    [cl.nombre_real, cl.nombre, cl.texto_original]
      .some(v => String(v || "").toLowerCase().includes(q)));

  const conFicha = lista.filter(cl => cl.texto_original).length;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

      {msg && (
        <div style={{ background: msg.tipo === "ok" ? "#E6F7EF" : "#FFE8E4", borderRadius: 8, padding: "8px 12px" }}>
          <p style={{ fontSize: 12, margin: 0, color: msg.tipo === "ok" ? "#0B7A55" : "#B3261E", fontWeight: 600 }}>
            {msg.tipo === "ok" ? "✓ " : "✕ "}{msg.txt}
          </p>
        </div>
      )}

      {/* Alta / edicion */}
      {!nuevo ? (
        <button className="btn btn-primary btn-sm" onClick={() => setNuevo(true)} style={{ alignSelf: "flex-start" }}>
          + Cargar cliente
        </button>
      ) : (
        <div className="card">
          <p style={{ fontSize: 11, color: "#6B4A3E", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 10 }}>
            {editId ? "Editar cliente" : "Cliente nuevo"}
          </p>

          <label style={{ fontSize: 12, color: "#5A3828", display: "block", marginBottom: 4 }}>
            Nombre real del cliente
          </label>
          <input className="input" value={nombreReal} onChange={e => setNombreReal(e.target.value)}
            placeholder="Ej: Marcela Carnevale" autoFocus
            style={{ width: "100%", marginBottom: 12, fontSize: 14 }} />

          <label style={{ fontSize: 12, color: "#5A3828", display: "block", marginBottom: 4 }}>
            Pegá acá el mensaje de WhatsApp
          </label>
          <textarea className="input" value={pegado} onChange={e => setPegado(e.target.value)} rows={7}
            placeholder={"Majagua a4076\nBarrio lagos del Leyes.\nArroyo Leyes 3001\nProv.Santa Fe\nDNI 23860821\nTransporte Pedrito\nCelular +54 9 3425 34-2616"}
            style={{ width: "100%", resize: "vertical", fontSize: 13, marginBottom: 12, fontFamily: "inherit" }} />

          {/* Nombres parecidos que ya estan en las ventas */}
          {nombreReal.trim().length >= 3 && (
            <div style={{ marginBottom: 12 }}>
              <button onClick={() => buscarParecidos(nombreReal)} disabled={buscandoPar}
                style={{ background: "#FFF8F5", border: "1px solid #D4A090", borderRadius: 7,
                         padding: "6px 12px", fontSize: 12, cursor: "pointer", fontFamily: "inherit", color: "#5A3828" }}>
                {buscandoPar ? "Buscando..." : "Buscar nombres parecidos en el historial"}
              </button>

              {parecidos && (() => {
                const q = normTexto(filtroPar);
                const visibles = q
                  ? parecidos.todas.filter(x => normTexto(x.nombre).includes(q)).slice(0, 25)
                  : parecidos.lista;
                return (
                  <div style={{ marginTop: 8, background: "#FFF8F5", borderRadius: 8, padding: 10 }}>
                    <p style={{ fontSize: 11, color: "#7A5848", marginBottom: 6 }}>
                      Revisé {parecidos.total} ventas · {parecidos.lista.length} parecidos
                    </p>
                    <input className="input" value={filtroPar} onChange={e => setFiltroPar(e.target.value)}
                      placeholder="¿Falta alguno? Buscalo acá por cualquier parte del nombre"
                      style={{ width: "100%", fontSize: 12, marginBottom: 8 }} />

                    {visibles.length === 0 && (
                      <p style={{ fontSize: 11, color: "#7A5848", margin: 0 }}>
                        {q ? "Ningún nombre contiene eso" : "No encontré nombres parecidos"}
                      </p>
                    )}

                    {visibles.map((p, i) => {
                      const estado = vinculados[p.nombre];
                      return (
                        <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap",
                                              padding: "5px 0", borderBottom: "1px solid #F0E0D8" }}>
                          <div style={{ flex: 1, minWidth: 140 }}>
                            <span style={{ fontSize: 12, fontWeight: 600,
                                           textDecoration: estado === "distinto" ? "line-through" : "none",
                                           color: estado === "distinto" ? "#B8A49C" : "#2C1A14" }}>
                              {p.nombre}
                            </span>
                            <span style={{ fontSize: 10, color: "#9A7570" }}>
                              {" "}· {p.ventas} venta{p.ventas !== 1 ? "s" : ""} · {Math.round(p.s * 100)}%
                            </span>
                          </div>
                          {estado === "mismo" ? (
                            <span style={{ fontSize: 11, color: "#10B981", fontWeight: 600 }}>✓ unificado</span>
                          ) : estado === "distinto" ? (
                            <span style={{ fontSize: 11, color: "#9A7570" }}>es otro</span>
                          ) : (
                            <div style={{ display: "flex", gap: 4 }}>
                              <button onClick={() => vincular(p.nombre, nombreReal, true)}
                                style={{ background: "#10B981", color: "#fff", border: "none", borderRadius: 6,
                                         padding: "4px 9px", fontSize: 10, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>
                                Es el mismo
                              </button>
                              <button onClick={() => vincular(p.nombre, nombreReal, false)}
                                style={{ background: "#FFF8F5", color: "#5A3828", border: "1px solid #D4A090", borderRadius: 6,
                                         padding: "4px 9px", fontSize: 10, cursor: "pointer", fontFamily: "inherit" }}>
                                Es otro
                              </button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                    <p style={{ fontSize: 10, color: "#9A7570", margin: "8px 0 0 0" }}>
                      "Es el mismo" reescribe esas ventas con el nombre real y lo recuerda para las próximas lecturas.
                    </p>
                  </div>
                );
              })()}
            </div>
          )}

          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn btn-primary btn-sm" onClick={guardar} disabled={guardando} style={{ flex: 1 }}>
              {guardando ? "Guardando..." : "Guardar cliente"}
            </button>
            <button onClick={limpiarForm}
              style={{ background: "#FFF8F5", border: "1px solid #C4A090", borderRadius: 8, color: "#5A3828",
                       padding: "6px 14px", cursor: "pointer", fontSize: 12, fontFamily: "inherit" }}>Cancelar</button>
          </div>
        </div>
      )}

      {/* Buscador */}
      <div className="card">
        <input className="input" value={busca} onChange={e => setBusca(e.target.value)}
          placeholder="Buscar por nombre, localidad, transporte o teléfono..."
          style={{ width: "100%", fontSize: 14 }} />
        <p style={{ fontSize: 11, color: "#7A5848", marginTop: 8, marginBottom: 0 }}>
          {cargando ? "Cargando..." : `${lista.length} clientes · ${conFicha} con ficha cargada`}
          {q && ` · ${filtrados.length} coinciden`}
        </p>
      </div>

      {/* Listado */}
      <div className="card" style={{ padding: 0 }}>
        {filtrados.length === 0 && !cargando && (
          <p style={{ fontSize: 12, color: "#7A5848", padding: 16, margin: 0 }}>
            {q ? "Sin resultados" : "Todavía no hay clientes cargados"}
          </p>
        )}
        {filtrados.map(cl => {
          const vend = vendedoras.find(v => v.id === cl.vendedora_id);
          const tieneFicha = !!cl.texto_original;
          return (
            <div key={cl.id || cl.nombre} style={{ padding: "10px 14px", borderBottom: "1px solid #F0E0D8" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={{ fontSize: 14, fontWeight: 600, margin: 0 }}>
                    {cl.nombre_real || cl.nombre}
                    {!tieneFicha && <span style={{ fontSize: 10, color: "#C9A090", fontWeight: 500 }}> · sin ficha</span>}
                  </p>
                  {cl.texto_original && (
                    <pre style={{ fontSize: 12, color: "#5A3828", margin: "4px 0 0 0", whiteSpace: "pre-wrap",
                                  fontFamily: "inherit", lineHeight: 1.45 }}>{cl.texto_original}</pre>
                  )}
                  {vend && <p style={{ fontSize: 10, color: vend.color, margin: "2px 0 0 0" }}>{vend.nombre}</p>}
                </div>
                <button onClick={() => editar(cl)}
                  style={{ background: "#FFF8F5", border: "1px solid #D4A090", borderRadius: 6, color: "#5A3828",
                           padding: "4px 10px", cursor: "pointer", fontSize: 11, fontFamily: "inherit", flexShrink: 0 }}>
                  {tieneFicha ? "Editar" : "Cargar"}
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── RESUMEN MES A MES ───────────────────────────────────────────────────────
function Resumen({ ventas, vendedoras, fmtPeso, MESES, getMonthKey }) {
  const anioHoy = new Date().getFullYear();
  const mesHoy = new Date().getMonth();
  const [anio, setAnio] = useState(anioHoy);
  const [verPct, setVerPct] = useState(true);

  const fmtCorto = (n) => {
    const v = Number(n || 0);
    if (!v) return "";
    if (Math.abs(v) >= 1000000) return (v / 1000000).toFixed(1).replace(".", ",") + "M";
    if (Math.abs(v) >= 1000) return Math.round(v / 1000) + "k";
    return String(Math.round(v));
  };

  // Ventas y comision acumuladas por mes-clave
  const porMes = (() => {
    const m = {};
    ventas.forEach(v => {
      const k = getMonthKey(v.fecha);
      if (!k) return;
      const vend = vendedoras.find(x => x.id === (v.vendedora_id || v.vendedoraId));
      const monto = Number(v.total || 0);
      if (!m[k]) m[k] = { total: 0, comision: 0, ops: 0, ganancia: 0, costo: 0, conCosto: 0 };
      m[k].total += monto;
      m[k].ops += 1;
      m[k].comision += vend ? monto * vend.comision / 100 : 0;
      // La ganancia necesita el costo guardado por venta (columna `costo_total` en ventas).
      // Mientras no exista, queda en 0 y la fila se muestra vacia.
      const costo = Number(v.costo_total || 0);
      if (costo > 0) {
        m[k].costo += costo;
        m[k].conCosto += 1;
        m[k].ganancia += monto - costo;
      }
    });
    return m;
  })();

  const dm = (a, i) => porMes[`${a}-${String(i + 1).padStart(2, "0")}`] || { total: 0, comision: 0, ops: 0, ganancia: 0, costo: 0, conCosto: 0 };
  const sumaAnio = (a, campo) => MESES.reduce((s, _, i) => s + dm(a, i)[campo], 0);
  const pct = (a, b) => (!b ? null : Math.round(((a - b) / b) * 100));

  const anioAnt = anio - 1;
  const totVA = sumaAnio(anio, "total"), totVB = sumaAnio(anioAnt, "total");
  const totCA = sumaAnio(anio, "comision"), totCB = sumaAnio(anioAnt, "comision");
  const totOpsA = sumaAnio(anio, "ops"), totOpsB = sumaAnio(anioAnt, "ops");
  const totGA = sumaAnio(anio, "ganancia"), totGB = sumaAnio(anioAnt, "ganancia");
  const ventasConCosto = MESES.reduce((s, _, i) => s + dm(anio, i).conCosto + dm(anioAnt, i).conCosto, 0);

  // El % interanual comparaba un anio incompleto contra uno completo: en marzo daba
  // -70% y no significaba nada. Ahora del anio anterior se toman solo los mismos meses
  // que ya transcurrieron de este.
  const corte = anio === anioHoy ? mesHoy : 11;
  const sumaHasta = (a, campo) => MESES.reduce((s, _, i) => i <= corte ? s + dm(a, i)[campo] : s, 0);
  const totVBcomp = sumaHasta(anioAnt, "total");
  const parcial = corte < 11;
  const rango = parcial ? `ene–${MESES[corte].toLowerCase()}` : "";
  const pctV = pct(totVA, totVBcomp);

  const esFuturo = (a, i) => a === anioHoy && i > mesHoy;

  const celda = (val, esFut, extra = {}) => (
    <td style={{ padding: "8px 4px", textAlign: "center", whiteSpace: "nowrap",
                 borderLeft: "1px solid #F4E6DE",
                 background: esFut ? "#FAF3EF" : "transparent", ...extra }}>
      {esFut ? <span style={{ fontSize: 11, color: "#D8C4BA" }}>·</span>
             : <span style={{ fontSize: 14, fontWeight: 600, color: val ? (extra.color || "#2C1A14") : "#D8C4BA" }}>
                 {val ? fmtCorto(val) : "—"}
               </span>}
    </td>
  );

  const tdLabel = { padding: "8px 12px", textAlign: "left", whiteSpace: "nowrap",
                    position: "sticky", left: 0, zIndex: 1 };
  const tdTotal = { padding: "8px 10px", textAlign: "center", whiteSpace: "nowrap",
                    borderLeft: "2px solid #E8C4B0", fontSize: 14, fontWeight: 700 };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

      {/* Barra de totales + controles */}
      <div className="card" style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 20, padding: "12px 16px" }}>
        <div>
          <span style={{ fontSize: 10, color: "#7A5848", textTransform: "uppercase", letterSpacing: "0.06em" }}>Ventas {anio} </span>
          <span style={{ fontSize: 18, fontWeight: 700, color: "#2C1A14" }}>{fmtPeso(totVA)}</span>
          {pctV !== null && (
            <span style={{ fontSize: 12, fontWeight: 600, marginLeft: 6, color: pctV >= 0 ? "#10B981" : "#F87171" }}>
              {pctV > 0 ? "+" : ""}{pctV}% vs {anioAnt}
              {parcial && <span style={{ color: "#7A5848", fontWeight: 500 }}> ({rango}, {fmtPeso(totVBcomp)})</span>}
            </span>
          )}
        </div>
        <div>
          <span style={{ fontSize: 10, color: "#7A5848", textTransform: "uppercase", letterSpacing: "0.06em" }}>Comisiones </span>
          <span style={{ fontSize: 18, fontWeight: 700, color: "#A85D43" }}>{fmtPeso(totCA)}</span>
        </div>
        <div>
          <span style={{ fontSize: 10, color: "#7A5848", textTransform: "uppercase", letterSpacing: "0.06em" }}>Ganancia </span>
          <span style={{ fontSize: 18, fontWeight: 700, color: totGA ? "#10B981" : "#C9B3A8" }}>
            {totGA ? fmtPeso(totGA) : "sin datos"}
          </span>
        </div>

        <div style={{ display: "flex", gap: 6, marginLeft: "auto", alignItems: "center", flexWrap: "wrap" }}>
          <button onClick={() => setAnio(a => a - 1)}
            style={{ background: "#FFF8F5", border: "1px solid #D4A090", borderRadius: 7, padding: "5px 10px",
                     fontSize: 13, cursor: "pointer", fontFamily: "inherit", fontWeight: 700 }}>‹</button>
          <span style={{ fontSize: 13, fontWeight: 700, color: "#5A3828", minWidth: 74, textAlign: "center" }}>
            {anio} vs {anioAnt}
          </span>
          <button onClick={() => setAnio(a => Math.min(anioHoy, a + 1))} disabled={anio >= anioHoy}
            style={{ background: anio >= anioHoy ? "#F4E6DE" : "#FFF8F5", border: "1px solid #D4A090",
                     borderRadius: 7, padding: "5px 10px", fontSize: 13,
                     cursor: anio >= anioHoy ? "default" : "pointer", fontFamily: "inherit", fontWeight: 700,
                     color: anio >= anioHoy ? "#C9B3A8" : "#5A3828" }}>›</button>
          <button onClick={() => setVerPct(v => !v)}
            style={{ background: verPct ? "#A85D43" : "#FFF8F5", color: verPct ? "#fff" : "#5A3828",
                     border: "1px solid #D4A090", borderRadius: 7, padding: "5px 11px", fontSize: 11,
                     cursor: "pointer", fontFamily: "inherit" }}>
            {verPct ? "✓ " : ""}variación
          </button>
        </div>
      </div>

      {/* Tabla: meses en columnas, años en filas */}
      <div className="card" style={{ padding: 0, overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 820 }}>
          <thead>
            <tr style={{ borderBottom: "2px solid #E8C4B0" }}>
              <th style={{ ...tdLabel, background: "#FFFDFB" }}></th>
              {MESES.map((m, i) => (
                <th key={i} style={{ padding: "8px 4px", textAlign: "center", borderLeft: "1px solid #F4E6DE",
                                     fontSize: 11, fontWeight: 700,
                                     color: (anio === anioHoy && i === mesHoy) ? "#A85D43" : "#5A3828",
                                     background: (anio === anioHoy && i === mesHoy) ? "#FFE4D6" : "transparent" }}>
                  {m}
                </th>
              ))}
              <th style={{ ...tdTotal, fontSize: 10, color: "#7A5848", textTransform: "uppercase",
                           letterSpacing: "0.06em", fontWeight: 600 }}>Total</th>
            </tr>
          </thead>
          <tbody>
            {/* Ventas: los dos años juntos */}
            <tr style={{ background: "#FFF8F5" }}>
              <td style={{ ...tdLabel, background: "#FFF8F5", fontSize: 13, fontWeight: 700, color: "#2C1A14" }}>
                Ventas <span style={{ color: "#9A7570", fontWeight: 500 }}>{anio}</span>
              </td>
              {MESES.map((_, i) => celda(dm(anio, i).total, esFuturo(anio, i)))}
              <td style={tdTotal}>{fmtCorto(totVA) || "—"}</td>
            </tr>
            <tr style={{ borderBottom: "2px solid #E8C4B0" }}>
              <td style={{ ...tdLabel, background: "#FFFDFB", fontSize: 13, fontWeight: 600, color: "#7A5848" }}>
                Ventas <span style={{ color: "#9A7570", fontWeight: 500 }}>{anioAnt}</span>
              </td>
              {MESES.map((_, i) => celda(dm(anioAnt, i).total, false, { color: "#7A5848" }))}
              <td style={{ ...tdTotal, color: "#7A5848" }}>{fmtCorto(totVB) || "—"}</td>
            </tr>

            {/* Comisión: los dos años juntos */}
            <tr style={{ background: "#FFF8F5" }}>
              <td style={{ ...tdLabel, background: "#FFF8F5", fontSize: 13, fontWeight: 700, color: "#A85D43" }}>
                Comisión <span style={{ color: "#9A7570", fontWeight: 500 }}>{anio}</span>
              </td>
              {MESES.map((_, i) => celda(dm(anio, i).comision, esFuturo(anio, i), { color: "#A85D43" }))}
              <td style={{ ...tdTotal, color: "#A85D43" }}>{fmtCorto(totCA) || "—"}</td>
            </tr>
            <tr style={{ borderBottom: "2px solid #E8C4B0" }}>
              <td style={{ ...tdLabel, background: "#FFFDFB", fontSize: 13, fontWeight: 600, color: "#B89080" }}>
                Comisión <span style={{ color: "#9A7570", fontWeight: 500 }}>{anioAnt}</span>
              </td>
              {MESES.map((_, i) => celda(dm(anioAnt, i).comision, false, { color: "#B89080" }))}
              <td style={{ ...tdTotal, color: "#B89080" }}>{fmtCorto(totCB) || "—"}</td>
            </tr>

            {/* Ganancia: los dos años juntos — sin datos hasta que se guarde el costo por venta */}
            <tr style={{ background: "#FFF8F5" }}>
              <td style={{ ...tdLabel, background: "#FFF8F5", fontSize: 13, fontWeight: 700, color: "#10B981" }}>
                Ganancia <span style={{ color: "#9A7570", fontWeight: 500 }}>{anio}</span>
              </td>
              {MESES.map((_, i) => celda(dm(anio, i).ganancia, esFuturo(anio, i), { color: "#10B981" }))}
              <td style={{ ...tdTotal, color: "#10B981" }}>{fmtCorto(totGA) || "—"}</td>
            </tr>
            <tr style={{ borderBottom: "2px solid #E8C4B0" }}>
              <td style={{ ...tdLabel, background: "#FFFDFB", fontSize: 13, fontWeight: 600, color: "#7FBFA0" }}>
                Ganancia <span style={{ color: "#9A7570", fontWeight: 500 }}>{anioAnt}</span>
              </td>
              {MESES.map((_, i) => celda(dm(anioAnt, i).ganancia, false, { color: "#7FBFA0" }))}
              <td style={{ ...tdTotal, color: "#7FBFA0" }}>{fmtCorto(totGB) || "—"}</td>
            </tr>

            {/* Variación */}
            {verPct && (
              <tr style={{ background: "#FFFDFB" }}>
                <td style={{ ...tdLabel, background: "#FFFDFB", fontSize: 11, color: "#7A5848" }}>
                  Variación ventas
                </td>
                {MESES.map((_, i) => {
                  const a = dm(anio, i).total, b = dm(anioAnt, i).total;
                  const p = pct(a, b);
                  const fut = esFuturo(anio, i);
                  return (
                    <td key={i} style={{ padding: "6px 4px", textAlign: "center", borderLeft: "1px solid #F4E6DE",
                                         background: fut ? "#FAF3EF" : "transparent" }}>
                      {fut || p === null || !a
                        ? <span style={{ fontSize: 10, color: "#D8C4BA" }}>·</span>
                        : <span style={{ fontSize: 11, fontWeight: 700,
                                         color: p > 0 ? "#10B981" : p < 0 ? "#F87171" : "#9A7570" }}>
                            {p > 0 ? "+" : ""}{p}%
                          </span>}
                    </td>
                  );
                })}
                <td style={{ padding: "6px 10px", textAlign: "center", borderLeft: "2px solid #E8C4B0" }}>
                  {pctV === null ? <span style={{ fontSize: 10, color: "#D8C4BA" }}>·</span>
                    : <span style={{ fontSize: 12, fontWeight: 700, color: pctV > 0 ? "#10B981" : "#F87171" }}>
                        {pctV > 0 ? "+" : ""}{pctV}%
                      </span>}
                </td>
              </tr>
            )}

            {/* Operaciones */}
            <tr style={{ borderTop: "1px solid #F0E0D8" }}>
              <td style={{ ...tdLabel, background: "#FFFDFB", fontSize: 11, color: "#9A7570" }}>
                Operaciones {anio} <span style={{ color: "#C9B3A8" }}>/ {anioAnt}</span>
              </td>
              {MESES.map((_, i) => (
                <td key={i} style={{ padding: "6px 4px", textAlign: "center", borderLeft: "1px solid #F4E6DE",
                                     fontSize: 10, color: "#9A7570",
                                     background: esFuturo(anio, i) ? "#FAF3EF" : "transparent" }}>
                  {esFuturo(anio, i) ? "·" : `${dm(anio, i).ops || 0} / ${dm(anioAnt, i).ops || 0}`}
                </td>
              ))}
              <td style={{ padding: "6px 10px", textAlign: "center", borderLeft: "2px solid #E8C4B0",
                           fontSize: 10, color: "#9A7570" }}>{totOpsA} / {totOpsB}</td>
            </tr>
          </tbody>
        </table>
      </div>

      {ventasConCosto === 0 && (
        <div style={{ background: "#FFF4E6", border: "1px solid #E8C4B0", borderRadius: 8, padding: "10px 14px" }}>
          <p style={{ fontSize: 12, color: "#8A5A2B", margin: 0, fontWeight: 600 }}>
            La fila de Ganancia está vacía porque todavía no se guarda el costo de cada venta
          </p>
          <p style={{ fontSize: 11, color: "#7A5848", margin: "4px 0 0 0" }}>
            El matching de artículos ya calcula el costo en la pantalla de revisión, pero no queda grabado.
            Cuando se guarde, la ganancia se llena sola de ahí en adelante.
          </p>
        </div>
      )}

      <p style={{ fontSize: 10, color: "#7A5848", textAlign: "center", margin: 0 }}>
        Montos en miles (k) y millones (M) · los meses que todavía no llegaron quedan vacíos
        {parcial && ` · la columna Total de ${anioAnt} es el año completo; el % de arriba compara solo ${rango} contra ${rango}`}
      </p>
    </div>
  );
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function Dashboard({ ventas, vendedoras, pagos, currentMes, getComisionMes, getPagadoMes, fmtPeso, MESES, getMonthKey }) {
  const mesActual = ventas.filter(v => getMonthKey(v.fecha) === currentMes);
  const totalMes = mesActual.reduce((s, v) => s + Number(v.total || 0), 0);

  const [yr, mo] = currentMes.split("-").map(Number);
  const ultimos6 = Array.from({ length: 6 }, (_, i) => {
    let m = mo - i; let y = yr;
    if (m < 1) { m += 12; y -= 1; }
    const key = `${y}-${String(m).padStart(2, "0")}`;
    const total = ventas.filter(v => getMonthKey(v.fecha) === key).reduce((s, v) => s + Number(v.total || 0), 0);
    return { label: MESES[m - 1], total, key };
  }).reverse();

  const maxTotal = Math.max(...ultimos6.map(m => m.total), 1);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div className="grid3">
        <StatCard label="Ventas este mes" value={fmtPeso(totalMes)} accent="#A85D43" sub={`${mesActual.length} operaciones`} />
        <StatCard label="Cantidad ventas" value={mesActual.length} accent="#10B981" sub="mes actual" />
        <StatCard label="Ticket promedio" value={fmtPeso(mesActual.length ? totalMes / mesActual.length : 0)} accent="#6366F1" sub="mes actual" />
      </div>

      <div className="card">
        <p style={{ fontSize: 11, color: "#6B4A3E", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 20 }}>Evolución últimos 6 meses</p>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 12, height: 100 }}>
          {ultimos6.map((m, i) => (
            <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
              <span style={{ fontSize: 10, color: "#7A5848" }}>{fmtPeso(m.total).slice(0, 9)}</span>
              <div style={{ width: "100%", height: `${Math.max((m.total / maxTotal) * 80, 4)}px`, background: m.key === currentMes ? "#A85D43" : "#D4A090", borderRadius: 4, transition: "height 0.5s ease" }} />
              <span style={{ fontSize: 11, color: m.key === currentMes ? "#A85D43" : "#6B4A3E", fontWeight: m.key === currentMes ? 700 : 400 }}>{m.label}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <p style={{ fontSize: 11, color: "#6B4A3E", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 16 }}>Vendedoras — mes actual</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {vendedoras.map(v => {
            const tventa = mesActual.filter(vt => (vt.vendedora_id || vt.vendedoraId) === v.id).reduce((s, vt) => s + Number(vt.total || 0), 0);
            // Sin el `tventa > 0 ?` que habia antes: un pago hecho en un mes sin ventas
            // quedaba invisible y la vendedora figuraba "al dia" cuando no lo estaba.
            const comision = getComisionMes(v.id, currentMes);
            const pagado = getPagadoMes(v.id, currentMes);
            const deuda = comision - pagado;
            // Arrastre de meses anteriores, con el mismo criterio: comision del mes
            // menos lo pagado imputado a ese mes. Antes el Dashboard solo miraba el mes
            // actual y una deuda vieja no se veia en ningun lado.
            const mesesPrevios = [...new Set([
              ...ventas.map(vt => getMonthKey(vt.fecha)),
              ...pagos.map(p => p.mes),
            ])].filter(mk => mk && mk < currentMes);
            const arrastre = mesesPrevios.reduce(
              (s, mk) => s + (getComisionMes(v.id, mk) - getPagadoMes(v.id, mk)), 0);
            return (
              <div key={v.id} style={{ display: "flex", alignItems: "center", gap: 16, padding: "12px 0", borderBottom: "1px solid #1E1E2E" }}>
                <div style={{ width: 36, height: 36, borderRadius: "50%", background: v.color + "22", border: `2px solid ${v.color}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: v.color }}>{v.nombre[0]}</span>
                </div>
                <div style={{ flex: 1 }}>
                  <p style={{ fontWeight: 600, fontSize: 14 }}>{v.nombre} <span style={{ fontSize: 11, color: "#6B4A3E" }}>({v.comision}%)</span></p>
                  <p style={{ fontSize: 12, color: "#5A3828", marginTop: 2 }}>{fmtPeso(tventa)} en ventas</p>
                </div>
                <div style={{ textAlign: "right" }}>
                  <p style={{ fontSize: 13, fontWeight: 700, color: deuda > 0 ? "#F87171" : deuda < 0 ? "#8A5A2B" : "#10B981" }}>{fmtPeso(Math.abs(deuda))}</p>
                  <p style={{ fontSize: 10, color: "#6B4A3E" }}>
                    {deuda > 0 ? "a pagar" : deuda < 0 ? "pagado de más" : "al día"}
                  </p>
                  {Math.abs(arrastre) >= 1 && (
                    <p style={{ fontSize: 10, color: arrastre > 0 ? "#F87171" : "#8A5A2B", fontWeight: 600, marginTop: 2 }}>
                      {arrastre > 0 ? `+ ${fmtPeso(Math.round(arrastre))} de meses anteriores` : `${fmtPeso(Math.round(Math.abs(arrastre)))} de más, de antes`}
                    </p>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function StatCard({ label, value, accent, sub }) {
  return (
    <div className="stat-card" style={{ borderTop: `2px solid ${accent}` }}>
      <p style={{ fontSize: 11, color: "#6B4A3E", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 10 }}>{label}</p>
      <p style={{ fontSize: 26, fontWeight: 700, color: "#2C1A14" }}>{value}</p>
      {sub && <p style={{ fontSize: 12, color: "#7A5848", marginTop: 4 }}>{sub}</p>}
    </div>
  );
}

// ─── NUEVA VENTA ─────────────────────────────────────────────────────────────
const PROMPT_EXTRACCION = `Analizá este presupuesto/comprobante de venta de ropa. Extraé los siguientes datos y respondé SOLO con un JSON válido sin backticks ni texto extra:
{
  "cliente": "nombre del cliente o null",
  "total": número total de la venta como número (sin descuento aplicado si hay uno separado) o null,
  "totalConDescuento": número total de LA MERCADERIA despues del descuento, SIN sumar saldos ni deudas previas, o null,
  "saldoAnterior": si el remito trae un saldo, deuda o cuenta anterior sumada aparte, ese número; si no hay, null,
  "items": [{"codigo": "codigo de articulo si figura, o null", "descripcion": "...", "cantidad": N, "precio": N, "total": N}],
  "descuento": número de descuento aplicado o null,
  "notas": "cualquier nota relevante o null"
}
No leas la fecha del comprobante.
El codigo de articulo suele ser un numero corto (1 a 4 digitos) al lado de la descripcion. Si no lo ves, poné null; NO lo inventes ni lo deduzcas de la descripcion.
IMPORTANTE con los totales: a veces el remito suma un saldo o deuda anterior al final (puede decir "saldo", "deuda", "cta anterior", "resto"). Ese monto NO es parte de la venta: va en saldoAnterior y NO se incluye en total ni en totalConDescuento. Los campos total y totalConDescuento son solo por la mercaderia de este remito.
Si no podés leer algún campo, poné null.`;

const BACKUP_API_KEY = "AIzaSyDaAuhseWd2ktPgwi0w1AzKjHRoQyIIHg8";
let lastKeyUsed = 0; // 0 = primary, 1 = backup

async function extraerDatosFotoBase64(base64, mediaType) {
  const primaryKey = localStorage.getItem("cv_apikey") || window.__geminiPrimaryKey || "";
  const savedExtra = localStorage.getItem("cv_extrakeys") || window.__geminiExtraKeys || "";
  const extraKeys = savedExtra.split("\n").map(k => k.trim()).filter(Boolean);
  const keys = [primaryKey, BACKUP_API_KEY, ...extraKeys].filter(Boolean);
  if (keys.length === 0) throw new Error("Falta la API key de Gemini. Andá a Config y agregala.");
  
  // Rotar key distinta para cada llamada paralela
  lastKeyUsed = (lastKeyUsed + 1) % keys.length;
  const orderedKeys = [...keys.slice(lastKeyUsed), ...keys.slice(0, lastKeyUsed)];
  
  let lastError;
  for (let i = 0; i < orderedKeys.length; i++) {
    const apiKey = orderedKeys[i];
    const isNewFormat = apiKey.startsWith("AQ.");
    const url = isNewFormat
      ? `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`
      : `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
    const headers = { "Content-Type": "application/json" };
    if (isNewFormat) headers["x-goog-api-key"] = apiKey;
    const resp = await fetch(url, {
      method: "POST",
      headers,
      body: JSON.stringify({
        contents: [{ parts: [
          { inline_data: { mime_type: mediaType, data: base64 } },
          { text: PROMPT_EXTRACCION }
        ]}],
        generationConfig: { temperature: 0.1 }
      })
    });
    let data;
    try { data = await resp.json(); } catch(e) { lastError = new Error("HTTP " + resp.status); continue; }
    if (resp.status === 429 || (data.error && data.error.code === 429)) {
      // Se prueba con la siguiente key. El mensaje esta redactado para que sirva
      // tambien si esta era la ultima: antes el error final decia "intentando con
      // otra key...", que suena a esperar cuando en realidad ya no habia mas.
      lastKeyUsed = (lastKeyUsed + 1) % keys.length;
      lastError = new Error(`Sin cuota en las ${keys.length} API key(s) de Gemini. Esperá un rato o agregá otra key en Config.`);
      continue;
    }
    if (!resp.ok || data.error) {
      lastError = new Error("API " + resp.status + ": " + (data.error?.message || JSON.stringify(data).slice(0, 120)));
      continue;
    }
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
    if (!text) { lastError = new Error("Respuesta vacía."); continue; }
    const match = text.match(/\{[\s\S]*\}/);
    if (!match) { lastError = new Error("Sin JSON: " + text.slice(0, 80)); continue; }
    try { return JSON.parse(match[0]); }
    catch(e) { lastError = new Error("JSON inválido"); continue; }
  }
  throw lastError || new Error("No se pudo procesar la imagen");
}

function ItemsDetectados({ extracted, fmtPeso, catalogo, aliases, guardarAlias, totalForm }) {
  const [expanded, setExpanded] = React.useState(false);
  const [guardado, setGuardado] = React.useState({});
  const [errorAlias, setErrorAlias] = React.useState(null);
  const [selConjunto, setSelConjunto] = React.useState({});
  const [modoConjunto, setModoConjunto] = React.useState({});
  const [corrigiendo, setCorrigiendo] = React.useState(null);
  const [busquedaArt, setBusquedaArt] = React.useState("");
  const [busqConj, setBusqConj] = React.useState({});

  // Busca en TODO el catalogo, por codigo o por descripcion
  const buscarEnCatalogo = (txt) => {
    const q = normTexto(txt);
    if (!q) return [];
    const qTokens = tokensDesc(txt);
    return (catalogo || [])
      .map(a => {
        const codMatch = normCodigo(a.codigo).includes(normCodigo(txt)) ? 2 : 0;
        const descMatch = similitudDesc(txt, a.descripcion);
        const contiene = qTokens.length && qTokens.every(t => normTexto(a.descripcion).includes(t)) ? 1 : 0;
        return { a, s: codMatch + contiene + descMatch };
      })
      .filter(x => x.s > 0.2)
      .sort((x, y) => y.s - x.s)
      .slice(0, 15)
      .map(x => x.a);
  };

  const toggleComponente = (idx, codigo) => {
    setSelConjunto(s => {
      const actual = s[idx] || [];
      return { ...s, [idx]: actual.includes(codigo) ? actual.filter(x => x !== codigo) : [...actual, codigo] };
    });
  };

  const guardarConjunto = async (textoLeido, idx) => {
    const codigos = selConjunto[idx] || [];
    if (codigos.length < 2 || !guardarAlias) return;
    const r = await guardarAlias(textoLeido, codigos.join(","));
    if (r.ok) { setGuardado(g => ({ ...g, [idx]: codigos.join(" + ") })); setErrorAlias(null); }
    else setErrorAlias(r.error);
  };

  const elegir = async (textoLeido, codigo, idx) => {
    if (!guardarAlias) return;
    const r = await guardarAlias(textoLeido, codigo);
    if (r.ok) {
      setGuardado(g => ({ ...g, [idx]: codigo }));
      setErrorAlias(null);
    } else {
      setErrorAlias(r.error);
    }
  };
  const items = extracted.items || [];

  const hayCat = catalogo && catalogo.length > 0;
  // useMemo: cada renglon se compara contra TODO el catalogo (526 articulos), asi que
  // un remito de 20 renglones son ~10.000 comparaciones de texto. Sin esto se rehacian
  // en cada renderizado, o sea con cada letra que se escribe en el buscador.
  const conMatch = React.useMemo(() => items.map(it => ({
    it,
    m: hayCat ? matchearArticulo(it.codigo, it.descripcion, catalogo, aliases || {}) : null
  })), [items, catalogo, aliases, hayCat]);
  const visible = expanded ? conMatch : conMatch.slice(0, 3);

  const ESTILO = {
    ok:          { color: "#10B981", txt: "✓" },
    alias:       { color: "#10B981", txt: "✓ alias" },
    solo_codigo: { color: "#10B981", txt: "✓ por código" },
    similar:     { color: "#A85D43", txt: "≈ similar a" },
    revisar:     { color: "#F59E0B", txt: "⚠ chequear este art" },
    ambiguo:     { color: "#F59E0B", txt: "⚠ dos artículos posibles — elegir" },
    conjunto:    { color: "#7C3AED", txt: "⊞ conjunto — elegí los artículos que lo componen" },
    sin_match:   { color: "#B3261E", txt: "✕ sin match" },
  };

  // Los items suman ANTES del descuento, asi que se comparan contra el bruto
  const sumaItems = items.reduce((s, it) => s + Number(it.total || 0), 0);
  const totalBruto = Number(extracted.total ?? 0);
  // Si el usuario corrigio el total a mano, ese manda: es el que se va a guardar
  const totalRemito = Number(totalForm) > 0
    ? Number(totalForm)
    : Number(extracted.totalConDescuento ?? extracted.total ?? 0);
  const saldoAnt = Number(extracted.saldoAnterior || 0);
  const baseCmp = totalBruto > 0 ? totalBruto : totalRemito;
  const descuadre = items.length > 0 && baseCmp > 0 && Math.abs(sumaItems - baseCmp) > Math.max(1, baseCmp * 0.02);
