// Lista tablas via OpenAPI de PostgREST, en ambos schemas
async function listarTablasCostos() {
  const encontradas = [];
  const errores = [];

  for (const schema of ["costos", "public"]) {
    try {
      const headers = { apikey: costosKey, Authorization: `Bearer ${costosKey}` };
      if (schema !== "public") headers["Accept-Profile"] = schema;
      const resp = await fetch(`${costosUrl}/rest/v1/`, { headers });
      const spec = await resp.json();
      const desdeDef = Object.keys(spec.definitions || {});
      const desdePaths = Object.keys(spec.paths || {}).map(k => k.replace(/^\//, ""));
      const nombres = [...new Set([...desdeDef, ...desdePaths])]
        .filter(n => n && n !== "rpc" && !n.startsWith("rpc/"));
      nombres.forEach(n => encontradas.push({ schema, nombre: n, via: "openapi" }));
    } catch (e) {
      errores.push(`${schema}: ${String(e)}`);
    }
  }

  // Fuerza bruta: probar nombres conocidos en ambos schemas
  for (const schema of ["costos", "public"]) {
    const cli = schema === "costos" ? sbCostos : sbCostosPub;
    for (const nombre of CANDIDATAS) {
      const yaEsta = encontradas.some(e => e.schema === schema && e.nombre === nombre);
      if (yaEsta) continue;
      const { error } = await cli.from(nombre).select("*").limit(1);
      if (!error) encontradas.push({ schema, nombre, via: "prueba" });
    }
  }

  return { ok: true, error: errores.join(" | ") || null, tablas: encontradas };
}

// ── MOTOR DE MATCHING DE ARTICULOS ──
const STOP_DESC = new Set(["de","con","sin","y","o","el","la","los","las","un","una","para","en","a","del","al","por"]);

// Solo notacion con barra, que es estandar. NO se expanden abreviaturas de palabras:
// truncar palabras lo resuelve el match por prefijo del motor de candidatos, sin tener que
// adivinar que significa cada abreviatura del rubro (ej: "cord" = corderito, no cordon).
const ABREVS = [
  [/\bc\s*\/\s*/g, "con "],
  [/\bs\s*\/\s*/g, "sin "],
  [/\bm\s*\/\s*l\b/g, "manga larga"],
  [/\bm\s*\/\s*c\b/g, "manga corta"],
];

function normTexto(s) {
  let t = String(s || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  // las abreviaturas se expanden ANTES de sacar la puntuacion (c/ y s/ dependen de la barra)
  ABREVS.forEach(([re, rep]) => { t = t.replace(re, rep); });
  return t
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function tokensDesc(s) {
  return normTexto(s).split(" ").filter(t => t.length > 1 && !STOP_DESC.has(t));
}

// Coeficiente de Dice sobre palabras, con tolerancia a plurales/typos por prefijo

const normCodigo = c => String(c || "").trim().toUpperCase().replace(/\s+/g, "");

// La misma prenda esta escrita con la letra de los dos lados segun la tabla:
// en `articulos` figura como L728 y en `costo_articulo` como 728L. Son el mismo
// articulo. Para compararlos se lleva la letra SIEMPRE al final.
// OJO: la letra NO se saca nunca. 728 (estampada) y 728L (lisa) son prendas
// distintas con costos distintos, y tienen que seguir siendo distintas.
// Verificado sobre las dos tablas: con esta regla no se junta ningun par de
// codigos que hoy sean articulos diferentes.
const canonCodigo = c => {
  const n = normCodigo(c);
  const m = n.match(/^([A-Z]+)(\d+)$/);
  return m ? m[2] + m[1] : n;
};

// Palabras que indican que un renglon del remito son VARIOS articulos del catalogo
const PALABRAS_CONJUNTO = ["conjunto", "juego", "set", "combo"];

// Para un conjunto, los candidatos salen de las palabras distintivas
// (sacando la que indica conjunto): "conjunto darlon" -> todos los darlon
function candidatosConjunto(desc, catalogo, limite = 12) {
  const distintivas = tokensDesc(desc).filter(w => !PALABRAS_CONJUNTO.includes(w));
  if (!distintivas.length) return [];
  return catalogo
    .map(a => {
      const ta = tokensDesc(a.descripcion);
      let hits = 0;
      distintivas.forEach(d => {
        if (ta.some(u => u === d || (d.length >= 3 && u.length >= 3 &&
            u.slice(0, 4) === d.slice(0, 4)))) hits++;
      });
      return { a, hits };
    })
    .filter(x => x.hits > 0)
    .sort((x, y) => y.hits - x.hits || String(x.a.codigo).localeCompare(String(y.a.codigo)))
    .slice(0, limite)
    .map(x => x.a);
}

// Devuelve el mejor match + estado + candidatos alternativos
// ── Motor de candidatos ──
// Devuelve { candidatos: [{art, prob}], via: 'codigo'|'alias'|'descripcion'|null }
// Es el mismo criterio que usa Criterio Local, que resuelve bastante mejor:
//   · el CODIGO va primero (si esta escrito, es el dato mas confiable del remito),
//   · puede devolver VARIOS candidatos con su probabilidad, en vez de elegir uno,
//   · y dice por que matcheo, para que la persona sepa de donde salio.
function buscarCandidatos(codigoLeido, descLeida, catalogo, aliases = {}) {
  if (!catalogo || !catalogo.length) return { candidatos: [], via: null };

  // 1) Codigo exacto. Puede haber mas de uno si el codigo se repite entre temporadas.
  const cod = String(codigoLeido || "").trim();
  if (cod) {
    const canon = canonCodigo(cod);
    const porCodigo = catalogo.filter(a => canonCodigo(a.codigo) === canon);
    if (porCodigo.length > 0) {
      return { candidatos: porCodigo.map(a => ({ art: a, prob: 100 })), via: "codigo" };
    }
  }

  // 2) Alias aprendido de una correccion previa (puede tener varios codigos: conjunto)
  const clave = normTexto(descLeida);
  if (clave && aliases[clave]) {
    const codigos = String(aliases[clave]).split(",").map(s => s.trim()).filter(Boolean);
    const arts = codigos
      .map(c => catalogo.find(a => canonCodigo(a.codigo) === canonCodigo(c)))
      .filter(Boolean);
    if (arts.length === 1) return { candidatos: [{ art: arts[0], prob: 100 }], via: "alias" };
    if (arts.length > 1) {
      // Conjunto: un articulo virtual con la suma de los costos
      const costoSuma = arts.every(a => a.costo_total !== null && a.costo_total !== undefined)
        ? arts.reduce((s, a) => s + Number(a.costo_total), 0) : null;
      const virtual = {
        codigo: arts.map(a => a.codigo).join(" + "),
        descripcion: arts.map(a => a.descripcion).join(" + "),
        costo_total: costoSuma,
        _componentes: arts,
      };
      return { candidatos: [{ art: virtual, prob: 100 }], via: "alias" };
    }
  }

  // 3) Por descripcion, con puntaje por palabras. Las coincidencias parciales (mismo
  // prefijo de 4 letras) valen la mitad, y se penaliza cuando la descripcion del
  // catalogo tiene muchas mas palabras que la del remito: "musculosa" no deberia
  // ganarle a "musculosa lino nacar lisa" solo por ser mas corta.
  const textoNorm = normTexto(descLeida);
  if (textoNorm.length > 2) {
    const palabras = textoNorm.split(" ").filter(p => p.length > 2);
    if (!palabras.length) return { candidatos: [], via: null };
    const puntuados = catalogo.map(a => {
      const dn = normTexto(a.descripcion);
      let hits = 0, parciales = 0;
      palabras.forEach(p => {
        if (dn.includes(p)) hits++;
        else if (p.length >= 4 && dn.split(" ").some(w => w.startsWith(p.slice(0, 4)))) parciales++;
      });
      let score = (hits + parciales * 0.5) / palabras.length;
      const palCat = dn.split(" ").filter(w => w.length > 2).length;
      if (palCat > palabras.length) score *= (palabras.length / palCat) * 0.4 + 0.6;
      return { art: a, prob: Math.round(Math.min(score, 0.99) * 100) };
    }).filter(x => x.prob >= 30).sort((a, b) => b.prob - a.prob);
    if (puntuados.length > 0) return { candidatos: puntuados.slice(0, 8), via: "descripcion" };
  }
  return { candidatos: [], via: null };
}

// Resuelve solo cuando no hay ninguna duda: un unico candidato por codigo o por alias.
// Los de descripcion NUNCA se dan por buenos solos, por mas alto que puntuen.
function resueltoAutomatico(m) {
  return m && m.candidatos.length === 1 && (m.via === "codigo" || m.via === "alias")
    ? m.candidatos[0].art : null;
}

// Adaptador para el banco de pruebas de Config: usa el MISMO motor que la pantalla
// de carga (buscarCandidatos), para que no haya dos criterios distintos conviviendo.
function matchearArticulo(codigoLeido, descLeida, catalogo, aliases = {}) {
  const base = { codigo: null, descripcion: null, costo_total: null, estado: "sin_match", score: 0, candidatos: [] };
  const m = buscarCandidatos(codigoLeido, descLeida, catalogo, aliases);
  const top = m.candidatos.map(c => ({ ...c.art, score: c.prob / 100 }));
  if (!m.candidatos.length) return base;
  const auto = resueltoAutomatico(m);
  if (auto) {
    return { ...base, ...auto, estado: m.via === "alias" ? "alias" : "solo_codigo", score: 1, candidatos: top };
  }
  return { ...base, estado: m.via === "codigo" ? "ambiguo" : "similar",
           score: m.candidatos[0].prob / 100, candidatos: top };
}

// Numero o null, conservando el 0. Number(x) || null pisa el 0 con null.
const numONull = (x) => {
  if (x === null || x === undefined || x === "") return null;
  const n = Number(x);
  return Number.isFinite(n) ? n : null;
};

// Arma el costo de una venta y las filas a guardar en venta_items.
// costoTotal queda en null si algun renglon no se pudo costear, para no inflar la ganancia.
// Ahora recibe los renglones YA RESUELTOS de la pantalla, en vez de volver a
// matchear por su cuenta. Lo que se ve es exactamente lo que se guarda: antes la
// pantalla mostraba un match y el guardado lo recalculaba, y podian no coincidir.
function costearVenta(renglones) {
  const lista = renglones || [];
  if (!lista.length) return { costoTotal: null, completo: false, filas: [], sinCostear: 0 };
  let acum = 0, sinCostear = 0;
  const filas = lista.map(it => {
    const cant = Number(it.cantidad) || 1;
    // `Number(x) || null` convertia un 0 legitimo en null (una bonificacion, por
    // ejemplo). Solo tiene que ser null lo que realmente no vino o no es numero.
    const costoUnit = numONull(it.costo_unitario);
    if (costoUnit === null) sinCostear++;
    else acum += costoUnit * cant;
    return {
      articulo_codigo: it.articulo_codigo || null,
      descripcion_leida: it.descripcion || null,
      cantidad: cant,
      precio_unitario: numONull(it.precio),
      total_item: numONull(it.total),
      costo_unitario: costoUnit,
      estado_match: it.articulo_codigo ? (it.via_match || "resuelto") : "sin_match",
    };
  });
  const completo = sinCostear === 0;
  return { costoTotal: completo ? acum : null, completo, filas, sinCostear };
}

// Arranca los renglones editables a partir de lo que leyo la IA, resolviendo de
// entrada los que no tienen ninguna duda (codigo o alias).
function armarRenglones(extracted, catalogo, aliases) {
  const items = (extracted && extracted.items) || [];
  return items.map(it => {
    const m = buscarCandidatos(it.codigo, it.descripcion, catalogo || [], aliases || {});
    const auto = resueltoAutomatico(m);
    return {
      cantidad: Number(it.cantidad) || 1,
      descripcion: it.descripcion || "",
      codigo: it.codigo || "",
      precio: numONull(it.precio),
      total: numONull(it.total),
      articulo_codigo: auto ? auto.codigo : null,
      articulo_desc: auto ? auto.descripcion : null,
      costo_unitario: auto ? numONull(auto.costo_total) : null,
      via_match: auto ? m.via : null,
      confirmado: false,
    };
  });
}

// Catalogo completo: articulos (codigo + descripcion) cruzado con costo_articulo (costo_total)
async function armarCatalogoCompleto() {
  // Paginado. Antes decia .limit(5000), que no sirve de nada: el servidor devuelve
  // 1000 y listo. Hoy el catalogo tiene ~526 articulos asi que no se notaba, pero el
  // dia que pase de 1000 los articulos de mas dejarian de matchear sin ningun sintoma.
  const { rows: arts, error: e1 } = await traerTodo(sbCostos, "articulos");
  if (e1) return { ok: false, error: "articulos: " + e1, rows: [] };

  const { rows: cst, error: e2 } = await traerTodo(sbCostos, "costo_articulo");
  if (e2) return { ok: false, error: "costo_articulo: " + e2, rows: [] };

  const norm = s => String(s || "").trim().toUpperCase().replace(/\s+/g, "");
  // El costo se busca por codigo canonico (letra al final), porque `articulos` usa
  // L728 y `costo_articulo` usa 728L para la misma prenda. Sin esto, los 42
  // articulos de lino figuraban "sin costo cargado" teniendolo.
  const mapaCosto = {};
  (cst || []).forEach(r => { mapaCosto[canonCodigo(r.codigo)] = r.costo_total; });

  // Detecta el campo de descripcion sin asumir el nombre exacto
  const campoDesc = (a) => a.descripcion ?? a.description ?? a.nombre ?? a.detalle ?? "";

  // Dedup por codigo: gana la fila con descripcion mas larga (ficha mas completa)
  const porCodigo = {};
  (arts || []).forEach(a => {
    const cod = norm(a.codigo);
    if (!cod) return;
    const desc = String(campoDesc(a) || "").trim();
    const prev = porCodigo[cod];
    if (!prev || desc.length > String(prev.descripcion || "").length) {
      porCodigo[cod] = {
        codigo: String(a.codigo).trim(),
        descripcion: desc,
        categoria: a.categoria ?? null,
        temporada_id: a.temporada_id ?? null,
      };
    }
  });

  const rows = Object.values(porCodigo).map(a => ({
    ...a,
    costo_total: mapaCosto[canonCodigo(a.codigo)] ?? null,
  }));

  return {
    ok: true, error: null, rows,
    filasArticulos: (arts || []).length,
    filasCosto: (cst || []).length,
    conDesc: rows.filter(r => r.descripcion).length,
    conCosto: rows.filter(r => r.costo_total !== null).length,
  };
}

// Fuzzy matching para nombres de clientes
const escapeRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function similaridad(a, b) {
  a = a.toLowerCase().trim();
  b = b.toLowerCase().trim();
  if (a === b) return 1;
  const longer = a.length > b.length ? a : b;
  const shorter = a.length > b.length ? b : a;
  // "uno contiene al otro" vale 0.9, pero SOLO si lo contenido es una palabra entera
  // y de 5 letras para arriba. Sin esto "ana" daba 0.9 contra "analia" y "paula"
  // contra "paul", y el cliente nuevo heredaba la vendedora de otro sin que se note.
  // El minimo de 5 saca los nombres cortos, que son los que dan falsos positivos:
  // con 4 alcanzaba para que "rosa" enganchara con "marcela de santa rosa".
  if (shorter.length >= 5 &&
      new RegExp(`(^|\\s)${escapeRe(shorter)}(\\s|$)`).test(longer)) return 0.9;
  let matches = 0;
  for (let i = 0; i < shorter.length; i++) {
    if (longer.includes(shorter[i])) matches++;
  }
  return matches / longer.length;
}

// Parecido pensado para nombres: combina el char-a-char con match por palabras
// (asi "tamara san luis" engancha con "tani san wuis" aunque cambien letras)
function parecidoNombre(a, b) {
  const na = normTexto(a), nb = normTexto(b);
  if (!na || !nb) return 0;
  if (na === nb) return 1;
  const ta = na.split(" ").filter(Boolean), tb = nb.split(" ").filter(Boolean);
  const usados = new Array(tb.length).fill(false);
  let hits = 0;
  ta.forEach(p => {
    let idx = tb.findIndex((q, i) => !usados[i] && q === p);
    if (idx === -1) {
      idx = tb.findIndex((q, i) => {
        if (usados[i]) return false;
        const n = Math.min(3, Math.min(p.length, q.length));
        return n >= 3 && p.slice(0, n) === q.slice(0, n);
      });
      if (idx !== -1) { usados[idx] = true; hits += 0.8; return; }
      idx = tb.findIndex((q, i) => !usados[i] && similaridad(p, q) >= 0.6);
      if (idx !== -1) { usados[idx] = true; hits += 0.6; return; }
    } else { usados[idx] = true; hits += 1; }
  });
  const porPalabra = (2 * hits) / (ta.length + tb.length);
  return Math.max(porPalabra, similaridad(na, nb));
}

function buscarCliente(nombre, clientesObj) {
  if (!nombre) return null;
  const key = nombre.toLowerCase().trim();
  if (clientesObj[key] !== undefined) return clientesObj[key];

  // Todos los que pasan el umbral, no solo el mejor: si dos clientes distintos se
  // parecen y son de vendedoras distintas, el nombre NO alcanza para decidir y no
  // se elige ninguno. Es preferible que la persona la elija a mano antes que
  // asignarle la venta a la vendedora equivocada sin que se note.
  const candidatos = [];
  for (const k of Object.keys(clientesObj)) {
    const score = parecidoNombre(key, k);
    if (score >= 0.85) candidatos.push({ vendedora: clientesObj[k], score });
  }
  if (!candidatos.length) return null;
  // Un candidato sin vendedora (null) cuenta como "no se sabe", asi que tambien
  // frena la asignacion automatica. Es a proposito: preferimos una eleccion manual
  // de mas antes que adivinar.
  const vendedorasDistintas = new Set(candidatos.map(c => c.vendedora));
  if (vendedorasDistintas.size > 1) return null;
  const elegida = candidatos[0].vendedora;
  return elegida === null || elegida === undefined ? null : elegida;
}


// ── Traer una tabla ENTERA ──
// Supabase devuelve como maximo 1000 filas por consulta y no avisa cuando corta.
// Poner .limit(5000) no sirve: el tope lo pone el servidor. Todo lo que pueda pasar
// de 1000 algun dia tiene que pedirse de a paginas o se empieza a cortar en silencio.
const PAGINA = 1000;
async function traerTodo(cliente, tabla, columnas = "*", orden = null) {
  let todo = [], desde = 0;
  while (true) {
    let q = cliente.from(tabla).select(columnas);
    if (orden) orden.forEach(o => { q = q.order(o.col, { ascending: o.asc !== false }); });
    const { data, error } = await q.range(desde, desde + PAGINA - 1);
    if (error) return { rows: todo, error: error.message || JSON.stringify(error) };
    if (!data || data.length === 0) break;
    todo = todo.concat(data);
    if (data.length < PAGINA) break;
    desde += PAGINA;
  }
  return { rows: todo, error: null };
}

// DB helpers
async function dbGetAll(table) {
  // El desempate por id es imprescindible: 1045 de las ventas comparten el mismo
  // created_at (una importacion vieja). Ordenando solo por created_at, el orden entre
  // filas empatadas no esta garantizado y al pedir la pagina 2 puede repetirse o
  // saltearse una fila.
  const { rows, error } = await traerTodo(sb, table, "*", [
    { col: "created_at", asc: false },
    { col: "id", asc: false },
  ]);
  if (error) console.error(table, error);
  const data = rows;
  console.log(table, "total cargados:", data.length);
  // Normalize fecha to string to avoid timezone issues
  if (data && (table === "ventas" || table === "pagos")) {
    data.forEach(row => {
      if (row.fecha) {
        // If Date object, convert to YYYY-MM-DD string
        if (row.fecha instanceof Date) {
          row.fecha = hoyLocal(row.fecha);
        } else {
          row.fecha = String(row.fecha).substring(0, 10);
        }
      }
    });
  }
  return data || [];
}
// Devuelve { row, error }. El error NO se puede tragar: quien llama tiene que
// mostrarlo, porque si no la venta se pierde y la pantalla dice que se guardo.
async function dbInsert(table, row) {
  const { data, error } = await sb.from(table).insert([row]).select();
  if (error) {
    console.error("insert", table, error);
    return { row: null, error: error.message || JSON.stringify(error) };
  }
  const guardada = data?.[0] || null;
  if (!guardada) return { row: null, error: "Supabase no devolvio la fila guardada" };
  return { row: guardada, error: null };
}
async function dbDelete(table, id) {
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error) { console.error("delete", table, error); return { ok: false, error: error.message || JSON.stringify(error) }; }
  return { ok: true, error: null };
}
async function dbUpdate(table, id, updates) {
  const { error } = await sb.from(table).update(updates).eq("id", id);
  if (error) { console.error("update", table, error); return { ok: false, error: error.message || JSON.stringify(error) }; }
  return { ok: true, error: null };
}

const { useState, useEffect, useRef } = React;

const INITIAL_VENDEDORAS = [
  { id: 1, nombre: "Luli", comision: 3, color: "#A85D43" },
  { id: 2, nombre: "Meli", comision: 5, color: "#10B981" },
  { id: 3, nombre: "Otra", comision: 4, color: "#6366F1" },
];

const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function fmtPeso(n) {
  return "$" + Number(n || 0).toLocaleString("es-AR", { minimumFractionDigits: 0 });
}

function getMonthKey(date) {
  if (!date) return "";
  // Handle Date objects from Supabase
  if (date instanceof Date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
  }
  // Handle ISO string "2023-03-15" or "2023-03-15T..."
  const str = String(date);
  if (str.match(/^\d{4}-\d{2}/)) {
    return str.substring(0, 7); // "2023-03"
  }
  // Fallback: slice string directly to avoid timezone issues
  return String(date).substring(0, 7);
}

// Fecha de HOY en horario local. NO usar toISOString(): devuelve UTC, y despues de
// las 21hs de Argentina ya es el dia siguiente, con lo cual las ventas cargadas de
// noche a fin de mes caian en el mes equivocado.
function hoyLocal(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Leyenda fija arriba de todo con la fecha del último backup local (ver
// Documents/criterio-ventas-backups). El script de backup inserta una fila en
// backups_log cada vez que corre; acá solo se lee la última.
// Si la tabla todavía no existe, no se muestra nada: no es un error del usuario,
// es que falta correr el SQL que la crea.
function UltimoBackup() {
  const [ultimo, setUltimo] = useState(null); // null = todavía no se sabe / no hay tabla

  useEffect(() => {
    sb.from("backups_log")
      .select("created_at, ok")
      .order("created_at", { ascending: false })
      .limit(1)
      .then(({ data, error }) => {
        if (!error && data && data[0]) setUltimo(data[0]);
      });
  }, []);

  if (!ultimo) return null;

  const fecha = new Date(ultimo.created_at);
  const fechaTexto = fecha.toLocaleDateString("es-AR") + " " +
    fecha.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  // Lunes a viernes corre a las 13:55: un salto de más de 4 días (cubre un fin de
  // semana largo) sin ningún backup nuevo es la señal de que algo dejó de correr,
  // no solo que hoy es sábado.
  const diasSinCorrer = (Date.now() - fecha.getTime()) / 86400000;
  const estado = !ultimo.ok ? "error" : diasSinCorrer > 4 ? "atrasado" : "ok";

  const estilos = {
    ok:        { bg: "#E6F7EF", color: "#0B7A55", texto: `🗄️ Último backup: ${fechaTexto}` },
    atrasado:  { bg: "#FFF4E6", color: "#8A5A2B", texto: `⚠️ Último backup: ${fechaTexto} (hace más de 4 días)` },
    error:     { bg: "#FFE8E4", color: "#B3261E", texto: `❌ El último backup (${fechaTexto}) falló — revisar backup.log` },
  }[estado];

  return (
    <div style={{ background: estilos.bg, color: estilos.color, fontSize: 12, fontWeight: 600,
                  textAlign: "center", padding: "4px 8px" }}>
      {estilos.texto}
    </div>
  );
}

function App({ onLogout, rol }) {
  const esDeposito = rol === "deposito";
  const [tab, setTab] = useState(esDeposito ? "clientes" : "dashboard");
  const [loading, setLoading] = useState(true);
  const [ventas, setVentas] = useState([]);
  const [vendedoras, setVendedoras] = useState(INITIAL_VENDEDORAS);
  const [clientes, setClientes] = useState({});
  const [pagos, setPagos] = useState([]);
  const [catalogo, setCatalogo] = useState([]);
  const [ventaItems, setVentaItems] = useState([]);
  const [aliases, setAliases] = useState({});
  const [aliasClientes, setAliasClientes] = useState({});
  // Lo que no se pudo cargar al arrancar. Antes esto era un console.log y la app
  // seguia andando a medias sin que se notara (sin catalogo no hay costos, por ejemplo).
  const [avisoCarga, setAvisoCarga] = useState([]);

  // Load all data from Supabase on mount
  useEffect(() => {
    const loadData = async () => {
      // Las API keys de Gemini viven SOLO en este dispositivo (localStorage), a proposito.
      // Guardarlas en Supabase implicaba una tabla legible por cualquiera que tenga la
      // key publica, que esta en el repo: seria publicar las keys.

      // Catalogo de Costos + alias aprendidos (para el matching de articulos)
      const problemas = [];
      try {
        const cat = await armarCatalogoCompleto();
        if (cat.ok) setCatalogo(cat.rows);
        else problemas.push("catálogo de artículos: " + cat.error);

        const it = await traerTodo(sb, "venta_items");
        if (it.error) problemas.push("detalle por artículo: " + it.error);
        setVentaItems(it.rows);

        // Los alias crecen con cada correccion: sin paginar, pasadas las 1000 las
        // correcciones viejas dejaban de aplicarse y habia que rehacerlas.
        const alCli = await traerTodo(sb, "cliente_alias");
        if (alCli.error) problemas.push("alias de clientes: " + alCli.error);
        const mapaCli = {};
        alCli.rows.forEach(r => { if (r.texto && r.es_mismo !== false) mapaCli[r.texto] = r.nombre_real; });
        setAliasClientes(mapaCli);

        const al = await traerTodo(sb, "articulo_alias");
        if (al.error) problemas.push("alias de artículos: " + al.error);
        const mapa = {};
        al.rows.forEach(r => { if (r.texto) mapa[r.texto] = r.articulo_codigo; });
        setAliases(mapa);
      } catch (e) {
        problemas.push("catálogo/alias: " + (e.message || String(e)));
      }
      if (problemas.length) setAvisoCarga(problemas);

      setLoading(true);
      try {
        const [v, vend, c, p] = await Promise.all([
          dbGetAll("ventas"),
          dbGetAll("vendedoras"),
          dbGetAll("clientes"),
          dbGetAll("pagos"),
        ]);
        if (v) setVentas(v);
        if (vend && vend.length > 0) setVendedoras(vend);
        if (c) {
          const clientesObj = {};
          c.forEach(row => { clientesObj[row.nombre] = row.vendedora_id; });
          setClientes(clientesObj);
        }
        if (p) setPagos(p);
      } catch(e) {
        console.error("load error", e);
        setAvisoCarga(a => [...a, "ventas/vendedoras/clientes/pagos: " + (e.message || String(e))]);
      }
      setLoading(false);
    };
    loadData();
  }, []);

  // Devuelve { ok, error, avisos }. Quien la llama TIENE que mirar el ok antes de
  // decirle a la persona que la venta se guardo.
  const addVenta = async (venta) => {
    const { vendedoraId, _itemsCosto, ...rest } = venta;
    const row = { ...rest, vendedora_id: vendedoraId, fecha: venta.fecha || hoyLocal() };
    const { row: saved, error } = await dbInsert("ventas", row);
    if (error || !saved) return { ok: false, error: error || "No se pudo guardar", avisos: [] };
    setVentas(v => [saved, ...v]);

    // De aca en adelante la venta YA esta guardada. Si algo de esto falla, no se
    // pierde la venta, pero hay que avisarlo igual para que no quede incompleta en silencio.
    const avisos = [];

    // Detalle por articulo, para poder auditar el costo despues.
    if (_itemsCosto && _itemsCosto.length) {
      try {
        const filas = _itemsCosto.map(f => ({ ...f, venta_id: saved.id }));
        const { error: eIt } = await sb.from("venta_items").insert(filas);
        if (eIt) avisos.push("La venta se guardo, pero el detalle por articulo no: " + (eIt.message || ""));
      } catch (e) { avisos.push("La venta se guardo, pero el detalle por articulo no."); }
    }
    if (venta.cliente && venta.vendedoraId) {
      const clienteKey = venta.cliente.toLowerCase().trim();
      const { error: eCli } = await sb.from("clientes")
        .upsert([{ nombre: clienteKey, vendedora_id: venta.vendedoraId }], { onConflict: "nombre" });
      if (eCli) avisos.push("La venta se guardo, pero no se pudo vincular el cliente con la vendedora.");
      else setClientes(c => ({ ...c, [clienteKey]: venta.vendedoraId }));
    }
    return { ok: true, error: null, avisos };
  };

  // `mes` = el mes al que corresponde la comision (el mes de las ventas).
  // `fecha` = el dia en que se pago de verdad. Son dos cosas distintas.
  const addPago = async (vendedoraId, monto, mes) => {
    const row = { vendedora_id: vendedoraId, monto: Number(monto), mes, fecha: hoyLocal() };
    const { row: saved, error } = await dbInsert("pagos", row);
    if (error || !saved) return { ok: false, error: error || "No se pudo registrar el pago" };
    setPagos(p => [...p, { ...saved, vendedoraId: saved.vendedora_id }]);
    return { ok: true, error: null };
  };

  // Guarda que tal descripcion escrita a mano corresponde a tal articulo.
  // Al actualizar el estado `aliases`, el item se re-matchea solo y queda en verde.
  const guardarAlias = async (textoLeido, codigo) => {
    const clave = normTexto(textoLeido);
    if (!clave || !codigo) return { ok: false, error: "falta texto o código" };
    setAliases(a => ({ ...a, [clave]: codigo }));
    const { error } = await sb.from("articulo_alias")
      .upsert([{ texto: clave, articulo_codigo: String(codigo) }], { onConflict: "texto" });
    if (error) return { ok: false, error: error.message || JSON.stringify(error) };
    return { ok: true, error: null };
  };

  // Una sola consulta cada 100 ids en vez de una por venta, y el error se devuelve:
  // antes, si fallaba, las ventas quedaban sin marcar y nadie se enteraba.
  const marcarVentasPagadas = async (ids) => {
    for (let i = 0; i < ids.length; i += 100) {
      const lote = ids.slice(i, i + 100);
      const { error } = await sb.from("ventas").update({ pagado: true }).in("id", lote);
      if (error) return { ok: false, error: error.message || JSON.stringify(error) };
    }
    setVentas(v => v.map(vt => ids.includes(vt.id) ? { ...vt, pagado: true } : vt));
    return { ok: true, error: null };
  };

  // ── Corregir la vendedora de una venta mal cargada ──
  // Si la comision de esa venta YA se pago, el pago NO se toca: es plata que salio
  // de verdad y borrarla seria falsear el registro. Lo que se hace es destildar la
  // venta, para que vuelva a figurar pendiente para la vendedora correcta. El
  // resultado es el correcto: a la que cobro de mas le queda saldo negativo ese mes
  // y a la que corresponde le queda a pagar, y los dos saldos se compensan.
  // La correccion queda escrita en la nota de la venta, que es lo unico que despues
  // permite explicar de donde salio el descuadre.
  const cambiarVendedoraVenta = async (venta, nuevaId) => {
    const idViejo = venta.vendedora_id || venta.vendedoraId;
    const vieja = vendedoras.find(x => x.id === idViejo);
    const nueva = vendedoras.find(x => x.id === Number(nuevaId));
    if (!nueva) return { ok: false, error: "No encontré esa vendedora" };
    if (vieja && vieja.id === nueva.id) return { ok: false, error: "Ya es esa vendedora" };

    const d = new Date();
    const cuando = `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
    // .trim(): algunos nombres estan guardados con un espacio al final y la marca
    // salia con doble espacio, que despues rompe la busqueda del Dashboard.
    const marca = `[corregida ${cuando}: de ${vieja ? String(vieja.nombre).trim() : "?"} a ${String(nueva.nombre).trim()}]`;
    const updates = {
      vendedora_id: nueva.id,
      nota: venta.nota ? `${venta.nota} ${marca}` : marca,
    };
    // Estaba paga: vuelve a pendiente para que se le pueda pagar a la correcta.
    if (venta.pagado) updates.pagado = false;

    const r = await dbUpdate("ventas", venta.id, updates);
    if (!r.ok) return r;
    setVentas(vs => vs.map(v => v.id === venta.id ? { ...v, ...updates } : v));
    return { ok: true, error: null, eraPaga: !!venta.pagado, de: vieja ? String(vieja.nombre).trim() : "?", a: String(nueva.nombre).trim() };
  };

  // Cambiar el % de comision ahora se guarda. Antes solo cambiaba en pantalla y
  // volvia al valor viejo al recargar, despues de haber recalculado todo el historial.
  const cambiarComision = async (vendedoraId, comision) => {
    const r = await dbUpdate("vendedoras", vendedoraId, { comision: Number(comision) });
    if (!r.ok) return r;
    setVendedoras(vs => vs.map(vv => vv.id === vendedoraId ? { ...vv, comision: Number(comision) } : vv));
    return { ok: true, error: null };
  };

  if (loading) return (
    <div style={{ minHeight: "100vh", background: "#C87B5F", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'DM Sans',sans-serif" }}>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontFamily: "Georgia,serif", fontSize: 28, fontWeight: 900, color: "#2C1A14", marginBottom: 16 }}>CRITERIO</div>
        <span className="loading-dot"/><span className="loading-dot"/><span className="loading-dot"/>
      </div>
    </div>
  );

  const getVendedora = (id) => vendedoras.find(v => v.id === id);

  const getComisionMes = (vendedoraId, mesKey) => {
    const v = getVendedora(vendedoraId);
    if (!v) return 0;
    const totalVentas = ventas
      .filter(vt => (vt.vendedora_id || vt.vendedoraId) === vendedoraId && getMonthKey(vt.fecha) === mesKey)
      .reduce((s, vt) => s + Number(vt.total || 0), 0);
    return totalVentas * v.comision / 100;
  };

  const getPagadoMes = (vendedoraId, mesKey) => {
    return pagos
      .filter(p => (p.vendedora_id || p.vendedoraId) === vendedoraId && p.mes === mesKey)
      .reduce((s, p) => s + Number(p.monto || 0), 0);
  };

  const currentMes = getMonthKey(new Date());

  return (
    <div style={{ minHeight: "100vh", background: "#C87B5F", color: "#2C1A14", fontFamily: "'DM Sans', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Playfair+Display:wght@700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 4px; } .tab-scroll::-webkit-scrollbar { display: none; } ::-webkit-scrollbar-track { background: #111; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .tab-btn { background: none; border: none; cursor: pointer; padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; transition: all 0.2s; white-space: nowrap; }
        .tab-btn.active { color: #2C1A14; border-bottom: 2px solid #2C1A14; }
        .tab-btn:not(.active) { color: #2C1A14; }
        .tab-btn:hover:not(.active) { color: #5A3828; }
        .card { background: #FFFFFF; border: 1px solid #E8C4B0; border-radius: 12px; padding: 20px; }
        .btn { border: none; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; transition: all 0.15s; }
        .btn-primary { background: #F59E0B; color: #0A0A0F; padding: 10px 20px; font-size: 14px; }
        .btn-primary:hover { background: #FBBF24; transform: translateY(-1px); }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .input { background: #1A1A25; border: 1px solid #2A2A3E; border-radius: 8px; color: #F0EDE8; padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; width: 100%; outline: none; transition: border 0.2s; }
        .input:focus { border-color: #F59E0B; }
        select.input option { background: #1A1A25; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        @media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
        .stat-card { background: #FFFFFF; border: 1px solid #E8C4B0; border-radius: 12px; padding: 20px; position: relative; overflow: hidden; }
        .loading-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #F59E0B; animation: pulse 1s infinite; margin: 0 3px; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      `}</style>

      <UltimoBackup />

      {/* Header */}
      <div style={{ borderBottom: "1px solid #1E1E2E", padding: "0 24px" }}>
        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 0 0" }}>
            <div>
              <span style={{ fontFamily: "'Playfair Display', serif", fontSize: 22, fontWeight: 900, color: "#2C1A14", letterSpacing: "-0.02em" }}>CRITERIO</span>
              <span style={{ fontSize: 11, color: "#2C1A14", marginLeft: 10, letterSpacing: "0.15em", textTransform: "uppercase" }}>Ventas</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ fontSize: 12, color: "#2C1A14" }}>{new Date().toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" })}</div>
              {onLogout && <button onClick={onLogout} style={{ background: "none", border: "1px solid #B87060", borderRadius: 6, color: "#2C1A14", fontSize: 11, padding: "4px 10px", cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}>Salir</button>}
            </div>
          </div>
          <div style={{ display: "flex", gap: 0, marginTop: 8, overflowX: "auto", WebkitOverflowScrolling: "touch", scrollbarWidth: "none" }}>
            {(esDeposito
              ? [["clientes","Clientes"]]
              : [["dashboard","Dashboard"],["nueva","Nueva Venta"],["resumen","Resumen"],["comisiones","Comisiones"],["historial","Historial"],["articulos","Artículos"],["clientes","Clientes"],["comparar","Comparar"],["config","Config"]]
             ).map(([k,l]) => (
              <button key={k} className={`tab-btn ${tab===k?"active":""}`} onClick={() => setTab(k)}>{l}</button>
            ))}
          </div>
        </div>
      </div>

      {avisoCarga.length > 0 && (
        <div style={{ maxWidth: 900, margin: "12px auto 0", padding: "0 24px" }}>
          <div style={{ background: "#FFE8E4", border: "1px solid #E8A090", borderRadius: 8, padding: "10px 14px" }}>
            <p style={{ fontSize: 12, color: "#B3261E", fontWeight: 700, margin: 0 }}>
              ⚠ Hay datos que no se pudieron cargar — los números pueden estar incompletos
            </p>
            {avisoCarga.map((t, i) => (
              <p key={i} style={{ fontSize: 11, color: "#7A2E28", margin: "3px 0 0 0", wordBreak: "break-word" }}>· {t}</p>
            ))}
            <p style={{ fontSize: 11, color: "#7A2E28", margin: "6px 0 0 0" }}>
              Recargá la página. Si sigue pasando, avisá antes de cargar ventas.
            </p>
          </div>
